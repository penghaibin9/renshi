# Production deployment contract for the Yueke higher-education HR system.
#
# Run behind a TLS-terminating ingress/load balancer that forwards
# X-Forwarded-Proto=https. This file intentionally has no source-code bind mount,
# no public MySQL/Redis ports, and no per-replica migration.
#
#   docker compose -f docker-compose.production.yml up -d --build

x-app-environment: &app-environment
  DEBUG: "0"
  HORILLA_ENV: production
  SECRET_KEY: ${SECRET_KEY:?set a unique production SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set production hostnames}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set https trusted origins}
  TIME_ZONE: ${TIME_ZONE:-Asia/Shanghai}
  DB_ENGINE: django.db.backends.mysql
  DB_NAME: ${MYSQL_DATABASE:-horilla_db}
  DB_USER: ${MYSQL_USER:-horilla_user}
  DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
  DB_HOST: db
  DB_PORT: "3306"
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?set DB_INIT_PASSWORD}
  REDIS_URL: ${REDIS_URL:?set a private production REDIS_URL}
  COMPANY_SCOPED_PERMISSIONS: "True"
  TENANT_FAIL_CLOSED: "True"
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
  PLATFORM_TENANT_ELEVATION_MAX_MINUTES: ${PLATFORM_TENANT_ELEVATION_MAX_MINUTES:-60}

services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-horilla_db}
      MYSQL_USER: ${MYSQL_USER:-horilla_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-horilla_user} -p${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  release:
    build: .
    image: yueke-renshi:${IMAGE_TAG:-production}
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py check
    environment: *app-environment
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    image: yueke-renshi:${IMAGE_TAG:-production}
    environment:
      <<: *app-environment
      MIGRATE_ON_START: "0"
      COLLECTSTATIC_ON_START: "0"
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      release:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - staticfiles:/static:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  staticfiles:
  media:
  mysql_data:
  redis_data:
