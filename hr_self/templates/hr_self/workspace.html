<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ section_title }} · HR17</title><style>
:root{--p:#2563eb;--ink:#172033;--muted:#6b7280;--line:#e6ebf2;--bg:#f5f8fc;--good:#087a55;--warn:#a65f00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif}.shell{max-width:1280px;margin:auto;padding:24px}.hero{padding:26px;border-radius:22px;background:linear-gradient(135deg,#183a7a,#2563eb 62%,#5b8cff);color:#fff;box-shadow:0 18px 45px #245bcf24}.hero small{opacity:.78;letter-spacing:.15em}.hero h1{font-size:27px;margin:7px 0}.hero p{margin:0;color:#deebff}.nav{display:flex;gap:8px;overflow:auto;margin:16px 0}.nav a{white-space:nowrap;text-decoration:none;color:#536074;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px}.nav a.active{background:var(--p);border-color:var(--p);color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:5px}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 14px #20345c09}.panel h2{font-size:16px;margin:0 0 4px}.panel .desc{color:var(--muted);font-size:12px;margin:0 0 13px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.service{display:block;text-decoration:none;color:inherit;border:1px solid #e8edf5;border-radius:15px;padding:15px;min-height:112px;transition:.15s}.service:hover{transform:translateY(-1px);box-shadow:0 8px 20px #244a8f12}.service .domain{font-size:11px;color:#4268aa;letter-spacing:.08em}.service b{display:block;margin:7px 0;font-size:15px}.service small{color:var(--muted)}.pin{float:right;font-size:12px;color:#e17a00}.cap{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}.cap:last-child{border:0}.ok{color:var(--good)}.off{color:var(--warn)}.empty{grid-column:1/-1;padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.empty strong{display:block;color:#46566f;margin-bottom:6px}.error{margin:20px;padding:18px;border-radius:12px;background:#fff0f0;color:#a61b1b}.mobilebar{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.services{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){body{padding-bottom:68px}.shell{padding:12px}.hero{border-radius:18px;padding:21px}.hero h1{font-size:23px}.nav{display:none}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px}.stat b{font-size:20px}.services{grid-template-columns:1fr 1fr}.service{padding:13px;min-height:104px}.mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.mobilebar a{text-align:center;padding:11px 4px;color:#667085;text-decoration:none;font-size:11px}.mobilebar a.active{color:var(--p);font-weight:700}}
</style></head><body><main class="shell">{% if access_error %}<div class="error">{{ access_error }}</div>{% else %}<section class="hero"><small>EMPLOYEE SELF SERVICE · SELF IDENTITY</small><h1>{{ section_title }}</h1><p>只展示当前登录教职工本人可见的人事服务。身份由服务端登录态 + 当前学校解析，浏览器传入的 staff_id 不参与授权。</p></section><nav class="nav"><a class="{% if section == 'overview' %}active{% endif %}" href="/hr/self/">首页</a><a class="{% if section == 'services' %}active{% endif %}" href="/hr/self/services/">服务大厅</a><a class="{% if section == 'todos' %}active{% endif %}" href="/hr/self/todos/">待办</a><a class="{% if section == 'progress' %}active{% endif %}" href="/hr/self/progress/">进度</a><a class="{% if section == 'files' %}active{% endif %}" href="/hr/self/files/">文件</a><a class="{% if section == 'payslips' %}active{% endif %}" href="/hr/self/payslips/">工资条</a><a class="{% if section == 'contracts' %}active{% endif %}" href="/hr/self/contracts/">合同</a></nav><section class="stats" id="stats"></section><section class="layout"><div class="panel"><h2 id="panelTitle">本人服务</h2><p class="desc" id="panelDesc"></p><div id="services" class="services"><div class="empty">正在读取本人服务目录…</div></div></div><aside class="panel"><h2>体验能力接通状态</h2><div id="caps"></div></aside></section>{% endif %}</main><nav class="mobilebar"><a class="{% if section == 'overview' %}active{% endif %}" href="/hr/self/">首页</a><a class="{% if section == 'services' %}active{% endif %}" href="/hr/self/services/">服务</a><a class="{% if section == 'todos' %}active{% endif %}" href="/hr/self/todos/">待办</a><a class="{% if section == 'progress' %}active{% endif %}" href="/hr/self/progress/">进度</a><a class="{% if section == 'files' or section == 'payslips' or section == 'contracts' %}active{% endif %}" href="/hr/self/files/">我的</a></nav><script>
const section='{{ section|escapejs }}';const labels={availableServices:'可用服务',pinnedServices:'我的常用',sourceDomains:'接入业务域'};const names={selfIdentity:'SELF 身份',serviceCatalog:'服务目录',pinnedServices:'常用服务',home:'本人首页',hr03To16Providers:'HR03–16 Provider',todos:'统一待办',progress:'办理进度',files:'本人文件',payslipContractAggregation:'工资条/合同聚合',mobileHighFrequency:'移动端高频体验',idorGuard:'IDOR 防护'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function safeRoute(r){return typeof r==='string'&&r.startsWith('/')&&!r.startsWith('//')?r:'#'}function renderServices(items){return items.length?items.map(x=>`<a class="service" href="${safeRoute(x.route)}"><span class="domain">${esc(x.source_domain)}</span>${x.pinned?'<span class="pin">★ 常用</span>':''}<b>${esc(x.name)}</b><small>${esc(x.action_key)}</small></a>`).join(''):'<div class="empty">当前学校尚未配置教职工服务目录</div>'}function unavailable(title,msg){return `<div class="empty"><strong>${esc(title)}</strong>${esc(msg)}</div>`}
function renderSection(d){const title=document.getElementById('panelTitle'),desc=document.getElementById('panelDesc'),box=document.getElementById('services');if(section==='services'){title.textContent='服务大厅';desc.textContent='真实服务目录来自当前学校配置，所有写操作继续路由到 HR03–HR16 对应 Authority。';box.innerHTML=renderServices(d.services||[]);return}if(section==='overview'){title.textContent='我的常用与高频服务';desc.textContent='优先展示本人固定入口；不会复制任何业务域正式状态机。';const pins=(d.services||[]).filter(x=>x.pinned);box.innerHTML=renderServices(pins.length?pins:(d.services||[]).slice(0,6));return}if(section==='payslips'){title.textContent='我的工资条';desc.textContent='工资条必须由 HR15 Provider 按服务端 SELF context 返回，浏览器不能指定 staff_id。';box.innerHTML=unavailable('工资条 Provider 未接通','未接通 HR15 本人工资条 Provider 前，不从旧 payroll 或他人参数拼装工资条');return}if(section==='contracts'){title.textContent='我的合同';desc.textContent='合同必须由 HR07 Provider 按服务端 SELF context 返回；合同文件下载需独立权限链。';box.innerHTML=unavailable('合同 Provider 未接通','HR07 Authority / 文件下载链未接通前不展示伪合同记录');return}const meta={todos:['我的待办','统一待办 Provider 尚未接通；不会把服务目录条目伪装成待办。'],progress:['办理进度','跨 HR03–HR16 进度 Provider 尚未接通；不会自行复制业务状态机。'],files:['我的文件','文件聚合与下载权限链尚未接通；未验证 SELF scope 前不展示文件。']};title.textContent=meta[section][0];desc.textContent=meta[section][1];box.innerHTML=unavailable('对应 Provider 未接通','该本人服务工作区已就位，等待业务域安全接入')}
async function boot(){const r=await fetch('/api/v1/hr/self/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok){document.getElementById('services').innerHTML='<div class="empty">本人身份或服务数据读取失败（'+r.status+'）</div>';return}const d=await r.json();document.getElementById('stats').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="stat"><span>${v}</span><b>${esc(d.summary[k])}</b></div>`).join('');renderSection(d);document.getElementById('caps').innerHTML=Object.entries(d.capabilities).map(([k,v])=>`<div class="cap"><span>${names[k]||k}</span><b class="${v?'ok':'off'}">${v?'已接通':'待 Provider'}</b></div>`).join('')}boot();
</script></body></html>
