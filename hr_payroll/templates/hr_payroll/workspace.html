<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ section_title }} · HR15</title><style>
:root{--p:#0f766e;--ink:#102a2e;--muted:#66777b;--line:#dfe9e8;--bg:#f3f8f7;--good:#047857;--warn:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif}.shell{max-width:1500px;margin:auto;padding:26px}.hero{position:relative;overflow:hidden;padding:30px;border-radius:22px;background:linear-gradient(135deg,#0b2d32,#0f766e 58%,#2ca99c);color:#fff;box-shadow:0 18px 45px #0d5b5428}.hero:after{content:"HR15";position:absolute;right:30px;top:-24px;font-size:112px;font-weight:800;opacity:.07}.eyebrow{font-size:12px;letter-spacing:.16em;opacity:.76}.hero h1{margin:7px 0 6px;font-size:28px}.hero p{margin:0;max-width:920px;color:#d8fffa}.nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.nav a{white-space:nowrap;padding:9px 13px;border-radius:10px;text-decoration:none;color:#4f6265;background:#fff;border:1px solid var(--line)}.nav a.active{color:#fff;background:var(--p);border-color:var(--p)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;margin-top:5px;font-size:23px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,.9fr);gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 15px #11383a0a}.panel h2{font-size:16px;margin:0 0 4px}.panel .desc{color:var(--muted);font-size:12px;margin:0 0 13px}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr .9fr .85fr .85fr;gap:12px;align-items:center;padding:11px 12px;border:1px solid #e8efee;border-radius:12px}.row small{color:var(--muted)}.badge{justify-self:start;padding:3px 9px;border-radius:99px;background:#e9f7f4;color:#0c6c63;font-size:12px}.cap{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.cap:last-child{border:0}.ok{color:var(--good)}.off{color:var(--warn)}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.empty strong{display:block;color:#345b58;margin-bottom:6px}.money{font-variant-numeric:tabular-nums}.error{margin:20px;padding:18px;border-radius:12px;background:#fff0f0;color:#a61b1b}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:680px){.shell{padding:14px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
</style></head><body><main class="shell">{% if access_error %}<div class="error">{{ access_error }}</div>{% else %}<section class="hero"><div class="eyebrow">PAYROLL & BENEFITS · CONTROL CENTER</div><h1>{{ section_title }}</h1><p>薪酬档案、期间、核算、项目规则、津补贴、社保公积金、正式结果、支付、对账与旧系统接管分开治理。FINAL 薪酬事实不可原地修改，追溯调整必须形成新差额事实。</p></section><nav class="nav"><a class="{% if section == 'overview' %}active{% endif %}" href="/hr/payroll/">总览</a><a class="{% if section == 'profiles' %}active{% endif %}" href="/hr/payroll/profiles/">薪酬档案</a><a class="{% if section == 'periods' %}active{% endif %}" href="/hr/payroll/periods/">工资期间</a><a class="{% if section == 'calculations' %}active{% endif %}" href="/hr/payroll/calculations/">工资核算</a><a class="{% if section == 'rules' %}active{% endif %}" href="/hr/payroll/rules/">薪资规则</a><a class="{% if section == 'allowances' %}active{% endif %}" href="/hr/payroll/allowances/">津补贴</a><a class="{% if section == 'social_security' %}active{% endif %}" href="/hr/payroll/social-security/">社保公积金</a><a class="{% if section == 'results' %}active{% endif %}" href="/hr/payroll/results/">正式结果</a><a class="{% if section == 'payments' %}active{% endif %}" href="/hr/payroll/payments/">支付工资条</a><a class="{% if section == 'reconciliation' %}active{% endif %}" href="/hr/payroll/reconciliation/">财务对账</a><a class="{% if section == 'legacy_takeover' %}active{% endif %}" href="/hr/payroll/legacy-takeover/">旧系统接管</a></nav><section class="grid" id="kpis"></section><section class="layout"><div class="panel"><h2 id="listTitle">当前工作区</h2><p class="desc" id="listDesc"></p><div id="rows" class="rows"><div class="empty">正在读取薪酬 Authority…</div></div></div><aside class="panel"><h2>能力接管状态</h2><div id="caps"></div></aside></section>{% endif %}</main><script>
const section='{{ section|escapejs }}';const labels={activeProfiles:'活动薪酬档案',periods:'工资期间',openPeriods:'未封板期间',finalizedResults:'正式/调整结果',latestPeriodStatus:'最近期间状态',latestPeriodNet:'最近期间实发'};const names={profile:'薪酬档案',period:'工资期间',resultFact:'正式结果事实',finalization:'封板语义',salaryItemRules:'薪资项目/规则',fullCalculation:'完整计算引擎',allowanceBenefits:'津补贴',socialInsuranceHousingFund:'社保/公积金/年金',payment:'支付与工资条',financeReconciliation:'财务对账',legacyTakeover:'旧 payroll 接管'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function periodRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.period_code)}</b><br><small>${esc(x.start_date)} → ${esc(x.end_date)}</small></div><span class="badge">${esc(x.status)}</span><small>${x.finalized_at?'已封板':'未封板'}</small><small>${esc((x.finalized_at||'').slice(0,10)||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无工资期间</div>'}
function resultRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.result_no)}</b><br><small>Staff ${esc(x.staff_id)}</small></div><div class="money">${esc(x.currency_code)} ${esc(x.net_amount)}</div><span class="badge">${esc(x.status)}</span><small>应发 ${esc(x.gross_amount)} / 扣减 ${esc(x.deduction_amount)}</small></div>`).join(''):'<div class="empty">当前学校暂无薪酬结果事实</div>'}
function profileRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.payroll_identity_no)}</b><br><small>Staff ${esc(x.staff_id)}</small></div><div>${esc(x.pay_group_code)}</div><span class="badge">${esc(x.status)}</span><small>${esc(x.effective_from||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无薪酬档案</div>'}
function unavailable(title,msg){return `<div class="empty"><strong>${esc(title)}</strong>${esc(msg)}</div>`}
function renderSection(d){const title=document.getElementById('listTitle'),desc=document.getElementById('listDesc'),rows=document.getElementById('rows');if(section==='profiles'){title.textContent='薪酬档案';desc.textContent='展示 HR15 PayrollProfile；只记录薪酬身份与分组，不从旧工资条反推正式档案。';rows.innerHTML=profileRows(d.recentProfiles||[]);return}if(section==='periods'){title.textContent='工资期间';desc.textContent='期间状态来自 HR15 Authority；FINALIZED/CLOSED 不可被前端回写。';rows.innerHTML=periodRows(d.recentPeriods||[]);return}if(section==='calculations'){title.textContent='工资核算';desc.textContent='展示可进入核算的真实工资期间；完整计算引擎未接通时禁止伪造“开始核算/核算成功”。';rows.innerHTML=periodRows(d.recentPeriods||[]);return}if(section==='results'){title.textContent='正式薪酬结果';desc.textContent='只展示 FINALIZED / ADJUSTED 等 HR15 ResultFact；支付状态与工资条是后续 Provider，不混入正式金额事实。';rows.innerHTML=resultRows(d.recentResults||[]);return}if(section==='rules'){title.textContent='薪资项目与规则';desc.textContent='规则版本、项目公式与计算依赖必须可追溯，不能从结果金额反推规则。';rows.innerHTML=unavailable('薪资规则 Authority 未接通','等待薪资项目、版本化规则与计算合同');return}if(section==='allowances'){title.textContent='津贴与补贴';desc.textContent='津贴、补贴需独立项目与适用范围，不能与社保公积金扣缴逻辑混用。';rows.innerHTML=unavailable('津补贴 Authority 未接通','等待津贴项目、规则与人员适用事实');return}if(section==='social_security'){title.textContent='社保公积金与年金';desc.textContent='基数、比例、上下限、地区和有效期必须版本化。';rows.innerHTML=unavailable('社保公积金 Authority 未接通','不会用固定比例或结果差额反推缴费明细');return}if(section==='payments'){title.textContent='支付与工资条';desc.textContent='支付回执和本人可下载工资条需独立 Provider；正式结果存在不等于已支付。';rows.innerHTML=unavailable('支付 / 工资条 Provider 未接通','未获得支付回执前不显示“已发放”');return}if(section==='reconciliation'){title.textContent='财务对账';desc.textContent='HR15 正式结果与财务支付/凭证必须逐批对账，异常单独暴露。';rows.innerHTML=unavailable('财务对账链未接通','等待财务 Provider、批次回执和差异事实');return}if(section==='legacy_takeover'){title.textContent='旧 payroll 接管';desc.textContent='旧 Horilla payroll 仅作为迁移技术源；双读、差异、回放和冻结旧写入口完成前不宣称接管成功。';rows.innerHTML=unavailable('旧 payroll 尚未完成接管','必须先映射、双读、对账，再切 Authority');return}title.textContent='薪酬档案与最近期间';desc.textContent='总览展示真实薪酬档案，并通过 KPI 观察期间与正式结果。';rows.innerHTML=profileRows(d.recentProfiles||[])||periodRows(d.recentPeriods||[])}
async function boot(){const r=await fetch('/api/v1/hr/payroll/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok){document.getElementById('rows').innerHTML='<div class="empty">数据读取失败（'+r.status+'）</div>';return}const d=await r.json();document.getElementById('kpis').innerHTML=Object.entries(labels).map(([k,v])=>{let x=d.summary[k];if(k==='latestPeriodNet')x=x==null?'未形成正式结果':'¥ '+x;if(k==='latestPeriodStatus')x=x||'暂无期间';return `<div class="kpi"><span>${v}</span><b class="${k==='latestPeriodNet'?'money':''}">${esc(x)}</b></div>`}).join('');renderSection(d);document.getElementById('caps').innerHTML=Object.entries(d.capabilities).map(([k,v])=>`<div class="cap"><span>${names[k]||k}</span><b class="${v?'ok':'off'}">${v?'已接通':'待施工'}</b></div>`).join('')}boot();
</script></body></html>
