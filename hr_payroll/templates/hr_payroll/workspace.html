<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ section_title }} · HR15</title><style>
:root{--p:#0f766e;--ink:#102a2e;--muted:#66777b;--line:#dfe9e8;--bg:#f3f8f7;--card:#fff;--good:#047857;--warn:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif}.shell{max-width:1500px;margin:auto;padding:26px}.hero{position:relative;overflow:hidden;padding:30px;border-radius:22px;background:linear-gradient(135deg,#0b2d32,#0f766e 58%,#2ca99c);color:#fff;box-shadow:0 18px 45px #0d5b5428}.hero:after{content:"HR15";position:absolute;right:30px;top:-24px;font-size:112px;font-weight:800;opacity:.07}.eyebrow{font-size:12px;letter-spacing:.16em;opacity:.76}.hero h1{margin:7px 0 6px;font-size:28px}.hero p{margin:0;max-width:880px;color:#d8fffa}.nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.nav a{white-space:nowrap;padding:9px 13px;border-radius:10px;text-decoration:none;color:#4f6265;background:#fff;border:1px solid var(--line)}.nav a.active{color:#fff;background:var(--p);border-color:var(--p)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;margin-top:5px;font-size:23px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,.9fr);gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 15px #11383a0a}.panel h2{font-size:16px;margin:0 0 4px}.panel .desc{color:var(--muted);font-size:12px;margin:0 0 13px}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr .9fr .85fr .85fr;gap:12px;align-items:center;padding:11px 12px;border:1px solid #e8efee;border-radius:12px}.row small{color:var(--muted)}.badge{justify-self:start;padding:3px 9px;border-radius:99px;background:#e9f7f4;color:#0c6c63;font-size:12px}.cap{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.cap:last-child{border:0}.ok{color:var(--good)}.off{color:var(--warn)}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.money{font-variant-numeric:tabular-nums}.error{margin:20px;padding:18px;border-radius:12px;background:#fff0f0;color:#a61b1b}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:680px){.shell{padding:14px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
</style></head><body><main class="shell">{% if access_error %}<div class="error">{{ access_error }}</div>{% else %}<section class="hero"><div class="eyebrow">PAYROLL & BENEFITS · CONTROL CENTER</div><h1>{{ section_title }}</h1><p>工资期间、正式结果、福利与财务对账统一查看。FINAL 薪酬事实不可原地修改；旧 Horilla payroll 仅作为迁移技术源，未完成对账前不会冒充新 Authority。</p></section><nav class="nav"><a class="{% if section == 'overview' %}active{% endif %}" href="/hr/payroll/">总览</a><a class="{% if section == 'periods' %}active{% endif %}" href="/hr/payroll/periods/">工资期间</a><a class="{% if section == 'rules' %}active{% endif %}" href="/hr/payroll/rules/">薪资项目规则</a><a class="{% if section == 'benefits' %}active{% endif %}" href="/hr/payroll/benefits/">津补贴/五险一金</a><a class="{% if section == 'payments' %}active{% endif %}" href="/hr/payroll/payments/">支付与工资条</a><a class="{% if section == 'reconciliation' %}active{% endif %}" href="/hr/payroll/reconciliation/">财务对账/旧系统</a></nav><section class="grid" id="kpis"></section><section class="layout"><div class="panel"><h2 id="listTitle">当前工作区</h2><p class="desc" id="listDesc"></p><div id="rows" class="rows"><div class="empty">正在读取薪酬 Authority…</div></div></div><aside class="panel"><h2>能力接管状态</h2><div id="caps"></div></aside></section>{% endif %}</main><script>
const section='{{ section|escapejs }}';const labels={activeProfiles:'活动薪酬档案',periods:'工资期间',openPeriods:'未封板期间',finalizedResults:'正式/调整结果',latestPeriodStatus:'最近期间状态',latestPeriodNet:'最近期间实发'};const names={profile:'薪酬档案',period:'工资期间',resultFact:'正式结果事实',finalization:'封板语义',salaryItemRules:'薪资项目/规则',fullCalculation:'完整计算引擎',allowanceBenefits:'津补贴',socialInsuranceHousingFund:'社保/公积金/年金',payment:'支付与工资条',financeReconciliation:'财务对账',legacyTakeover:'旧 payroll 接管'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function periodRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.period_code)}</b><br><small>${esc(x.start_date)} → ${esc(x.end_date)}</small></div><span class="badge">${esc(x.status)}</span><small>${x.finalized_at?'已封板':'未封板'}</small><small>${esc((x.finalized_at||'').slice(0,10)||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无工资期间</div>'}
function resultRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.result_no)}</b><br><small>Staff ${esc(x.staff_id)}</small></div><div class="money">${esc(x.currency_code)} ${esc(x.net_amount)}</div><span class="badge">${esc(x.status)}</span><small>应发 ${esc(x.gross_amount)} / 扣减 ${esc(x.deduction_amount)}</small></div>`).join(''):'<div class="empty">当前学校暂无薪酬结果事实</div>'}
function profileRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.payroll_identity_no)}</b><br><small>Staff ${esc(x.staff_id)}</small></div><div>${esc(x.pay_group_code)}</div><span class="badge">${esc(x.status)}</span><small>${esc(x.effective_from||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无薪酬档案</div>'}
function renderSection(d){const title=document.getElementById('listTitle'),desc=document.getElementById('listDesc'),rows=document.getElementById('rows');if(section==='periods'){title.textContent='工资期间';desc.textContent='期间状态来自 HR15 Authority；FINALIZED/CLOSED 不可被前端回写。';rows.innerHTML=periodRows(d.recentPeriods||[]);return}if(section==='payments'){title.textContent='正式工资结果 / 工资条底座';desc.textContent='展示正式/调整结果事实；支付 Provider 与个人工资条下载仍未接通时不伪造“已支付”。';rows.innerHTML=resultRows(d.recentResults||[]);return}if(section==='rules'||section==='benefits'||section==='reconciliation'){const map={rules:['薪资项目与规则','规则版本、公式和完整计算引擎尚待 Authority；当前不从结果金额反推规则。'],benefits:['津补贴 / 社保公积金','津补贴、社保、公积金、职业年金独立明细尚待接通。'],reconciliation:['财务对账 / 旧 payroll 接管','旧 Horilla payroll 仍是迁移技术源；未完成双读对账前不会标记完成接管。']};title.textContent=map[section][0];desc.textContent=map[section][1];rows.innerHTML='<div class="empty">该子域尚无独立正式事实，页面已就位，等待 Authority / Provider 接入</div>';return}title.textContent='薪酬档案与最近期间';desc.textContent='总览展示真实薪酬档案，KPI 同时反映期间与正式结果。';rows.innerHTML=profileRows(d.recentProfiles||[])||periodRows(d.recentPeriods||[])}
async function boot(){const r=await fetch('/api/v1/hr/payroll/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok){document.getElementById('rows').innerHTML='<div class="empty">数据读取失败（'+r.status+'）</div>';return}const d=await r.json();document.getElementById('kpis').innerHTML=Object.entries(labels).map(([k,v])=>{let x=d.summary[k];if(k==='latestPeriodNet')x=x==null?'未形成正式结果':'¥ '+x;if(k==='latestPeriodStatus')x=x||'暂无期间';return `<div class="kpi"><span>${v}</span><b class="${k==='latestPeriodNet'?'money':''}">${esc(x)}</b></div>`}).join('');renderSection(d);document.getElementById('caps').innerHTML=Object.entries(d.capabilities).map(([k,v])=>`<div class="cap"><span>${names[k]||k}</span><b class="${v?'ok':'off'}">${v?'已接通':'待施工'}</b></div>`).join('')}boot();
</script></body></html>
