<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ section_title }} · HR14</title><style>
:root{--p:#5b4bc4;--ink:#1f2440;--muted:#6d7188;--line:#e8e7f2;--bg:#f7f6fb;--good:#0b7d5d;--warn:#a65f00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif}.shell{max-width:1500px;margin:auto;padding:26px}.hero{position:relative;overflow:hidden;padding:30px;border-radius:22px;background:linear-gradient(135deg,#24214c,#5b4bc4 60%,#8d7cf2);color:#fff;box-shadow:0 18px 45px #4b3fa828}.hero:after{content:"HR14";position:absolute;right:30px;top:-24px;font-size:112px;font-weight:800;opacity:.07}.eyebrow{font-size:12px;letter-spacing:.16em;opacity:.76}.hero h1{margin:7px 0 6px;font-size:28px}.hero p{margin:0;max-width:900px;color:#edeaff}.nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.nav a{white-space:nowrap;padding:9px 13px;border-radius:10px;text-decoration:none;color:#555b73;background:#fff;border:1px solid var(--line)}.nav a.active{color:#fff;background:var(--p);border-color:var(--p)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;margin-top:5px;font-size:24px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,.85fr);gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 15px #2b24520a}.panel h2{font-size:16px;margin:0 0 4px}.panel .desc{color:var(--muted);font-size:12px;margin:0 0 13px}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:1.15fr .8fr .75fr .7fr;gap:12px;align-items:center;padding:11px 12px;border:1px solid #efedf7;border-radius:12px}.row small{color:var(--muted)}.badge{justify-self:start;padding:3px 9px;border-radius:99px;background:#f0edff;color:#5141b5;font-size:12px}.cap{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.cap:last-child{border:0}.ok{color:var(--good)}.off{color:var(--warn)}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.empty strong{display:block;color:#4c4662;margin-bottom:6px}.error{margin:20px;padding:18px;border-radius:12px;background:#fff0f0;color:#a61b1b}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:680px){.shell{padding:14px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
</style></head><body><main class="shell">{% if access_error %}<div class="error">{{ access_error }}</div>{% else %}<section class="hero"><div class="eyebrow">POSITION APPOINTMENT · COMPETITION WORKSPACE</div><h1>{{ section_title }}</h1><p>岗位供给、竞聘批次、申报、评议排序、公示、正式聘任与聘期变更各自拥有明确工作区；职称取得不等于岗位聘任，聘任结果也不直接改工资。</p></section><nav class="nav"><a class="{% if section == 'overview' %}active{% endif %}" href="/hr/appointments/">总览</a><a class="{% if section == 'policies' %}active{% endif %}" href="/hr/appointments/policies/">聘任制度</a><a class="{% if section == 'quota' %}active{% endif %}" href="/hr/appointments/quota/">岗位额度</a><a class="{% if section == 'competitions' %}active{% endif %}" href="/hr/appointments/competitions/">竞聘批次</a><a class="{% if section == 'applications' %}active{% endif %}" href="/hr/appointments/applications/">竞聘申报</a><a class="{% if section == 'ranking' %}active{% endif %}" href="/hr/appointments/ranking/">评议排序</a><a class="{% if section == 'publicity' %}active{% endif %}" href="/hr/appointments/publicity/">拟聘公示</a><a class="{% if section == 'appointments' %}active{% endif %}" href="/hr/appointments/appointments/">正式聘任</a><a class="{% if section == 'term_changes' %}active{% endif %}" href="/hr/appointments/term-changes/">聘期变更</a></nav><section class="grid" id="kpis"></section><section class="layout"><div class="panel"><h2 id="listTitle">当前工作区</h2><p class="desc" id="listDesc"></p><div id="rows" class="rows"><div class="empty">正在读取当前学校真实数据…</div></div></div><aside class="panel"><h2>业务能力接通状态</h2><div id="caps"></div></aside></section>{% endif %}</main><script>
const section='{{ section|escapejs }}';const labels={policyVersions:'制度版本',applications:'竞聘申请',awaitingReview:'待评议',proposed:'拟聘',inPublicity:'公示中',effectiveAppointments:'有效聘任'};const names={policy:'聘任制度',application:'竞聘申请',appointmentFact:'正式聘任事实',quotaSnapshot:'岗位额度快照',competition:'竞聘批次',reviewRanking:'评议排序',publicity:'拟聘公示',termChange:'聘期变更'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function appRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.case_no)}</b><br><small>岗位 ${esc(x.position_instance_id)}</small></div><div>${esc(x.batch_no||'-')}</div><span class="badge">${esc(x.status)}</span><small>${esc((x.updated_at||'').slice(0,10))}</small></div>`).join(''):'<div class="empty">当前学校暂无岗位竞聘申请</div>'}
function factRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.appointment_no)}</b><br><small>岗位 ${esc(x.position_instance_id)}</small></div><div>${esc(x.level_code||'-')}</div><span class="badge">${esc(x.status)}</span><small>${esc(x.effective_from||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无正式聘任事实</div>'}
function policyRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.name||x.policy_code)}</b><br><small>${esc(x.policy_code)} · v${esc(x.version_no)}</small></div><div>${esc(x.position_category||x.level_code||'-')}</div><span class="badge">${esc(x.status)}</span><small>${esc(x.effective_from||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无岗位聘任制度版本</div>'}
function unavailable(title,msg){return `<div class="empty"><strong>${esc(title)}</strong>${esc(msg)}</div>`}
function renderSection(d){const title=document.getElementById('listTitle'),desc=document.getElementById('listDesc'),rows=document.getElementById('rows');if(section==='policies'){title.textContent='聘任制度';desc.textContent='展示 HR14 冻结制度版本，历史版本不可被静默覆盖。';rows.innerHTML=policyRows(d.recentPolicies||[]);return}if(section==='applications'){title.textContent='竞聘申报';desc.textContent='展示真实竞聘申请；不以申请数量反推岗位余量。';rows.innerHTML=appRows(d.recentApplications||[]);return}if(section==='appointments'){title.textContent='正式岗位聘任';desc.textContent='仅展示 HR14 正式聘任事实；职称结果不是岗位聘任事实。';rows.innerHTML=factRows(d.recentAppointments||[]);return}if(section==='ranking'||section==='publicity'){title.textContent=section==='ranking'?'评议排序':'拟聘公示';desc.textContent=section==='ranking'?'独立评议排序 Authority 尚未接通；只展示进入评议阶段的真实申请。':'独立公示 Authority 尚未接通；只展示 PUBLICITY 状态的真实申请。';const filtered=(d.recentApplications||[]).filter(x=>section==='ranking'?['ELIGIBLE','UNDER_REVIEW'].includes(x.status):x.status==='PUBLICITY');rows.innerHTML=filtered.length?appRows(filtered):unavailable(section==='ranking'?'评议排序未接通':'拟聘公示未接通','当前没有可由正式事实支持的独立记录');return}if(section==='quota'){title.textContent='岗位额度快照';desc.textContent='额度必须来自 HR02 Provider 并冻结为竞聘批次快照。';rows.innerHTML=unavailable('岗位额度 Authority 未接通','不以岗位数减申请数伪造“剩余额度”');return}if(section==='competitions'){title.textContent='竞聘批次';desc.textContent='竞聘批次需固化岗位范围、额度版本、时间窗和适用规则。';rows.innerHTML=unavailable('竞聘批次 Authority 未接通','现有 batch_no 仅是申请上的引用，不冒充完整竞聘批次事实');return}if(section==='term_changes'){title.textContent='聘期变更';desc.textContent='续聘、终止、调整必须形成可追溯变更事实，不能原地覆盖正式聘任。';rows.innerHTML=unavailable('聘期变更 Authority 未接通','当前正式聘任事实可读，但独立聘期变更链尚未交付');return}title.textContent='聘任制度与正式结果';desc.textContent='总览同时观察制度、竞聘申请和正式聘任，不混淆上游职称与下游工资。';rows.innerHTML=policyRows(d.recentPolicies||[])||factRows(d.recentAppointments||[])}
async function boot(){const r=await fetch('/api/v1/hr/appointments/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok){document.getElementById('rows').innerHTML='<div class="empty">数据读取失败（'+r.status+'）</div>';return}const d=await r.json();document.getElementById('kpis').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="kpi"><span>${v}</span><b>${esc(d.summary[k])}</b></div>`).join('');renderSection(d);document.getElementById('caps').innerHTML=Object.entries(d.capabilities).map(([k,v])=>`<div class="cap"><span>${names[k]||k}</span><b class="${v?'ok':'off'}">${v?'已接通':'待 Authority'}</b></div>`).join('')}boot();
</script></body></html>
