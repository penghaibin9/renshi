<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ section_title }} · HR14</title><style>
:root{--p:#5b4bc4;--p2:#7b61e8;--ink:#1f2440;--muted:#6d7188;--line:#e8e7f2;--bg:#f7f6fb;--card:#fff;--good:#0b7d5d;--warn:#a65f00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif}.shell{max-width:1500px;margin:auto;padding:26px}.hero{position:relative;overflow:hidden;padding:30px;border-radius:22px;background:linear-gradient(135deg,#24214c,#5b4bc4 60%,#8d7cf2);color:#fff;box-shadow:0 18px 45px #4b3fa828}.hero:after{content:"HR14";position:absolute;right:30px;top:-24px;font-size:112px;font-weight:800;opacity:.07}.eyebrow{font-size:12px;letter-spacing:.16em;opacity:.76}.hero h1{margin:7px 0 6px;font-size:28px}.hero p{margin:0;max-width:840px;color:#edeaff}.nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.nav a{white-space:nowrap;padding:9px 13px;border-radius:10px;text-decoration:none;color:#555b73;background:#fff;border:1px solid var(--line)}.nav a.active{color:#fff;background:var(--p);border-color:var(--p)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;margin-top:5px;font-size:24px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,.85fr);gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 15px #2b24520a}.panel h2{font-size:16px;margin:0 0 4px}.panel .desc{color:var(--muted);font-size:12px;margin:0 0 13px}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:1.15fr .8fr .75fr .7fr;gap:12px;align-items:center;padding:11px 12px;border:1px solid #efedf7;border-radius:12px}.row small{color:var(--muted)}.badge{justify-self:start;padding:3px 9px;border-radius:99px;background:#f0edff;color:#5141b5;font-size:12px}.cap{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.cap:last-child{border:0}.ok{color:var(--good)}.off{color:var(--warn)}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.error{margin:20px;padding:18px;border-radius:12px;background:#fff0f0;color:#a61b1b}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:680px){.shell{padding:14px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
</style></head><body><main class="shell">{% if access_error %}<div class="error">{{ access_error }}</div>{% else %}<section class="hero"><div class="eyebrow">POSITION APPOINTMENT · COMPETITION WORKSPACE</div><h1>{{ section_title }}</h1><p>把岗位供给、竞聘申报、评议排序、拟聘公示与正式聘任放进一个可审计工作区；职称取得不等于岗位聘任，聘任结果也不直接改工资。</p></section><nav class="nav"><a class="{% if section == 'overview' %}active{% endif %}" href="/hr/appointments/">总览</a><a class="{% if section == 'supply' %}active{% endif %}" href="/hr/appointments/supply/">岗位额度</a><a class="{% if section == 'applications' %}active{% endif %}" href="/hr/appointments/applications/">竞聘申报</a><a class="{% if section == 'review' %}active{% endif %}" href="/hr/appointments/review/">评议排序</a><a class="{% if section == 'publicity' %}active{% endif %}" href="/hr/appointments/publicity/">拟聘公示</a><a class="{% if section == 'terms' %}active{% endif %}" href="/hr/appointments/terms/">聘期变更</a></nav><section class="grid" id="kpis"></section><section class="layout"><div class="panel"><h2 id="listTitle">当前工作区</h2><p class="desc" id="listDesc"></p><div id="rows" class="rows"><div class="empty">正在读取当前学校真实数据…</div></div></div><aside class="panel"><h2>业务能力接通状态</h2><div id="caps"></div></aside></section>{% endif %}</main><script>
const section='{{ section|escapejs }}';const labels={policyVersions:'制度版本',applications:'竞聘申请',awaitingReview:'待评议',proposed:'拟聘',inPublicity:'公示中',effectiveAppointments:'有效聘任'};const names={policy:'聘任制度',application:'竞聘申请',appointmentFact:'正式聘任事实',quotaSnapshot:'岗位额度快照',competition:'竞聘批次',reviewRanking:'评议排序',publicity:'拟聘公示',termChange:'聘期变更'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function appRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.case_no)}</b><br><small>岗位 ${esc(x.position_instance_id)}</small></div><div>${esc(x.batch_no||'-')}</div><span class="badge">${esc(x.status)}</span><small>${esc((x.updated_at||'').slice(0,10))}</small></div>`).join(''):'<div class="empty">当前学校暂无岗位竞聘申请</div>'}
function factRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.appointment_no)}</b><br><small>岗位 ${esc(x.position_instance_id)}</small></div><div>${esc(x.level_code||'-')}</div><span class="badge">${esc(x.status)}</span><small>${esc(x.effective_from||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无正式聘任事实</div>'}
function policyRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.name||x.policy_code)}</b><br><small>${esc(x.policy_code)} · v${esc(x.version_no)}</small></div><div>${esc(x.position_category||x.level_code||'-')}</div><span class="badge">${esc(x.status)}</span><small>${esc(x.effective_from||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无岗位聘任制度版本</div>'}
function renderSection(d){const title=document.getElementById('listTitle'),desc=document.getElementById('listDesc'),rows=document.getElementById('rows');if(section==='applications'){title.textContent='竞聘申报';desc.textContent='展示真实岗位竞聘申请；岗位额度与批次 Authority 未接通时不推导虚假余量。';rows.innerHTML=appRows(d.recentApplications||[]);return}if(section==='terms'){title.textContent='正式聘任与聘期';desc.textContent='展示 HR14 正式聘任事实；聘期变更仍需独立事实链。';rows.innerHTML=factRows(d.recentAppointments||[]);return}if(section==='review'||section==='publicity'){title.textContent=section==='review'?'评议排序':'拟聘公示';desc.textContent=section==='review'?'评议排序 Authority 尚未接通，当前只展示进入评议阶段的真实申请。':'公示 Authority 尚未接通，当前只展示 PUBLICITY 状态的真实申请。';const filtered=(d.recentApplications||[]).filter(x=>section==='review'?['ELIGIBLE','UNDER_REVIEW'].includes(x.status):x.status==='PUBLICITY');rows.innerHTML=filtered.length?appRows(filtered):'<div class="empty">该子域暂无已接通的独立事实记录</div>';return}if(section==='supply'){title.textContent='岗位额度快照';desc.textContent='岗位供给应来自 HR02 Provider + 冻结额度快照；当前 Authority 尚未接通，不以申请数反推岗位余量。';rows.innerHTML='<div class="empty">岗位额度快照尚待接通 HR02 Provider 与冻结事实</div>';return}title.textContent='聘任制度与正式结果';desc.textContent='总览展示真实制度版本，并以 KPI 汇总当前竞聘与聘任事实。';rows.innerHTML=policyRows(d.recentPolicies||[])||factRows(d.recentAppointments||[])}
async function boot(){const r=await fetch('/api/v1/hr/appointments/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok){document.getElementById('rows').innerHTML='<div class="empty">数据读取失败（'+r.status+'）</div>';return}const d=await r.json();document.getElementById('kpis').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="kpi"><span>${v}</span><b>${esc(d.summary[k])}</b></div>`).join('');renderSection(d);document.getElementById('caps').innerHTML=Object.entries(d.capabilities).map(([k,v])=>`<div class="cap"><span>${names[k]||k}</span><b class="${v?'ok':'off'}">${v?'已接通':'待 Authority'}</b></div>`).join('')}boot();
</script></body></html>
