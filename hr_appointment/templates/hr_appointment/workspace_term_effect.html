{% extends "hr_appointment/workspace_term.html" %}

{% block content %}
{{ block.super }}
<style>
.hr14effect{margin-top:14px}.hr14effect-banner{padding:12px 14px;border:1px solid #cfe4da;border-radius:12px;background:#f4fbf7;color:#245b43;font-size:12px;line-height:1.7}.hr14effect-list{display:grid;gap:10px;margin-top:12px}.hr14effect-row{border:1px solid #e4e8ef;border-radius:13px;background:#fff;padding:13px}.hr14effect-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.hr14effect-head b,.hr14effect-head small{display:block;overflow-wrap:anywhere}.hr14effect-head small{color:#687386;margin-top:3px}.hr14effect-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.hr14effect-input{height:38px;border:1px solid #d7dfeb;border-radius:9px;background:#fff;padding:0 9px;min-width:0}.hr14effect-btn{height:38px;border:0;border-radius:9px;background:#176a43;color:#fff;font-weight:800;cursor:pointer}.hr14effect-state{padding:4px 8px;border-radius:999px;background:#fff4e8;color:#9a531d;font-size:11px;font-weight:800;white-space:nowrap}.hr14effect-state.good{background:#eaf8f0;color:#176a43}.hr14effect-note{margin-top:8px;color:#687386;font-size:12px;line-height:1.6}.hr14effect-error{margin-top:8px;padding:8px 10px;border-radius:9px;background:#fff0ea;color:#a34321;font-size:12px}.hr14effect-empty{padding:20px 12px;border:1px dashed #d7dfeb;border-radius:10px;text-align:center;color:#687386;font-size:12px}
@media(max-width:900px){.hr14effect-form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.hr14effect-form{grid-template-columns:1fr}.hr14effect-head{display:block}.hr14effect-state{display:inline-block;margin-top:6px}}
</style>
{% endblock %}

{% block scripts %}
{{ block.super }}
<script>
(() => {
  const section = '{{ section|escapejs }}';
  if (section !== 'term_changes') return;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const csrf = () => (document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1] || '');
  let snapshot = null;

  async function post(url, body) {
    const response = await fetch(url, {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json','X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},
      body:JSON.stringify(body || {})
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) {
      const error = new Error(payload?.error?.message || payload?.error?.code || `HTTP ${response.status}`);
      error.code = payload?.error?.code || `HTTP_${response.status}`;
      error.data = payload?.data || null;
      throw error;
    }
    return payload;
  }

  async function load() {
    const response = await fetch('/api/v1/hr/appointments/dashboard/', {credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    snapshot = await response.json();
    render();
  }

  function termLabel(id) {
    return (snapshot?.recentTerms || []).find((x) => String(x.id) === String(id))?.term_no || '关联聘期';
  }

  function appliedRows() {
    const renewals=(snapshot?.recentRenewals || []).filter((x)=>x.status==='APPLIED').map((x)=>({kind:'续聘',no:x.renewal_no,source:termLabel(x.source_term_id),fact:x.successor_fact_id,term:x.successor_term_id}));
    const changes=(snapshot?.recentTermChanges || []).filter((x)=>x.status==='APPLIED').map((x)=>({kind:x.change_type,no:x.change_no,source:termLabel(x.source_term_id),fact:x.successor_fact_id,term:x.successor_term_id}));
    return renewals.concat(changes);
  }

  function renewalRow(x) {
    return `<div class="hr14effect-row" data-effect-row="renewal-${esc(x.id)}"><div class="hr14effect-head"><div><b>${esc(x.renewal_no)} · ${esc(termLabel(x.source_term_id))}</b><small>续聘 ${esc(x.proposed_effective_from)} → ${esc(x.proposed_effective_to || '长期')} · ${esc(x.proposed_level_code || '沿用原等级')}</small></div><span class="hr14effect-state">APPROVED / 待生效</span></div><form class="hr14effect-form" data-renewal-effect="${esc(x.id)}"><input class="hr14effect-input" name="appointmentNo" placeholder="新聘任结果编号" required><input class="hr14effect-input" name="termNo" placeholder="新聘期编号" required><input class="hr14effect-input" name="renewalDueAt" type="date" title="下次续聘提醒"><button class="hr14effect-btn" type="submit">执行正式生效</button></form><div class="hr14effect-note">同岗位续聘不会制造无意义的 HR03 新任职段；系统会验证当前主岗一致，再生成 successor AppointmentFact / Term。</div></div>`;
  }

  function changeRow(x) {
    if (x.change_type === 'CORRECTION') {
      return `<div class="hr14effect-row"><div class="hr14effect-head"><div><b>${esc(x.change_no)} · 正式纠错</b><small>${esc(termLabel(x.source_term_id))} · ${esc(x.effective_date)}</small></div><span class="hr14effect-state">APPROVED / 阻断生效</span></div><div class="hr14effect-note">正式纠错必须提供明确的 Correction Authority payload；当前页面不会用普通聘期变更去覆盖历史正式事实。</div></div>`;
    }
    const isTermination=x.change_type==='TERMINATION';
    const isTransfer=x.change_type==='TRANSFER';
    return `<div class="hr14effect-row" data-effect-row="change-${esc(x.id)}"><div class="hr14effect-head"><div><b>${esc(x.change_no)} · ${esc(x.change_type)}</b><small>${esc(termLabel(x.source_term_id))} · 计划生效 ${esc(x.effective_date)}${x.target_position_instance_id?' · 目标岗位 '+esc(x.target_position_instance_id):''}${x.target_level_code?' · 目标等级 '+esc(x.target_level_code):''}</small></div><span class="hr14effect-state">APPROVED / 待生效</span></div><form class="hr14effect-form" data-change-effect="${esc(x.id)}"><input class="hr14effect-input" name="appointmentNo" placeholder="后继聘任结果编号" required>${isTermination?'':`<input class="hr14effect-input" name="termNo" placeholder="后继聘期编号" required>`}${isTransfer?'<input class="hr14effect-input" name="reservationId" type="number" min="1" placeholder="HR02 HELD reservation ID" required>':''}${isTermination||isTransfer?'':`<input class="hr14effect-input" name="renewalDueAt" type="date" title="后继聘期续聘提醒">`}<button class="hr14effect-btn" type="submit">执行正式生效</button></form><div class="hr14effect-note">${isTransfer?'调岗必须命中本变更持有的 HR02 HELD reservation，并与 HR03 switch_primary 在同一事务中提交。':isTermination?'终止会关闭 HR03 当前主岗任职段并形成 ENDED successor fact，不产生后继聘期。':'岗位不变时只验证 HR03 主岗一致，正式等级变化由 HR14 successor fact / term 承载。'}</div></div>`;
  }

  function render() {
    const host=document.getElementById('hr14effect-root'); if(!host) return;
    const pendingRenewals=(snapshot?.recentRenewals || []).filter((x)=>x.status==='APPROVED');
    const pendingChanges=(snapshot?.recentTermChanges || []).filter((x)=>x.status==='APPROVED');
    const applied=appliedRows();
    const pending=pendingRenewals.map(renewalRow).concat(pendingChanges.map(changeRow));
    const appliedHtml=applied.length?`<div class="hr14effect-list">${applied.slice(0,8).map((x)=>`<div class="hr14effect-row"><div class="hr14effect-head"><div><b>${esc(x.no)} · ${esc(x.kind)}</b><small>${esc(x.source)} · successor fact ${esc(x.fact || '—')} · successor term ${esc(x.term || '无')}</small></div><span class="hr14effect-state good">APPLIED</span></div></div>`).join('')}</div>`:'';
    host.innerHTML=`<div class="hr14effect-banner"><strong>正式生效工作区：</strong>只有这里的 apply-effect 成功后，续聘/变更才会形成新的 PositionAppointmentFact；调岗/终止同步走 HR03 Authority。任何 Provider 半失败都保持 EFFECT_PENDING，并返回可重试错误，不显示成功。</div>${pending.length?`<div class="hr14effect-list">${pending.join('')}</div>`:'<div class="hr14effect-empty">当前没有“已批准、待正式生效”的续聘或聘期变更。</div>'}${appliedHtml}`;
  }

  async function submitRenewal(form) {
    const f=new FormData(form), id=form.dataset.renewalEffect, row=form.closest('[data-effect-row]');
    try {
      await post(`/api/v1/hr/appointments/renewals/${encodeURIComponent(id)}/apply-effect/`,{appointmentNo:f.get('appointmentNo'),successorTermNo:f.get('termNo'),renewalDueAt:f.get('renewalDueAt')||null});
      await load();
    } catch (error) {
      row?.querySelector('.hr14effect-error')?.remove(); const node=document.createElement('div'); node.className='hr14effect-error'; node.textContent=`${error.code}: ${error.message}${error.data?.pendingFactId?' · pending fact '+error.data.pendingFactId:''}`; row?.appendChild(node);
    }
  }

  async function submitChange(form) {
    const f=new FormData(form), id=form.dataset.changeEffect, row=form.closest('[data-effect-row]');
    try {
      await post(`/api/v1/hr/appointments/term-changes/${encodeURIComponent(id)}/apply-effect/`,{appointmentNo:f.get('appointmentNo'),successorTermNo:f.get('termNo')||'',reservationId:f.get('reservationId')?Number(f.get('reservationId')):null,renewalDueAt:f.get('renewalDueAt')||null});
      await load();
    } catch (error) {
      row?.querySelector('.hr14effect-error')?.remove(); const node=document.createElement('div'); node.className='hr14effect-error'; node.textContent=`${error.code}: ${error.message}${error.data?.pendingFactId?' · pending fact '+error.data.pendingFactId:''}`; row?.appendChild(node);
    }
  }

  function boot() {
    const work=document.querySelector('.hr14-layout > div'); if(!work||document.getElementById('hr14effect-root')) return;
    const card=document.createElement('article'); card.id='hr14effect-root'; card.className='hr14-card hr14effect'; card.innerHTML='<div class="hr14effect-empty">正在读取待生效聘期事实…</div>'; work.appendChild(card);
    card.addEventListener('submit',(event)=>{const renewal=event.target.closest('[data-renewal-effect]'),change=event.target.closest('[data-change-effect]');if(!renewal&&!change)return;event.preventDefault();if(renewal)submitRenewal(renewal);else submitChange(change);});
    load().catch((error)=>{card.innerHTML=`<div class="hr14effect-error">正式生效数据读取失败：${esc(error.message)}</div>`;});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();
})();
</script>
{% endblock %}
