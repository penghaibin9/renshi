{% extends "hr_appointment/workspace_live.html" %}

{% block content %}
{{ block.super }}
<style>
.hr14term{margin-top:14px}.hr14term-banner{padding:12px 14px;border:1px solid #fed7aa;border-radius:12px;background:#fff7ed;color:#8a4b13;font-size:12px;line-height:1.7}.hr14term-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.hr14term-box{border:1px solid #e7e3f3;border-radius:14px;background:#fcfbff;padding:14px}.hr14term-box h3{margin:0 0 4px;font-size:15px}.hr14term-box p{margin:0 0 11px;color:#6b7280;font-size:12px;line-height:1.6}.hr14term-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.hr14term-form .wide{grid-column:1/-1}.hr14term-input,.hr14term-select,.hr14term-textarea{width:100%;min-width:0;border:1px solid #d9d5e7;border-radius:10px;background:#fff;color:#262234;padding:9px 10px;font:inherit}.hr14term-input,.hr14term-select{height:40px}.hr14term-textarea{min-height:72px;resize:vertical}.hr14term-btn{border:0;border-radius:10px;padding:9px 12px;background:#5546b7;color:#fff;font-weight:800;cursor:pointer}.hr14term-btn.secondary{background:#eeeafd;color:#4b3fa5}.hr14term-btn.warn{background:#fff4e8;color:#a45118}.hr14term-btn.danger{background:#fff0ea;color:#a34321}.hr14term-list{display:grid;gap:8px;margin-top:10px}.hr14term-row{padding:11px;border:1px solid #ece8f4;border-radius:12px;background:#fff}.hr14term-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.hr14term-row b,.hr14term-row small{display:block;overflow-wrap:anywhere}.hr14term-row small{color:#6b7280}.hr14term-badge{white-space:nowrap;padding:4px 8px;border-radius:999px;background:#f0edff;color:#5141b5;font-size:11px;font-weight:800}.hr14term-badge.warn{background:#fff4e8;color:#a45118}.hr14term-badge.good{background:#eaf8f0;color:#176a43}.hr14term-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.hr14term-actions button{font-size:12px;padding:6px 9px}.hr14term-message{margin-top:8px;font-size:12px;color:#6b7280}.hr14term-error{margin-top:8px;padding:9px 10px;border-radius:9px;background:#fff0ea;color:#a34321;font-size:12px}.hr14term-empty{padding:20px 12px;border:1px dashed #d9d5e7;border-radius:10px;color:#6b7280;text-align:center;font-size:12px}
@media(max-width:900px){.hr14term-grid{grid-template-columns:1fr}}
@media(max-width:560px){.hr14term-form{grid-template-columns:1fr}.hr14term-form .wide{grid-column:1}.hr14term-head{display:block}.hr14term-badge{display:inline-block;margin-top:6px}}
</style>
{% endblock %}

{% block scripts %}
{{ block.super }}
<script>
(() => {
  const section = '{{ section|escapejs }}';
  if (section !== 'term_changes') return;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const csrf = () => (document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1] || '');
  let data = null;

  async function request(url, body={}) {
    const response = await fetch(url, {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(body)});
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) { const error = new Error(payload?.error?.message || payload?.error?.code || `HTTP ${response.status}`); error.code = payload?.error?.code || `HTTP_${response.status}`; throw error; }
    return payload;
  }
  async function refresh() {
    const response = await fetch('/api/v1/hr/appointments/dashboard/', {credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    data = await response.json();
    render();
  }
  const terms = () => data?.recentTerms || [];
  const renewals = () => data?.recentRenewals || [];
  const changes = () => data?.recentTermChanges || [];
  const facts = () => data?.recentAppointments || [];
  const termLabel = (id) => terms().find((x) => String(x.id) === String(id))?.term_no || '关联聘期';
  const availableFacts = () => facts().filter((f) => f.status === 'EFFECTIVE' && !terms().some((t) => String(t.appointment_fact_id) === String(f.id)));
  const activeTerms = () => terms().filter((t) => ['ACTIVE','EXPIRING'].includes(t.status));

  function options(rows, valueKey, label) {
    return rows.length ? rows.map((x) => `<option value="${esc(x[valueKey])}">${esc(label(x))}</option>`).join('') : '<option value="">暂无可办理记录</option>';
  }
  function msg(box, text, bad=false) {
    if (!box) return; let node=box.querySelector('.hr14term-message,.hr14term-error'); if(node) node.remove(); node=document.createElement('div'); node.className=bad?'hr14term-error':'hr14term-message'; node.textContent=text; box.appendChild(node);
  }
  function termRows() {
    return terms().length ? terms().map((x) => `<div class="hr14term-row"><div class="hr14term-head"><div><b>${esc(x.term_no)}</b><small>岗位 ${esc(x.position_instance_id)} · ${esc(x.level_code || '未分级')} · ${esc(x.effective_from)} → ${esc(x.effective_to || '长期')}</small><small>续聘提醒 ${esc(x.renewal_due_at || '未设置')}</small></div><span class="hr14term-badge ${x.status==='EXPIRING'?'warn':''}">${esc(x.status)}</span></div>${x.status==='ACTIVE'?`<div class="hr14term-actions"><button class="hr14term-btn secondary" data-expiring="${esc(x.id)}">标记临期</button></div>`:''}</div>`).join('') : '<div class="hr14term-empty">尚未从正式聘任建立聘期</div>';
  }
  function renewalRows() {
    return renewals().length ? renewals().map((x) => { const pending=['READY'].includes(x.status); const approved=x.status==='APPROVED'; return `<div class="hr14term-row"><div class="hr14term-head"><div><b>${esc(x.renewal_no)} · ${esc(termLabel(x.source_term_id))}</b><small>${esc(x.route)} · ${esc(x.proposed_effective_from)} → ${esc(x.proposed_effective_to || '长期')}</small>${approved?'<small>已批准，但尚未形成新的正式 AppointmentFact / Term</small>':''}</div><span class="hr14term-badge ${approved?'warn':''}">${esc(x.status)}</span></div>${pending?`<div class="hr14term-actions"><button class="hr14term-btn secondary" data-renewal="${esc(x.id)}" data-outcome="APPROVED">批准</button><button class="hr14term-btn danger" data-renewal="${esc(x.id)}" data-outcome="REJECTED">不续聘</button><button class="hr14term-btn warn" data-renewal="${esc(x.id)}" data-outcome="REAPPOINTMENT_REQUIRED">转重新竞聘</button></div>`:''}</div>`; }).join('') : '<div class="hr14term-empty">当前没有续聘案件</div>';
  }
  function changeRows() {
    return changes().length ? changes().map((x) => { const pending=x.status==='REVIEW_REQUIRED'; const approved=x.status==='APPROVED'; return `<div class="hr14term-row"><div class="hr14term-head"><div><b>${esc(x.change_no)} · ${esc(termLabel(x.source_term_id))}</b><small>${esc(x.change_type)} · 生效计划 ${esc(x.effective_date)}${x.target_level_code?' · 目标等级 '+esc(x.target_level_code):''}</small>${approved?'<small>已批准，但 HR03/正式聘任事实尚未生效</small>':''}</div><span class="hr14term-badge ${approved?'warn':''}">${esc(x.status)}</span></div>${pending?`<div class="hr14term-actions"><button class="hr14term-btn secondary" data-change="${esc(x.id)}" data-outcome="APPROVED">批准</button><button class="hr14term-btn danger" data-change="${esc(x.id)}" data-outcome="REJECTED">驳回</button><button class="hr14term-btn warn" data-change="${esc(x.id)}" data-outcome="REAPPOINTMENT_REQUIRED">转重新竞聘</button></div>`:''}</div>`; }).join('') : '<div class="hr14term-empty">当前没有聘期变更案件</div>';
  }
  function render() {
    const host=document.getElementById('hr14term-root'); if(!host) return;
    host.innerHTML=`<div class="hr14term-banner"><strong>生效边界：</strong>续聘/高聘/低聘/转岗/解聘的“批准”只代表 HR14 治理决定；在新的 PositionAppointmentFact / AppointmentTerm 与 HR03 Assignment effect receipt 形成前，页面不会显示“已生效”。</div><div class="hr14term-grid">
      <section class="hr14term-box" id="term-register-box"><h3>从正式聘任建立聘期</h3><p>只读取 EFFECTIVE PositionAppointmentFact，不延长旧结果。</p><form id="term-register-form" class="hr14term-form"><select name="factId" class="hr14term-select wide" required>${options(availableFacts(),'id',x=>`${x.appointment_no} · 岗位 ${x.position_instance_id} · ${x.level_code||'未分级'}`)}</select><input name="termNo" class="hr14term-input" placeholder="聘期编号" required><input name="effectiveTo" type="date" class="hr14term-input"><input name="renewalDueAt" type="date" class="hr14term-input"><button class="hr14term-btn" type="submit">建立聘期</button></form></section>
      <section class="hr14term-box" id="renewal-box"><h3>发起续聘</h3><p>旧聘期不改 end_date；续聘先建 RenewalCase，批准后仍需新的正式结果/聘期。</p><form id="renewal-form" class="hr14term-form"><select name="termId" class="hr14term-select wide" required>${options(activeTerms(),'id',x=>`${x.term_no} · ${x.effective_to||'长期'}`)}</select><input name="renewalNo" class="hr14term-input" placeholder="续聘案件号" required><select name="route" class="hr14term-select"><option value="DIRECT_RENEWAL">直接续聘</option><option value="TERM_ASSESSMENT">聘期考核后续聘</option><option value="REAPPOINTMENT">重新竞聘</option></select><input name="from" type="date" class="hr14term-input" required><input name="to" type="date" class="hr14term-input"><input name="level" class="hr14term-input" placeholder="续聘等级（可选）"><input name="hr12" class="hr14term-input wide" placeholder="HR12 FINAL 聘期考核引用（需要时必填）"><button class="hr14term-btn" type="submit">创建续聘案件</button></form></section>
      <section class="hr14term-box" id="change-box"><h3>发起聘期变更</h3><p>高聘、低聘、转岗、解聘、正式纠错统一形成 ChangeCase，绝不原地覆盖旧聘任。</p><form id="change-form" class="hr14term-form"><select name="termId" class="hr14term-select wide" required>${options(activeTerms(),'id',x=>`${x.term_no} · 岗位 ${x.position_instance_id}`)}</select><input name="changeNo" class="hr14term-input" placeholder="变更案件号" required><select name="type" class="hr14term-select"><option value="PROMOTION">高聘/晋升</option><option value="DOWNGRADE">低聘</option><option value="TRANSFER">转岗</option><option value="TERMINATION">解聘/终止</option><option value="CORRECTION">正式纠错</option></select><input name="date" type="date" class="hr14term-input" required><input name="position" type="number" min="1" class="hr14term-input" placeholder="目标岗位ID（转岗时）"><input name="level" class="hr14term-input" placeholder="目标等级"><textarea name="reason" class="hr14term-textarea wide" placeholder="原因/依据"></textarea><button class="hr14term-btn" type="submit">创建变更案件</button></form></section>
      <section class="hr14term-box"><h3>聘期台账</h3><div class="hr14term-list">${termRows()}</div></section>
      <section class="hr14term-box"><h3>续聘案件</h3><div class="hr14term-list">${renewalRows()}</div></section>
      <section class="hr14term-box"><h3>变更案件</h3><div class="hr14term-list">${changeRows()}</div></section>
    </div>`;
    bind();
  }
  function bind() {
    document.getElementById('term-register-form')?.addEventListener('submit',async(e)=>{e.preventDefault();const f=new FormData(e.currentTarget),box=document.getElementById('term-register-box');try{await request(`/api/v1/hr/appointments/appointment-facts/${encodeURIComponent(f.get('factId'))}/term/`,{termNo:f.get('termNo'),effectiveTo:f.get('effectiveTo')||null,renewalDueAt:f.get('renewalDueAt')||null});await refresh();}catch(err){msg(box,`${err.code}: ${err.message}`,true);}});
    document.getElementById('renewal-form')?.addEventListener('submit',async(e)=>{e.preventDefault();const f=new FormData(e.currentTarget),box=document.getElementById('renewal-box');try{await request(`/api/v1/hr/appointments/terms/${encodeURIComponent(f.get('termId'))}/renewals/`,{renewalNo:f.get('renewalNo'),route:f.get('route'),proposedEffectiveFrom:f.get('from'),proposedEffectiveTo:f.get('to')||null,proposedLevelCode:f.get('level'),hr12TermResultRef:f.get('hr12')});await refresh();}catch(err){msg(box,`${err.code}: ${err.message}`,true);}});
    document.getElementById('change-form')?.addEventListener('submit',async(e)=>{e.preventDefault();const f=new FormData(e.currentTarget),box=document.getElementById('change-box');try{await request(`/api/v1/hr/appointments/terms/${encodeURIComponent(f.get('termId'))}/changes/`,{changeNo:f.get('changeNo'),changeType:f.get('type'),effectiveDate:f.get('date'),targetPositionInstanceId:f.get('position')?Number(f.get('position')):null,targetLevelCode:f.get('level'),reason:f.get('reason')});await refresh();}catch(err){msg(box,`${err.code}: ${err.message}`,true);}});
    document.querySelectorAll('[data-expiring]').forEach(b=>b.addEventListener('click',async()=>{try{await request(`/api/v1/hr/appointments/terms/${encodeURIComponent(b.dataset.expiring)}/expiring/`,{});await refresh();}catch(err){alert(`${err.code}: ${err.message}`);}}));
    document.querySelectorAll('[data-renewal]').forEach(b=>b.addEventListener('click',async()=>{const note=prompt('填写续聘决定依据（可选）','')||'';try{await request(`/api/v1/hr/appointments/renewals/${encodeURIComponent(b.dataset.renewal)}/decision/`,{outcome:b.dataset.outcome,decisionSnapshot:{note}});await refresh();}catch(err){alert(`${err.code}: ${err.message}`);}}));
    document.querySelectorAll('[data-change]').forEach(b=>b.addEventListener('click',async()=>{const note=prompt('填写变更决定依据（可选）','')||'';try{await request(`/api/v1/hr/appointments/term-changes/${encodeURIComponent(b.dataset.change)}/decision/`,{outcome:b.dataset.outcome,decisionSnapshot:{note}});await refresh();}catch(err){alert(`${err.code}: ${err.message}`);}}));
  }
  function boot() {
    const stale=document.getElementById('hr14-title')?.closest('.hr14-card'); if(stale) stale.hidden=true;
    const work=document.querySelector('.hr14-layout > div'); if(!work||document.getElementById('hr14term-root')) return;
    const card=document.createElement('article'); card.id='hr14term-root'; card.className='hr14-card hr14term'; card.innerHTML='<div class="hr14term-empty">正在读取真实聘期数据…</div>'; work.appendChild(card);
    refresh().catch(err=>{card.innerHTML=`<div class="hr14term-error">真实聘期数据读取失败：${esc(err.message)}</div>`;});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();
})();
</script>
{% endblock %}
