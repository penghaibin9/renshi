# 跃科高校人事系统开发栈：MySQL-only。
# 新手入口：`make dev`；数据库控制台：`make db-shell`。
# 本文件始终是开发配置（DEBUG=1 / 源码 bind mount）；生产环境必须使用
# docker-compose.prod.yml，不能通过 profile 把本开发栈“切成生产”。

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
    environment:
      DEBUG: "1"
      HORILLA_ENV: development
      DB_HOST: db
      DB_PORT: "3306"
      SECRET_KEY: dev-secret-key-change-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_URL: mysql://horilla_user:horilla_pass@db:3306/horilla_db?charset=utf8mb4
      DB_INIT_PASSWORD: dev-init-password-change-in-production
      REDIS_URL: redis://:horilla_pass@redis:6379/0
      COMPANY_SCOPED_PERMISSIONS: "True"
      TENANT_FAIL_CLOSED: "True"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 3

  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    environment:
      MYSQL_DATABASE: horilla_db
      MYSQL_USER: horilla_user
      MYSQL_PASSWORD: horilla_pass
      MYSQL_ROOT_PASSWORD: horilla_root_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uhorilla_user -phorilla_pass --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass horilla_pass
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "horilla_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - staticfiles:/static:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    profiles: ["proxy"]

volumes:
  staticfiles:
  media:
  mysql_data:
  redis_data:
