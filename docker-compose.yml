# 跃科高校人事系统开发栈：MySQL-only。
# 新手入口：`make dev`；数据库控制台：`make db-shell`。
# 本文件始终是开发配置（DEBUG=1 / 源码 bind mount）；生产环境必须使用
# docker-compose.prod.yml，不能通过 profile 把本开发栈“切成生产”。

services:
  web:
    image: renshi-web:latest
    build: .
    ports:
      # 18000 avoids the common local port used by the separate student
      # lifecycle system. Override with HR_HTTP_PORT when required.
      - "${HR_HTTP_PORT:-18000}:8000"
    volumes:
      - .:/app
      - staticfiles:/app/.runtime/staticfiles
      - media:/app/.runtime/media
    environment: &development-env
      DEBUG: "1"
      HORILLA_ENV: development
      DB_HOST: db
      DB_PORT: "3306"
      SECRET_KEY: dev-secret-key-change-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,[::1]
      CSRF_TRUSTED_ORIGINS: http://localhost:18000,http://127.0.0.1:18000
      DATABASE_URL: mysql://renshi_user:renshi_pass@db:3306/renshi_db?charset=utf8mb4
      # Existing local installations created before the public-brand cleanup
      # still own the original MySQL schema.  The entrypoint probes this URL
      # only when the canonical database is unavailable, so upgrades preserve
      # local data while fresh installations keep using renshi_db.
      LEGACY_DATABASE_URL: mysql://horilla_user:horilla_pass@db:3306/horilla_db?charset=utf8mb4
      DB_INIT_PASSWORD: dev-init-password-change-in-production
      REDIS_URL: redis://:renshi_pass@redis:6379/0
      # Keep the one-click local stack within Docker Desktop's common 8 GiB
      # memory budget. Override only after measuring the complete seven-service
      # stack; CPU-based auto sizing can otherwise create eight heavy workers.
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      COMPANY_SCOPED_PERMISSIONS: "True"
      TENANT_FAIL_CLOSED: "True"
      HR18_SUBMISSION_HTTP_ENDPOINT: "${HR18_SUBMISSION_HTTP_ENDPOINT:-}"
      HR18_SUBMISSION_HTTP_TOKEN: "${HR18_SUBMISSION_HTTP_TOKEN:-}"
      HR18_SUBMISSION_HTTP_TIMEOUT_SECONDS: "${HR18_SUBMISSION_HTTP_TIMEOUT_SECONDS:-15}"
      HR18_SUBMISSION_HTTP_PROVIDER_VERSION: "${HR18_SUBMISSION_HTTP_PROVIDER_VERSION:-https-v1}"
      HR18_SUBMISSION_DISPATCH_PROVIDER_KEY: "${HR18_SUBMISSION_DISPATCH_PROVIDER_KEY:-EDU_PLATFORM}"
      HR18_SUBMISSION_RECEIPT_HMAC_SECRET: "${HR18_SUBMISSION_RECEIPT_HMAC_SECRET:-}"
      HR18_SUBMISSION_RECEIPT_KEY_ID: "${HR18_SUBMISSION_RECEIPT_KEY_ID:-}"
      HR18_EXCHANGE_HTTP_ENDPOINT: "${HR18_EXCHANGE_HTTP_ENDPOINT:-}"
      HR18_EXCHANGE_HTTP_TOKEN: "${HR18_EXCHANGE_HTTP_TOKEN:-}"
      HR18_EXCHANGE_HTTP_TIMEOUT_SECONDS: "${HR18_EXCHANGE_HTTP_TIMEOUT_SECONDS:-15}"
      HR18_EXCHANGE_HTTP_PROVIDER_VERSION: "${HR18_EXCHANGE_HTTP_PROVIDER_VERSION:-https-v1}"
      HR18_EXCHANGE_HTTP_PROVIDER_KEY: "${HR18_EXCHANGE_HTTP_PROVIDER_KEY:-EDU_PLATFORM}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      # First boot performs migrations, theme setup, collectstatic and checks.
      # Give that deterministic preparation time before counting probe failures.
      start_period: 240s
      retries: 3
    restart: unless-stopped

  hr18-submission-worker:
    image: renshi-web:latest
    build: .
    command: ["python", "manage.py", "run_hr18_submission_dispatch_worker", "--watch", "--interval", "5"]
    volumes:
      - .:/app
      - staticfiles:/app/.runtime/staticfiles
      - media:/app/.runtime/media
    environment:
      <<: *development-env
      MIGRATE_ON_START: "0"
      COLLECTSTATIC_ON_START: "0"
      CHECK_ON_START: "0"
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_heartbeat.py", "hr18-submission", "120"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  hr18-exchange-worker:
    image: renshi-web:latest
    build: .
    command: ["python", "manage.py", "run_hr18_exchange_worker", "--watch", "--interval", "5"]
    volumes:
      - .:/app
      - staticfiles:/app/.runtime/staticfiles
      - media:/app/.runtime/media
    environment:
      <<: *development-env
      MIGRATE_ON_START: "0"
      COLLECTSTATIC_ON_START: "0"
      CHECK_ON_START: "0"
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_heartbeat.py", "hr18-exchange", "120"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  legacy-scheduler:
    image: renshi-web:latest
    build: .
    command: ["python", "manage.py", "run_legacy_scheduler"]
    volumes:
      - .:/app
      - staticfiles:/app/.runtime/staticfiles
      - media:/app/.runtime/media
    environment:
      <<: *development-env
      MIGRATE_ON_START: "0"
      COLLECTSTATIC_ON_START: "0"
      CHECK_ON_START: "0"
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_heartbeat.py", "legacy-scheduler", "120"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  employee-scheduler:
    image: renshi-web:latest
    build: .
    command: ["python", "manage.py", "run_employee_scheduler"]
    volumes:
      - .:/app
      - staticfiles:/app/.runtime/staticfiles
      - media:/app/.runtime/media
    environment:
      <<: *development-env
      MIGRATE_ON_START: "0"
      COLLECTSTATIC_ON_START: "0"
      CHECK_ON_START: "0"
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_heartbeat.py", "employee-scheduler", "120"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
      # HR03-HR18 use database triggers as the final anti-tamper backstop.
      # MySQL 8.4 enables binary logging by default; allow the non-SUPER
      # migration user to install those deterministic triggers.
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: renshi_db
      MYSQL_USER: renshi_user
      MYSQL_PASSWORD: renshi_pass
      MYSQL_ROOT_PASSWORD: renshi_root_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -urenshi_user -prenshi_pass --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass renshi_pass
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "renshi_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - staticfiles:/static:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    profiles: ["proxy"]

volumes:
  staticfiles:
  media:
  mysql_data:
  redis_data:
