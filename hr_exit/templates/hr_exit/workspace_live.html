{% extends "hr_exit/workspace.html" %}

{% block content %}
{{ block.super }}
<style>
.hr16live-history{margin-top:14px}.hr16live-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hr16live-chip{padding:6px 9px;border-radius:999px;border:1px solid #eadbd3;background:#fffaf7;color:#6f5d54;font-size:12px}.hr16live-chip strong{color:#31251f}.hr16live-list{display:grid;gap:8px;margin-top:12px}.hr16live-row{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(150px,.9fr) 110px 110px;gap:10px;align-items:center;padding:12px;border:1px solid #f0e8e3;border-radius:12px;background:#fff}.hr16live-row b,.hr16live-row small{display:block;overflow-wrap:anywhere}.hr16live-row small{color:#796c65}.hr16live-badge{justify-self:start;padding:4px 9px;border-radius:999px;background:#fff1e8;color:#a3461f;font-size:12px;font-weight:700}.hr16live-empty{padding:24px 14px;text-align:center;color:#796c65;border:1px dashed #e2d6cf;border-radius:12px;background:#fffdfc}
@media(max-width:720px){.hr16live-row{grid-template-columns:minmax(0,1fr) auto}.hr16live-row .hr16live-owner{grid-column:1}.hr16live-row .hr16live-date{grid-column:2;grid-row:2}}
@media(max-width:390px){.hr16live-row{grid-template-columns:1fr}.hr16live-row .hr16live-owner,.hr16live-row .hr16live-date{grid-column:1;grid-row:auto}.hr16live-badge{justify-self:start}}
</style>
{% endblock %}

{% block scripts %}
{{ block.super }}
<script>
(() => {
  const section = '{{ section|escapejs }}';
  if (section !== 'handover') return;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  const desc = document.getElementById('hr16-desc');
  if (desc) {
    const observer = new MutationObserver(() => {
      observer.disconnect();
      desc.textContent = '上方保留 HANDOVER 案件队列；下方读取真实 ExitHandoverItem。必交项全部完成或有理由豁免后，案件才允许进入最终结算。';
    });
    observer.observe(desc, {childList:true, characterData:true, subtree:true});
  }

  async function renderChecklist() {
    const work = document.querySelector('.hr16-layout > div');
    if (!work || document.getElementById('hr16live-handover-items')) return;
    const card = document.createElement('article');
    card.id = 'hr16live-handover-items';
    card.className = 'hr16-card hr16live-history';
    card.innerHTML = '<h2>工作交接清单</h2><p>必交项 PENDING 会直接阻断 HANDOVER → SETTLEMENT；完成和豁免均保留责任人、证据与历史。</p><div class="hr16live-summary"><span class="hr16live-chip">必交待完成 <strong id="hr16live-pending">—</strong></span><span class="hr16live-chip">已完成 <strong id="hr16live-completed">—</strong></span><span class="hr16live-chip">已豁免 <strong id="hr16live-waived">—</strong></span></div><div class="hr16live-list"><div class="hr16live-empty">正在读取真实交接项…</div></div>';
    work.appendChild(card);
    try {
      const response = await fetch('/api/v1/hr/exit/dashboard/', {headers:{'X-Requested-With':'XMLHttpRequest'}});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      document.getElementById('hr16live-pending').textContent = data.summary?.pendingRequiredHandover ?? 0;
      document.getElementById('hr16live-completed').textContent = data.summary?.completedRequiredHandover ?? 0;
      document.getElementById('hr16live-waived').textContent = data.summary?.waivedRequiredHandover ?? 0;
      const rows = data.recentHandoverItems || [];
      const target = card.querySelector('.hr16live-list');
      target.innerHTML = rows.length ? rows.map((x) => {
        const title = x.title || x.item_no || '未命名交接项';
        const detail = [x.item_no, x.category_code, x.required ? '必交' : '可选', x.evidence_ref ? '已有证据' : ''].filter(Boolean).join(' · ');
        const owner = x.owner_staff_id ? `责任人 ${x.owner_staff_id}` : '责任人未指定';
        const date = x.due_date || ((x.completed_at || '').slice(0, 10)) || '—';
        return `<div class="hr16live-row"><div><b>${esc(title)}</b><small>${esc(detail)}</small></div><small class="hr16live-owner">${esc(owner)}</small><span class="hr16live-badge">${esc(x.status || '—')}</span><small class="hr16live-date">${esc(date)}</small></div>`;
      }).join('') : '<div class="hr16live-empty">当前没有交接项。案件进入结算前必须至少配置一条必交项。</div>';
    } catch (error) {
      const target = card.querySelector('.hr16live-list');
      if (target) target.innerHTML = `<div class="hr16live-empty">交接清单读取失败：${esc(error.message)}</div>`;
    }
  }

  renderChecklist();
})();
</script>
{% endblock %}
