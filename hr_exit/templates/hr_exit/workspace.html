<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ section_title }} · HR16</title><style>
:root{--p:#c05a27;--ink:#31251f;--muted:#796c65;--line:#eee4de;--bg:#faf7f4;--good:#08795a;--warn:#b34d13;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif}.shell{max-width:1500px;margin:auto;padding:26px}.hero{position:relative;overflow:hidden;padding:30px;border-radius:22px;background:linear-gradient(135deg,#3c2419,#a84c23 58%,#d77a45);color:#fff;box-shadow:0 18px 45px #6b341c26}.hero:after{content:"HR16";position:absolute;right:30px;top:-24px;font-size:112px;font-weight:800;opacity:.07}.eyebrow{font-size:12px;letter-spacing:.16em;opacity:.78}.hero h1{margin:7px 0 6px;font-size:28px}.hero p{margin:0;max-width:920px;color:#ffe9dd}.nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.nav a{white-space:nowrap;padding:9px 13px;border-radius:10px;text-decoration:none;color:#685b54;background:#fff;border:1px solid var(--line)}.nav a.active{color:#fff;background:var(--p);border-color:var(--p)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;margin-top:5px;font-size:23px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,.9fr);gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 15px #4a2f220a}.panel h2{font-size:16px;margin:0 0 4px}.panel .desc{color:var(--muted);font-size:12px;margin:0 0 13px}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr .75fr .8fr 1.2fr;gap:12px;align-items:center;padding:11px 12px;border:1px solid #f0e8e3;border-radius:12px}.row small{color:var(--muted)}.badge{justify-self:start;padding:3px 9px;border-radius:99px;background:#fff1e8;color:#a3461f;font-size:12px}.dates{font-size:12px;color:var(--muted)}.cap{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.cap:last-child{border:0}.ok{color:var(--good)}.off{color:var(--warn)}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.empty strong{display:block;color:#674b3e;margin-bottom:6px}.error{margin:20px;padding:18px;border-radius:12px;background:#fff0f0;color:var(--bad)}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:680px){.shell{padding:14px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
</style></head><body><main class="shell">{% if access_error %}<div class="error">{{ access_error }}</div>{% else %}<section class="hero"><div class="eyebrow">RETIREMENT & EXIT · LIFECYCLE CONTROL</div><h1>{{ section_title }}</h1><p>辞职批准、工作交接、最终结算、最后工作日、Employment 终止、账号停用和退休生效分别保存和审计；跨域 Effect Saga 出现部分失败时直接暴露。</p></section><nav class="nav"><a class="{% if section == 'overview' %}active{% endif %}" href="/hr/exit/">总览</a><a class="{% if section == 'cases' %}active{% endif %}" href="/hr/exit/cases/">离校审批</a><a class="{% if section == 'handover' %}active{% endif %}" href="/hr/exit/handover/">工作交接</a><a class="{% if section == 'settlement' %}active{% endif %}" href="/hr/exit/settlement/">最终结算</a><a class="{% if section == 'retirement_precheck' %}active{% endif %}" href="/hr/exit/retirement-precheck/">退休预审</a><a class="{% if section == 'retirement_facts' %}active{% endif %}" href="/hr/exit/retirement-facts/">退休事实</a><a class="{% if section == 'effects' %}active{% endif %}" href="/hr/exit/effects/">生效协同</a><a class="{% if section == 'archive' %}active{% endif %}" href="/hr/exit/archive/">离校档案</a></nav><section class="grid" id="kpis"></section><section class="layout"><div class="panel"><h2 id="listTitle">当前工作区</h2><p class="desc" id="listDesc"></p><div id="rows" class="rows"><div class="empty">正在读取离退 Authority…</div></div></div><aside class="panel"><h2>离退能力接通状态</h2><div id="caps"></div></aside></section>{% endif %}</main><script>
const section='{{ section|escapejs }}';const labels={cases:'离退案件',awaitingApproval:'待审批',handover:'交接中',settlement:'结算中',effectExceptions:'生效异常',effectiveExits:'正式离校',retirementFacts:'退休事实'};const names={exitCase:'ExitCase',effectSaga:'跨域 Effect Saga',exitFact:'正式离校事实',retirementFact:'退休事实',approvalWorkflow:'完整审批',handoverChecklist:'交接清单',retirementPolicy:'退休政策',retirementPrecheck:'退休预审',assetProvider:'资产 Provider',iamProvider:'IAM Provider',financeProvider:'财务 Provider',archiveProvider:'档案 Provider'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function caseRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.case_no)}</b><br><small>${esc(x.exit_type)}</small></div><span class="badge">${esc(x.status)}</span><div class="dates">最后工作日<br><b>${esc(x.last_working_date||'-')}</b></div><div class="dates">Employment 终止 ${esc(x.planned_employment_end_date||'-')}<br>账号计划停用 ${esc((x.planned_access_end_at||'').slice(0,16)||'-')}</div></div>`).join(''):'<div class="empty">当前学校暂无离退案件</div>'}
function effectRows(items){return items.length?items.map(x=>`<div class="row"><div><b>Effect v${esc(x.effect_version)}</b><br><small>Case ${esc(x.case_id)}</small></div><span class="badge">${esc(x.status)}</span><div class="dates">HR03 ${esc(x.hr03_status)}<br>HR14 ${esc(x.hr14_status)}</div><div class="dates">IAM ${esc(x.iam_status)} · 财务 ${esc(x.settlement_status)} · 档案 ${esc(x.archive_status)}</div></div>`).join(''):'<div class="empty">当前学校暂无生效协同记录</div>'}
function exitRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.fact_no)}</b><br><small>${esc(x.exit_type)}</small></div><span class="badge">${esc(x.status)}</span><div class="dates">Employment 终止<br><b>${esc(x.employment_end_date||'-')}</b></div><div class="dates">最后工作日 ${esc(x.last_working_date||'-')}<br>账号停用 ${esc((x.access_end_at||'').slice(0,16)||'-')}</div></div>`).join(''):'<div class="empty">当前学校暂无正式离校事实</div>'}
function retirementRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.fact_no)}</b><br><small>${esc(x.retirement_type)}</small></div><span class="badge">${esc(x.status)}</span><div class="dates">法定日期<br><b>${esc(x.statutory_date||'-')}</b></div><div class="dates">退休生效 ${esc(x.effective_date||'-')}<br>养老金 ${esc(x.pension_processing_status)}</div></div>`).join(''):'<div class="empty">当前学校暂无退休事实</div>'}
function unavailable(title,msg){return `<div class="empty"><strong>${esc(title)}</strong>${esc(msg)}</div>`}
function renderSection(d){const title=document.getElementById('listTitle'),desc=document.getElementById('listDesc'),rows=document.getElementById('rows');if(section==='cases'){title.textContent='离校案件与审批状态';desc.textContent='批准不等于 Employment 已终止；这里展示案件事实与计划日期。';rows.innerHTML=caseRows(d.recentCases||[]);return}if(section==='handover'){title.textContent='工作交接';desc.textContent='交接清单 Authority 尚未接通；只展示处于 HANDOVER 的真实案件，不伪造完成率。';const filtered=(d.recentCases||[]).filter(x=>x.status==='HANDOVER');rows.innerHTML=filtered.length?caseRows(filtered):unavailable('暂无交接案件','独立交接清单与资产 Provider 尚待接通');return}if(section==='settlement'){title.textContent='最终结算';desc.textContent='最终结算与离校批准分离；财务 Provider 未回执前不能标记完成。';const filtered=(d.recentCases||[]).filter(x=>x.status==='SETTLEMENT');rows.innerHTML=filtered.length?caseRows(filtered):unavailable('暂无结算案件','财务结算 Provider 尚待接通');return}if(section==='retirement_precheck'){title.textContent='退休预审';desc.textContent='退休政策、法定年龄/特殊工种等预审规则必须版本化。';rows.innerHTML=unavailable('退休预审 Authority 未接通','不会从出生日期直接推断“已符合退休条件”');return}if(section==='retirement_facts'){title.textContent='正式退休事实';desc.textContent='仅展示 RetirementFact；退休预审通过不等于正式退休生效。';rows.innerHTML=retirementRows(d.recentRetirements||[]);return}if(section==='effects'){title.textContent='跨域生效协同';desc.textContent='PARTIAL_FAILED / FAILED 会直接暴露；任何 participant 未完成都不能显示“已离校完成”。';rows.innerHTML=effectRows(d.recentEffects||[]);return}if(section==='archive'){title.textContent='正式离校事实档案';desc.textContent='只展示 ExitFact；档案 Provider 尚未接通时不冒充已归档。';rows.innerHTML=exitRows(d.recentExitFacts||[]);return}title.textContent='最近离退案件';desc.textContent='总览同时保留审批、交接、结算、生效、正式离校和退休的不同事实语义。';rows.innerHTML=caseRows(d.recentCases||[])}
async function boot(){const r=await fetch('/api/v1/hr/exit/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok){document.getElementById('rows').innerHTML='<div class="empty">数据读取失败（'+r.status+'）</div>';return}const d=await r.json();document.getElementById('kpis').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="kpi"><span>${v}</span><b>${esc(d.summary[k])}</b></div>`).join('');renderSection(d);document.getElementById('caps').innerHTML=Object.entries(d.capabilities).map(([k,v])=>`<div class="cap"><span>${names[k]||k}</span><b class="${v?'ok':'off'}">${v?'已接通':'待施工'}</b></div>`).join('')}boot();
</script></body></html>
