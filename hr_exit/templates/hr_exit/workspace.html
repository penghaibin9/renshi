<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ section_title }} · HR16</title><style>
:root{--p:#c05a27;--ink:#31251f;--muted:#796c65;--line:#eee4de;--bg:#faf7f4;--card:#fff;--good:#08795a;--warn:#b34d13;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif}.shell{max-width:1500px;margin:auto;padding:26px}.hero{position:relative;overflow:hidden;padding:30px;border-radius:22px;background:linear-gradient(135deg,#3c2419,#a84c23 58%,#d77a45);color:#fff;box-shadow:0 18px 45px #6b341c26}.hero:after{content:"HR16";position:absolute;right:30px;top:-24px;font-size:112px;font-weight:800;opacity:.07}.eyebrow{font-size:12px;letter-spacing:.16em;opacity:.78}.hero h1{margin:7px 0 6px;font-size:28px}.hero p{margin:0;max-width:900px;color:#ffe9dd}.nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.nav a{white-space:nowrap;padding:9px 13px;border-radius:10px;text-decoration:none;color:#685b54;background:#fff;border:1px solid var(--line)}.nav a.active{color:#fff;background:var(--p);border-color:var(--p)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;margin-top:5px;font-size:23px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,.9fr);gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 15px #4a2f220a}.panel h2{font-size:16px;margin:0 0 13px}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr .75fr .8fr 1.2fr;gap:12px;align-items:center;padding:11px 12px;border:1px solid #f0e8e3;border-radius:12px}.row small{color:var(--muted)}.badge{justify-self:start;padding:3px 9px;border-radius:99px;background:#fff1e8;color:#a3461f;font-size:12px}.dates{font-size:12px;color:var(--muted)}.cap{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.cap:last-child{border:0}.ok{color:var(--good)}.off{color:var(--warn)}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.error{margin:20px;padding:18px;border-radius:12px;background:#fff0f0;color:var(--bad)}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:680px){.shell{padding:14px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
</style></head><body><main class="shell">{% if access_error %}<div class="error">{{ access_error }}</div>{% else %}<section class="hero"><div class="eyebrow">RETIREMENT & EXIT · LIFECYCLE CONTROL</div><h1>{{ section_title }}</h1><p>辞职批准、最后工作日、Employment 终止、账号停用、退休生效分别保存和审计；跨域 Effect Saga 出现部分失败时直接暴露，不用“已完成”掩盖。</p></section><nav class="nav"><a class="{% if section == 'overview' %}active{% endif %}" href="/hr/exit/">总览</a><a class="{% if section == 'cases' %}active{% endif %}" href="/hr/exit/cases/">离校审批</a><a class="{% if section == 'handover' %}active{% endif %}" href="/hr/exit/handover/">交接结算</a><a class="{% if section == 'retirement' %}active{% endif %}" href="/hr/exit/retirement/">退休预审</a><a class="{% if section == 'effects' %}active{% endif %}" href="/hr/exit/effects/">生效协同</a><a class="{% if section == 'archive' %}active{% endif %}" href="/hr/exit/archive/">档案历史</a></nav><section class="grid" id="kpis"></section><section class="layout"><div class="panel"><h2>最近离退案件</h2><div id="rows" class="rows"><div class="empty">正在读取离退 Authority…</div></div></div><aside class="panel"><h2>离退能力接通状态</h2><div id="caps"></div></aside></section>{% endif %}</main><script>
const labels={cases:'离退案件',awaitingApproval:'待审批',handover:'交接中',settlement:'结算中',effectExceptions:'生效异常',effectiveExits:'正式离校',retirementFacts:'退休事实'};const names={exitCase:'ExitCase',effectSaga:'跨域 Effect Saga',exitFact:'正式离校事实',retirementFact:'退休事实',approvalWorkflow:'完整审批',handoverChecklist:'交接清单',retirementPolicy:'退休政策',retirementPrecheck:'退休预审',assetProvider:'资产 Provider',iamProvider:'IAM Provider',financeProvider:'财务 Provider',archiveProvider:'档案 Provider'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const r=await fetch('/api/v1/hr/exit/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok){document.getElementById('rows').innerHTML='<div class="empty">数据读取失败（'+r.status+'）</div>';return}const d=await r.json();document.getElementById('kpis').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="kpi"><span>${v}</span><b>${esc(d.summary[k])}</b></div>`).join('');document.getElementById('rows').innerHTML=d.recentCases.length?d.recentCases.map(x=>`<div class="row"><div><b>${esc(x.case_no)}</b><br><small>${esc(x.exit_type)}</small></div><span class="badge">${esc(x.status)}</span><div class="dates">最后工作日<br><b>${esc(x.last_working_date||'-')}</b></div><div class="dates">Employment 终止 ${esc(x.planned_employment_end_date||'-')}<br>账号计划停用 ${esc((x.planned_access_end_at||'').slice(0,16)||'-')}</div></div>`).join(''):'<div class="empty">当前学校暂无离退案件</div>';document.getElementById('caps').innerHTML=Object.entries(d.capabilities).map(([k,v])=>`<div class="cap"><span>${names[k]||k}</span><b class="${v?'ok':'off'}">${v?'已接通':'待施工'}</b></div>`).join('')}boot();
</script></body></html>
