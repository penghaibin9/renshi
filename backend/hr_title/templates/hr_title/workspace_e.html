{% extends "hr_title/workspace_d.html" %}

{% block content %}
{{ block.super }}
<style>
.hr13e-history{margin-top:14px}.hr13e-history-list{display:grid;gap:8px;margin-top:12px}.hr13e-history-row{display:grid;grid-template-columns:minmax(150px,1.25fr) minmax(180px,1.35fr) 108px 104px;gap:10px;align-items:center;padding:12px;border:1px solid #edf0f5;border-radius:12px;background:#fff}.hr13e-history-row b,.hr13e-history-row small{display:block;overflow-wrap:anywhere}.hr13e-history-row small{color:#667085}.hr13e-history-badge{justify-self:start;padding:4px 9px;border-radius:999px;background:#eef2ff;color:#3448a6;font-size:12px;font-weight:700}.hr13e-history-empty{padding:24px 14px;text-align:center;color:#667085;border:1px dashed #d9deea;border-radius:12px;background:#fcfcfd}
@media(max-width:767.98px){.hr13e-history-row{grid-template-columns:minmax(0,1fr) auto}.hr13e-history-row .hr13e-history-case{grid-column:1}.hr13e-history-row .hr13e-history-date{grid-column:2;grid-row:2}}
@media(max-width:390px){.hr13e-history-row{grid-template-columns:1fr}.hr13e-history-row .hr13e-history-case,.hr13e-history-row .hr13e-history-date{grid-column:1;grid-row:auto}.hr13e-history-badge{justify-self:start}}
</style>
<script>
(() => {
  const mq = window.matchMedia('(max-width: 767.98px)');
  const sidebar = document.getElementById('sidebar');
  let desktopStoredState = null;
  let nativeCloseInFlight = false;

  function rememberDesktopState() {
    if (desktopStoredState !== null) return;
    desktopStoredState = localStorage.getItem('sidebarOpen');
  }

  function sidebarOccupiesViewport() {
    if (!sidebar) return false;
    const rect = sidebar.getBoundingClientRect();
    const style = window.getComputedStyle(sidebar);
    return style.display !== 'none' &&
      style.visibility !== 'hidden' &&
      Number(style.opacity || '1') !== 0 &&
      rect.width > 40 &&
      rect.right > 0 &&
      rect.left < window.innerWidth;
  }

  function closeWithShellStateMachine() {
    if (!mq.matches || nativeCloseInFlight || !sidebarOccupiesViewport()) return;
    if (typeof window.handleSidebarToggle !== 'function') return;

    rememberDesktopState();
    nativeCloseInFlight = true;
    // The compatibility shell owns the sidebar state machine in static/index/index.js:
    // handleSidebarToggle() updates #sidebar, .oh-wrapper-main and sidebarOpen
    // together. Reuse it instead of hiding the shell with page-specific CSS.
    window.handleSidebarToggle();
    setTimeout(() => {
      nativeCloseInFlight = false;
      localStorage.setItem('sidebarOpen', sidebarOccupiesViewport() ? 'true' : 'false');
    }, 80);
  }

  function ensureMobileClosed() {
    if (!mq.matches) return;
    rememberDesktopState();
    localStorage.setItem('sidebarOpen', 'false');
    closeWithShellStateMachine();
  }

  function restoreDesktopPreference() {
    if (mq.matches || desktopStoredState === null) return;
    if (desktopStoredState === 'true' || desktopStoredState === 'false') {
      localStorage.setItem('sidebarOpen', desktopStoredState);
    } else {
      localStorage.removeItem('sidebarOpen');
    }
    desktopStoredState = null;
  }

  // Set the persisted mobile intent before the compatibility restore path runs, then
  // perform delayed native closes after its bundled handler is guaranteed to
  // exist. A second pass covers late shell initialization without reopening an
  // already-closed sidebar because geometry is checked first.
  if (mq.matches) {
    rememberDesktopState();
    localStorage.setItem('sidebarOpen', 'false');
  }
  document.addEventListener('DOMContentLoaded', () => setTimeout(ensureMobileClosed, 40), { once: true });
  window.addEventListener('load', () => {
    setTimeout(ensureMobileClosed, 80);
    setTimeout(ensureMobileClosed, 240);
  }, { once: true });

  if (mq.addEventListener) {
    mq.addEventListener('change', (event) => {
      if (event.matches) {
        rememberDesktopState();
        localStorage.setItem('sidebarOpen', 'false');
        setTimeout(ensureMobileClosed, 80);
      } else {
        restoreDesktopPreference();
      }
    });
  }
})();

(() => {
  const section = '{{ section|escapejs }}';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  function alignAuthorityCopy() {
    const materialHint = document.querySelector('.hr13c-flow a[href="/hr/titles/materials/"] small');
    if (materialHint) materialHint.textContent = '查看真实材料快照与验收状态';
    const qualificationHint = document.querySelector('.hr13c-flow a[href="/hr/titles/eligibility/"] small');
    if (qualificationHint) qualificationHint.textContent = '查看每轮资格决定与退回理由';
  }

  async function renderQualificationHistory() {
    if (section !== 'eligibility') return;
    const work = document.querySelector('.hr13c-layout > div');
    if (!work || document.getElementById('hr13e-review-history')) return;

    const card = document.createElement('article');
    card.id = 'hr13e-review-history';
    card.className = 'hr13c-card hr13e-history';
    card.innerHTML = '<h2>资格审查决定历史</h2><p>每次提交轮次独立留痕；通过、退回补正、驳回不会被后一次审查覆盖。</p><div class="hr13e-history-list"><div class="hr13e-history-empty">正在读取真实审查决定…</div></div>';
    work.appendChild(card);

    try {
      const response = await fetch('/api/v1/hr/titles/dashboard/', {headers:{'X-Requested-With':'XMLHttpRequest'}});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      const rows = data.recentQualificationDecisions || [];
      const caseLabels = new Map((data.recentApplications || []).map((x) => [String(x.id), `${x.case_no} · ${x.requested_title_name || x.requested_title_code}`]));
      const decisionLabels = {ELIGIBLE:'资格通过', RETURNED:'退回补正', REJECTED:'未通过'};
      const target = card.querySelector('.hr13e-history-list');
      target.innerHTML = rows.length ? rows.map((x) => {
        const decisionNo = x.decision_no || '未编号决定';
        const attempt = x.attempt_no ? `第 ${x.attempt_no} 轮` : '轮次—';
        const caseRef = caseLabels.get(String(x.application_case_id)) || '关联职称申报';
        const reason = x.reason || x.reason_code || '无补充说明';
        const date = (x.decided_at || '').slice(0, 10) || '—';
        return `<div class="hr13e-history-row"><div><b>${esc(decisionNo)}</b><small>${esc(attempt)} · ${esc(reason)}</small></div><small class="hr13e-history-case">${esc(caseRef)}</small><span class="hr13e-history-badge">${esc(decisionLabels[x.decision] || '状态待确认')}</span><small class="hr13e-history-date">${esc(date)}</small></div>`;
      }).join('') : '<div class="hr13e-history-empty">当前没有已形成的资格审查决定；待审案件仍在上方队列中。</div>';
    } catch (error) {
      const target = card.querySelector('.hr13e-history-list');
      if (target) target.innerHTML = `<div class="hr13e-history-empty">审查决定读取失败：${esc(error.message)}</div>`;
    }
  }

  alignAuthorityCopy();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      alignAuthorityCopy();
      renderQualificationHistory();
    }, {once:true});
  } else {
    renderQualificationHistory();
  }
})();
</script>
{% endblock %}
