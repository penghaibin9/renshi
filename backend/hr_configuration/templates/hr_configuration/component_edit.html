{% extends "hr/base.html" %}{% load static %}{% block content %}<link rel="stylesheet" href="{% static 'hr_configuration/configuration_v1.css' %}"><div class="hrcfg-page"><div class="hrcfg-hero"><div><span class="hrcfg-kicker">草稿编辑</span><h1>{{ workflow.name }}</h1><p>修改 {{ kind }}；正式版本不会被覆盖。</p></div></div><section class="hrcfg-panel"><form method="post" class="hrcfg-form-grid">{% csrf_token %}{% for field in form %}<label><span>{{ field.label }}</span>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</label>{% endfor %}<div class="full"><button class="hrcfg-primary" type="submit">保存修改</button> <a class="hrcfg-link" href="{% url 'hr-configuration-workflow' workflow.id %}">取消</a></div></form><form method="post" action="{% url 'hr-configuration-component-delete' workflow.id kind form.instance.id %}" style="margin-top:14px">{% csrf_token %}<button type="submit" style="border:0;background:none;color:#b91c1c;cursor:pointer">删除此草稿项</button></form></section></div>{% endblock content %}
