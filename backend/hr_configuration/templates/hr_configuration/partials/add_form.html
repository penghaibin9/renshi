<details class="hrcfg-add"><summary>{{ button }}</summary><form method="post" class="hrcfg-form-grid">{% csrf_token %}<input type="hidden" name="action" value="{{ action }}">{% if form.non_field_errors %}<div class="hrcfg-error full">{{ form.non_field_errors }}</div>{% endif %}{% for field in form %}<label><span>{{ field.label }}</span>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</label>{% endfor %}<div class="full"><button class="hrcfg-primary" type="submit">保存到草稿</button></div></form></details>
