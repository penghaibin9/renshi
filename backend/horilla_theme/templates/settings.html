{% extends "settings_shell.html" %}
{% load i18n %}
{% block content %}
<div id="school-settings-shell" role="region" aria-label="{% trans "System Settings" %}">
  <style>
    /* The existing shell is retained in settings_shell.html. Runtime-only
       Tailwind arbitrary classes must not control the navigation's geometry. */
    #school-settings-shell .accordion-panel {
      position: static;
      height: auto;
      min-height: 0;
      max-height: none;
      transition: none;
    }
    #school-settings-shell .accordion-panel.max-h-0 {
      max-height: 0;
      visibility: hidden;
      overflow: hidden;
      pointer-events: none;
    }
    #school-settings-shell .accordion-panel:not(.max-h-0) {
      max-height: none;
      visibility: visible;
      overflow: visible;
    }
    #school-settings-shell .accordion-panel a {
      display: block;
      position: relative;
      padding: 5px 0;
    }
    #school-settings-shell .accordion-panel a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }
  </style>
  {{ block.super }}
</div>
{% endblock content %}
