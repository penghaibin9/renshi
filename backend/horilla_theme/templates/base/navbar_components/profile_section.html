{% load static i18n %}
{% with employee=request.user.employee_get %}
<button type="button" data-account-menu-toggle aria-label="账户菜单">
    <div class="flex gap-3">
        <div class="relative flex items-center cursor-pointer w-max">
            {% if employee %}
            <img
                src="{{ employee.get_avatar }}"
                alt="用户头像"
                class="w-11 h-11 rounded-full"
                loading="lazy"
            >
            <span
                class="
                    absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white
                    {% if user.employee_get.check_online %} bg-[#1dd75b] {% else %} bg-[red] {% endif %}
                "
            ></span>
            {% else %}
            <span data-account-avatar role="img" aria-label="账户头像"
                  class="w-11 h-11 rounded-full flex items-center justify-center font-semibold text-primary-600 bg-primary-50"
                  style="width:44px;height:44px;flex-shrink:0">
                {{ request.user.username|default:"账号"|slice:":1"|upper }}
            </span>
            {% endif %}
        </div>
        <div class="hidden md:block">
            <div class="flex flex-col justify-center items-start h-full">
                <h5 class="font-semibold text-sm">{% if employee %}{{ employee.get_full_name|title }}{% else %}{{ request.user.username }}{% endif %}</h5>
                <p class="text-xs text-dark-200">
                    {% if not employee %}
                        账号已登录
                    {% elif employee.check_online %}
                        在线
                    {% else %}
                        离线
                    {% endif %}
                </p>
            </div>
        </div>
        <div class="hidden md:block pt-2.5">
            <img
                src="/static/horilla_theme/assets/img/icons/downarrow.svg"
                alt=""
                class="downarrow"
            >
        </div>
    </div>
</button>

<div class="dropdown-content absolute z-10 bg-white rounded-lg [box-shadow:0px_0px_20px_0px_rgb(0_0_0_/_8%)] min-w-[170px] py-2 px-4 right-0">
    <ul>
        {% if employee %}
        {% if request.session.selected_company == "all" or employee.employee_work_info.company_id.id == request.session.selected_company|default:"-1"|add:"0" %}
            <li>
                <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <a
                        class="text-[13px]"
                        href="{% url 'employee-profile' %}"
                        hx-get="{% url 'employee-profile' %}"
                        hx-target="#ohMainContent"
                        hx-select="#ohMainContent > *"
                        hx-swap="innerHTML show:window:top"
                        hx-push-url="true"
                    >我的资料</a>
                </button>
            </li>
            <li>
                <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <a
                        class="text-[13px]"
                        href="{% url 'change-username' %}"
                        hx-get="{% url 'change-username' %}"
                        hx-target="#ohMainContent"
                        hx-select="#ohMainContent > *"
                        hx-swap="innerHTML show:window:top"
                        hx-push-url="true"
                    >修改用户名</a>
                </button>
            </li>
            <li>
                <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <a
                        class="text-[13px]"
                        href="{% url 'change-password' %}"
                        hx-get="{% url 'change-password' %}"
                        hx-target="#ohMainContent"
                        hx-select="#ohMainContent > *"
                        hx-swap="innerHTML show:window:top"
                        hx-push-url="true"
                    >修改密码</a>
                </button>
            </li>
        {% endif %}

        {% endif %}
        <hr class="text-[#1c1c1c] my-2">
        <li>
            <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                <a class="text-[13px]" href="{% url 'logout' %}"> 退出登录 </a>
            </button>
        </li>
    </ul>
</div>
{% endwith %}
