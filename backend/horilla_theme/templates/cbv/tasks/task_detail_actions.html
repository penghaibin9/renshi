{% load i18n static %}

{% if request.user|task_crud_perm:instance or perms.project.view_task %}
    <a
        hx-get="{% url 'update-task' instance.id %}?project_task=true"
        hx-target="#genericModalBody"
        data-toggle="oh-modal-toggle"
        data-target="#genericModal"
        data-key=".oh-kanban__section"
        class="oh-btn oh-btn--light-bkg oh-btn--secondary px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
    >
        <ion-icon name="create-outline"></ion-icon>
        {% trans "Edit" %}
    </a>
{% endif %}

<a
    hx-get="{% url 'task-timesheet' instance.id %}?employee_id={{request.user.employee_get.id}}"
    hx-target="#TaskTimesheetTarget"
    data-target="#TaskTimesheetModal"
    data-toggle="oh-modal-toggle"
    data-key=".oh-kanban__section"
    class="px-4 py-2 bg-white rounded-md text-xs flex items-center justify-center gap-2 border border-info-500 hover:border-info-600 transition duration-300"
>
    <img
        src="{% static 'horilla_theme/assets/img/icons/bar-chart.svg' %}"
        alt="{% trans 'Delete' %}"
        width="16"
        class="mt-[-1px]"
    >
    {% trans "Time sheet" %}
</a>

{% if request.user|task_crud_perm:instance or perms.project.view_task %}
    <a
        href="#"
        hx-post="{% url 'delete-task' instance.id %}?view={{request.GET.view }}"
        hx-swap="none"
        hx-confirm="{% trans 'Do you want to delete this task?' %}"
        hx-on::after-request="window.location.reload()"
        class="px-4 py-2 bg-danger text-white rounded-md text-xs flex items-center justify-center gap-2 hover:bg-danger-dark transition duration-300"
        onclick="event.stopPropagation()"
    >
        <img
            src="{% static 'horilla_theme/assets/img/icons/trash.svg' %}"
            alt="{% trans 'Delete' %}"
            width="16"
            class="mt-[-1px] filter brightness-0 invert"
        >
        {% trans "Delete" %}
    </a>
{% endif %}
