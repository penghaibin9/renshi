{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ connection.name }} - 学校目录登录</title><link rel="stylesheet" href="{% static 'horilla_theme/assets/css/login-v2.css' %}"></head><body class="yk-login-page"><main class="yk-login-shell"><section class="yk-login-panel"><div class="yk-login-panel__inner"><div class="yk-login-main"><h1 class="yk-login-title">{{ connection.name }}</h1><p class="yk-login-subtitle">使用学校 LDAP / AD 账号登录；密码只用于本次 TLS 认证，不会保存。</p>{% for message in messages %}<div class="oh-alert {{ message.tags }}">{{ message }}</div>{% endfor %}<form method="post" class="yk-login-form">{% csrf_token %}<input type="hidden" name="next" value="{{ next_url }}"><div class="yk-login-field"><label>学校账号</label><div class="yk-login-control"><input class="yk-login-input" name="username" autocomplete="username" required></div></div><div class="yk-login-field"><label>密码</label><div class="yk-login-control"><input class="yk-login-input" type="password" name="password" autocomplete="current-password" required></div></div><button class="yk-login-submit" type="submit">登录</button><p><a class="yk-login-link" href="{% url 'login' %}">返回本地登录</a></p></form></div></div></section></main></body></html>
