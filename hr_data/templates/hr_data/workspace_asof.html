{% extends "hr_data/workspace_live.html" %}

{% block content %}
{{ block.super }}
<style>
.hr18asof-card{margin-top:14px}.hr18asof-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hr18asof-chip{padding:6px 9px;border:1px solid #dbe4f1;border-radius:999px;background:#f8fbff;color:#5a6679;font-size:12px}.hr18asof-list{display:grid;gap:8px;margin-top:12px}.hr18asof-row{display:grid;grid-template-columns:minmax(170px,1.2fr) minmax(190px,1.3fr) 116px 110px;gap:10px;align-items:center;padding:12px;border:1px solid #e9edf4;border-radius:12px;background:#fff}.hr18asof-row b,.hr18asof-row small{display:block;overflow-wrap:anywhere}.hr18asof-row small{color:#687386}.hr18asof-pill{justify-self:start;padding:4px 9px;border-radius:999px;background:#eef3ff;color:#3657a2;font-size:12px;font-weight:700}.hr18asof-pill.blocked{background:#fff2e8;color:#a14c19}.hr18asof-empty{padding:24px 14px;text-align:center;color:#687386;border:1px dashed #d8dfeb;border-radius:12px;background:#fcfdff}.hr18asof-rule{margin-top:12px;padding:12px;border-radius:12px;background:#fff7ed;color:#8b5b24;font-size:12px;line-height:1.7}
@media(max-width:720px){.hr18asof-row{grid-template-columns:minmax(0,1fr) auto}.hr18asof-row .detail{grid-column:1}.hr18asof-row .date{grid-column:2;grid-row:2}}
@media(max-width:390px){.hr18asof-row{grid-template-columns:1fr}.hr18asof-row .detail,.hr18asof-row .date{grid-column:1;grid-row:auto}.hr18asof-pill{justify-self:start}}
</style>
{% endblock %}

{% block scripts %}
{{ block.super }}
<script>
(() => {
  const section='{{ section|escapejs }}';
  if(section!=='asof')return;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const legacy=document.getElementById('hr18-title')?.closest('.hr18-card');
  if(legacy)legacy.hidden=true;
  const work=document.querySelector('.hr18-layout > div');
  if(!work||document.getElementById('hr18asof-card'))return;
  const card=document.createElement('article');
  card.id='hr18asof-card';card.className='hr18-card hr18asof-card';
  card.innerHTML='<h2>As-of 历史证据台账</h2><p>这里展示可信历史重建/Provider 产生的证据状态。当前没有在前端开放“生成 COMPLETE 证据”的按钮，避免人工把不可重建历史点成完成。</p><div class="hr18asof-summary"><span class="hr18asof-chip">证据总数 <strong id="hr18asof-total">—</strong></span><span class="hr18asof-chip">COMPLETE <strong id="hr18asof-complete">—</strong></span><span class="hr18asof-chip">被阻断 <strong id="hr18asof-blocked">—</strong></span></div><div id="hr18asof-list" class="hr18asof-list"><div class="hr18asof-empty">正在读取 As-of 证据…</div></div><div class="hr18asof-rule"><strong>边界保持：</strong>submissionAsOfGate 已接通，但 asOfEngine 仍未接通。正式报送 validate 必须引用同学校、同 definition/version、同 as-of 且 COMPLETE 的 AsOfEvidenceSnapshot；PARTIAL / UNAVAILABLE / ERROR 不能进入正式报送。</div>';
  work.appendChild(card);
  fetch('/api/v1/hr/data/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('hr18asof-total').textContent=d.summary?.asOfEvidence??0;document.getElementById('hr18asof-complete').textContent=d.summary?.completeAsOfEvidence??0;document.getElementById('hr18asof-blocked').textContent=d.summary?.blockedAsOfEvidence??0;const rows=d.recentAsOfEvidence||[];document.getElementById('hr18asof-list').innerHTML=rows.length?rows.map(x=>{const blocked=(x.blocked_domains_json||[]).join(', ')||'无';const statuses=Object.entries(x.source_statuses_json||{}).map(([k,v])=>`${k}:${v}`).join(' · ')||'无来源状态';return `<div class="hr18asof-row"><div><b>${esc(x.evidence_no)}</b><small>${esc(x.definition_code)} · v${esc(x.definition_version)}</small></div><small class="detail">${esc(statuses)} · 阻断域 ${esc(blocked)}</small><span class="hr18asof-pill ${x.status==='COMPLETE'?'':'blocked'}">${esc(x.status)}</span><small class="date">As-of ${esc(x.as_of_date||'—')}</small></div>`}).join(''):'<div class="hr18asof-empty">当前没有历史证据；在可信历史重建 Provider 接通前，正式报送会保持 fail-closed。</div>'}).catch(e=>{document.getElementById('hr18asof-list').innerHTML=`<div class="hr18asof-empty">证据读取失败：${esc(e.message)}</div>`});
})();
</script>
{% endblock %}
