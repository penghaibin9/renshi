{% load static i18n %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教职工主档 · HR03</title>
  <style>
    :root {
      --hr-color-primary: #2563eb; --hr-color-primary-soft: #eff6ff;
      --hr-color-success: #16a34a; --hr-color-warning: #d97706; --hr-color-danger: #dc2626;
      --hr-bg-page: #f5f7fa; --hr-bg-card: #fff; --hr-border-subtle: #e5e7eb;
      --hr-text-primary: #1f2937; --hr-text-secondary: #6b7280;
      --hr-radius-md: 12px; --hr-shadow-card: 0 1px 3px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: var(--hr-bg-page); color: var(--hr-text-primary); }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 24px; }
    .back { color: var(--hr-color-primary); text-decoration: none; font-size: 13px; }
    .card { background: var(--hr-bg-card); border-radius: var(--hr-radius-md); box-shadow: var(--hr-shadow-card); padding: 20px; }
    .header { display: flex; align-items: center; gap: 16px; margin: 12px 0 16px; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--hr-color-primary-soft); color: var(--hr-color-primary); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; }
    .header h1 { margin: 0; font-size: 24px; }
    .header .sub { color: var(--hr-text-secondary); font-size: 14px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
    .badge.active { background: #dcfce7; color: #166534; }
    .badge.pending { background: #fef9c3; color: #854d0e; }
    .badge.departed, .badge.retired { background: #fee2e2; color: #991b1b; }
    .asof { margin: 12px 0; padding: 8px 12px; background: var(--hr-color-primary-soft); border-radius: 8px; font-size: 13px; color: #1e40af; display: flex; justify-content: space-between; align-items: center; }
    .asof.warn { background: #fef3c7; color: #92400e; }
    .nav { display: flex; gap: 4px; border-bottom: 1px solid var(--hr-border-subtle); margin-bottom: 16px; overflow-x: auto; }
    .nav a { flex: 0 0 auto; padding: 10px 14px; color: var(--hr-text-secondary); text-decoration: none; font-size: 14px; border-bottom: 2px solid transparent; }
    .nav a.on { color: var(--hr-color-primary); border-bottom-color: var(--hr-color-primary); }
    .grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    .section-title { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 13px; }
    .kv dt { color: var(--hr-text-secondary); }
    .sensitive { position: relative; }
    .sensitive .val { filter: blur(4px); user-select: none; }
    .sensitive.revealed .val { filter: none; }
    .reveal-btn { font-size: 12px; color: var(--hr-color-primary); background: none; border: none; cursor: pointer; margin-left: 6px; }
    .risk { border-left: 3px solid var(--hr-color-danger); background: #fef2f2; padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
    .risk.warn { border-left-color: var(--hr-color-warning); background: #fffbeb; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/hr/staff/">← 教职工名册</a>
    <div class="header">
      <div class="avatar" id="avatar">?</div>
      <div>
        <h1><span id="name">--</span> <span id="staffNo" style="color:#6b7280;font-size:14px"></span>
          <span class="badge" id="statusBadge">--</span></h1>
        <div class="sub" id="orgLine">--</div>
      </div>
    </div>
    <div class="asof" id="asofBar">载入中…</div>
    <nav class="nav" aria-label="教职工主档工作区">
      <a class="on" href="/hr/staff/{{ staff_id }}/">概览</a>
      <a href="/hr/staff/{{ staff_id }}/assignments">任职履历</a>
      <a href="/hr/staff/{{ staff_id }}/backgrounds">教育资格</a>
      <a href="/hr/staff/{{ staff_id }}/materials">材料</a>
      <a href="/hr/staff/{{ staff_id }}/corrections">更正与历史</a>
    </nav>
    <div class="grid">
      <div>
        <div class="card" style="margin-bottom:16px">
          <h3 class="section-title">当前人事概况</h3>
          <dl class="kv" id="facts">加载中…</dl>
        </div>
        <div class="card" style="margin-bottom:16px">
          <h3 class="section-title">关键资格</h3>
          <dl class="kv" id="qualifications"><dd>载入中…</dd></dl>
        </div>
      </div>
      <div>
        <div id="riskPanel"></div>
        <div class="card">
          <h3 class="section-title">身份摘要</h3>
          <dl class="kv" id="identity">加载中…</dl>
        </div>
      </div>
    </div>
  </div>
  <script>
    const staffId = "{{ staff_id }}";
    function getCookie(name) {
      const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
      return m ? decodeURIComponent(m[1]) : "";
    }
    const statusLabels = {ACTIVE:["在职","active"],PENDING_ENTRY:["待入职","pending"],DEPARTED:["已离职","departed"],RETIRED:["已退休","retired"],SUSPENDED:["停职","departed"]};
    const FIELD_LEVELS = {
      "identity.document_number": "HIGH_SENSITIVE",
      "person.birth_date": "SENSITIVE",
      "contact.personal_mobile": "SENSITIVE",
      "contact.personal_email": "SENSITIVE",
    };
    let revealTimers = {};
    async function load() {
      const q = new URLSearchParams({asOf: document.getElementById("asof").dataset.asOf || ""});
      const resp = await fetch(`/api/hr/v1/staff/${staffId}/profile?` + q);
      if (!resp.ok) { document.getElementById("asofBar").textContent = `加载失败（${resp.status}）`; return; }
      const body = await resp.json();
      const d = body.data;
      const h = d.identityHeader;
      document.getElementById("name").textContent = h.legalName;
      document.getElementById("staffNo").textContent = h.staffNo;
      const [label, cls] = statusLabels[h.employmentStatus] || [h.employmentStatus, ""];
      const sb = document.getElementById("statusBadge");
      sb.textContent = label; sb.className = "badge " + cls;
      document.getElementById("avatar").textContent = (h.legalName || "?").slice(0,1);
      const pa = d.currentFacts.primaryAssignment;
      document.getElementById("orgLine").textContent = pa ? `${pa.orgName || "-"} · ${pa.positionName || "-"}` : "无当前主岗";
      const bar = document.getElementById("asofBar");
      if (d.isHistoricalView) {
        bar.className = "asof warn";
        bar.innerHTML = `历史口径：截至 ${d.asOf}（只读，编辑入口已禁用）<a class="back" href="?">查看当前</a>`;
      } else {
        bar.className = "asof";
        bar.innerHTML = `当前事实 · 截至 ${d.asOf} <span id="asOfInputWrap"><input type="date" id="asOfInput" onchange="goAsOf()" style="padding:4px 8px;border:1px solid #bfdbfe;border-radius:6px"></span>`;
      }
      const facts = document.getElementById("facts");
      facts.innerHTML = factRow("主单位", pa ? pa.orgName : "-") + factRow("主岗位", pa ? pa.positionName : "-")
        + factRow("人员类别", h.staffCategoryCode) + factRow("入校日", d.currentFacts.dateJoining || "-")
        + factRow("聘用关系", (d.currentFacts.relationships || []).map(r => r.relationshipType).join(", ") || "-")
        + factRow("兼岗数", (d.currentFacts.concurrentAssignments || []).length);
      const idBox = document.getElementById("identity");
      idBox.innerHTML = factRow("身份证", `<span class="sensitive" id="idNo"><span class="val">${d.identitySummary.maskedIdentityNo || "-"}</span></span>`)
        + factRow("性别", d.identitySummary.gender || "-") + factRow("出生年份", d.identitySummary.birthYear || "-");
    }
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function factRow(k, v) { return `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`; }
    function goAsOf() {
      const v = document.getElementById("asOfInput").value;
      window.location.search = v ? `?asOf=${v}` : "";
    }
    async function revealSensitive(fieldCode, elId) {
      const el = document.getElementById(elId);
      if (!el) return;
      const purpose = prompt("请填写查看用途（将记录审计）", "业务核对");
      if (!purpose) return;
      const resp = await fetch(`/api/hr/v1/staff/${staffId}/sensitive-fields/${fieldCode}/reveal`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Requested-With": "XMLHttpRequest",
          "X-CSRFToken": getCookie("csrftoken"),
        },
        body: JSON.stringify({purpose}),
      });
      if (!resp.ok) { alert("查看失败：" + (await resp.json()).error?.code); return; }
      const body = await resp.json();
      el.classList.add("revealed");
      el.querySelector(".val").textContent = body.data.value;
      el.innerHTML += `<button class="reveal-btn" onclick="mask('${elId}')">重新遮罩</button>`;
      clearTimeout(revealTimers[elId]);
      revealTimers[elId] = setTimeout(() => mask(elId), (body.data.maskAfterSeconds || 60) * 1000);
    }
    function mask(elId) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.classList.remove("revealed");
      el.querySelector(".val").textContent = "••••••••";
    }
    load();
  </script>
</body>
</html>
