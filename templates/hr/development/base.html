<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ page_title|default:"教师发展" }}{% endblock %} · 跃科高校人事系统</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    .topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; align-items: center; gap: 16px;
    }
    .topbar h1 { font-size: 18px; color: var(--text); }
    .topbar .crumb { color: var(--muted); font-size: 13px; }
    .topbar .crumb a { color: var(--primary); text-decoration: none; }
    nav {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 0 24px; display: flex; gap: 4px; flex-wrap: wrap;
    }
    nav a {
      padding: 10px 16px; color: var(--muted); text-decoration: none;
      font-size: 14px; border-bottom: 2px solid transparent;
    }
    nav a.active, nav a:hover { color: var(--primary); border-bottom-color: var(--primary); }
    main { padding: 24px; max-width: 1440px; margin: 0 auto; }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .stat-card .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .stat-card .value { font-size: 26px; font-weight: 600; color: var(--text); }
    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .btn {
      padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer; font-size: 14px;
    }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    table {
      width: 100%; border-collapse: collapse; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    th, td { padding: 12px 16px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 12px; background: #e2e8f0; color: var(--muted);
    }
    .badge-success { background: #dcfce7; color: var(--success); }
    .badge-danger { background: #fee2e2; color: var(--danger); }
    .badge-primary { background: #dbeafe; color: var(--primary); }
    .empty {
      text-align: center; padding: 48px; color: var(--muted);
      background: var(--card); border: 1px dashed var(--border); border-radius: 8px;
    }
    @media (max-width: 768px) {
      main { padding: 12px; }
      .topbar { padding: 10px 16px; }
      table { font-size: 12px; }
      th, td { padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="crumb"><a href="/hr/development/dashboard">教师发展</a></span>
    <h1>{% block title_zh %}{{ page_title|default:"教师发展" }}{% endblock %}</h1>
  </div>
  <nav>
    <a href="/hr/development/dashboard">发展总览</a>
    <a href="/hr/development/plans" {% if request.path == '/hr/development/plans' %}class="active"{% endif %}>教师发展计划</a>
    <a href="/hr/development/programs" {% if request.path == '/hr/development/programs' %}class="active"{% endif %}>培训项目</a>
    <a href="/hr/development/requests" {% if request.path == '/hr/development/requests' %}class="active"{% endif %}>报名与审批</a>
    <a href="/hr/development/enterprise-practice" {% if request.path == '/hr/development/enterprise-practice' %}class="active"{% endif %}>企业实践</a>
    <a href="/hr/development/records/1">发展档案</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
