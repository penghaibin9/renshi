{% extends "hr/development/base.html" %}
{% block workspace_content %}
<section class="hr10-summary" aria-label="发展计划摘要">
  <article class="hr10-kpi"><span>在执行计划</span><strong>{{ stats.in_execution }}</strong><small>已发布或执行中的正式计划</small></article>
  <article class="hr10-kpi"><span>待审批</span><strong>{{ stats.pending_review }}</strong><small>需要完成审核结论的计划</small></article>
  <article class="hr10-kpi"><span>已关闭</span><strong>{{ stats.closed }}</strong><small>保留历史且不再执行</small></article>
  <article class="hr10-kpi"><span>计划总数</span><strong>{{ plans|length }}</strong><small>当前学校 Authority 计划</small></article>
</section>
{% endblock %}
