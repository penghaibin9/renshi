{% extends "hr_title/workspace_e.html" %}

{% block content %}
{{ block.super }}
<style>
.hr13f-panel{margin-top:14px}.hr13f-summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hr13f-chip{padding:6px 9px;border-radius:999px;border:1px solid #dfe4f0;background:#f9fbff;color:#5e687a;font-size:12px}.hr13f-chip strong{color:#202a3c}.hr13f-forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.hr13f-form{border:1px solid #e3e7ef;border-radius:14px;background:#fcfdff;padding:14px}.hr13f-form h3{margin:0 0 4px;font-size:15px}.hr13f-form p{margin:0 0 11px;color:#687386;font-size:12px;line-height:1.6}.hr13f-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.hr13f-field{display:grid;gap:5px}.hr13f-field.full{grid-column:1/-1}.hr13f-field label{font-size:12px;font-weight:700;color:#485267}.hr13f-input,.hr13f-select,.hr13f-textarea{width:100%;border:1px solid #d7deea;border-radius:10px;background:#fff;color:#1f2937;padding:9px 10px;font:inherit}.hr13f-input,.hr13f-select{height:40px}.hr13f-textarea{min-height:72px;resize:vertical}.hr13f-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.hr13f-btn{border:0;border-radius:10px;padding:9px 13px;background:#3856a6;color:#fff;font-weight:700;cursor:pointer}.hr13f-btn.secondary{background:#edf2ff;color:#304d9c}.hr13f-btn:disabled{opacity:.55;cursor:not-allowed}.hr13f-message{font-size:12px;color:#687386}.hr13f-list{display:grid;gap:8px;margin-top:10px}.hr13f-row{display:grid;grid-template-columns:minmax(160px,1.2fr) minmax(190px,1.3fr) 110px 105px;gap:10px;align-items:center;padding:12px;border:1px solid #e8ebf2;border-radius:12px;background:#fff}.hr13f-row b,.hr13f-row small{display:block;overflow-wrap:anywhere}.hr13f-row small{color:#687386}.hr13f-badge{justify-self:start;padding:4px 9px;border-radius:999px;background:#edf2ff;color:#34549f;font-size:12px;font-weight:700}.hr13f-badge.warn{background:#fff2e8;color:#a14c19}.hr13f-badge.good{background:#eaf8f0;color:#176a43}.hr13f-empty{padding:22px 14px;text-align:center;color:#687386;border:1px dashed #d7deea;border-radius:12px;background:#fcfdff}.hr13f-rule{margin-top:12px;padding:12px;border-radius:12px;background:#fff7ed;color:#885624;font-size:12px;line-height:1.7}
@media(max-width:840px){.hr13f-forms{grid-template-columns:1fr}.hr13f-fields{grid-template-columns:1fr}.hr13f-field.full{grid-column:1}.hr13f-row{grid-template-columns:minmax(0,1fr) auto}.hr13f-row .hr13f-detail{grid-column:1}.hr13f-row .hr13f-date{grid-column:2;grid-row:2}}
@media(max-width:390px){.hr13f-row{grid-template-columns:1fr}.hr13f-row .hr13f-detail,.hr13f-row .hr13f-date{grid-column:1;grid-row:auto}.hr13f-badge{justify-self:start}}
</style>
{% endblock %}

{% block scripts %}
{{ block.super }}
<script>
(() => {
  const section = '{{ section|escapejs }}';
  const panelSections = new Set(['experts','expert_panel','panel','deliberation','voting','vote']);
  if (!panelSections.has(section)) return;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const csrf = () => (document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1] || '');
  const post = async (url, body={}) => {
    const response = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(body)});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data?.error?.message || data?.error?.code || `HTTP ${response.status}`);
    return data;
  };
  const work = document.querySelector('.hr13c-layout > div');
  if (!work || document.getElementById('hr13f-panel')) return;
  const card = document.createElement('article');
  card.id='hr13f-panel'; card.className='hr13c-card hr13f-panel';
  card.innerHTML=`
    <h2>专家评议与表决 Authority</h2>
    <p>资格通过不等于评审通过。每一轮冻结法定票数与通过票数；专家必须先接受分配且无回避冲突，Ballot 提交后不可改。</p>
    <div class="hr13f-summary"><span class="hr13f-chip">开放评审轮次 <strong id="hr13f-open-rounds">—</strong></span><span class="hr13f-chip">专家分配 <strong id="hr13f-assignments">—</strong></span><span class="hr13f-chip">回避专家 <strong id="hr13f-conflicts">—</strong></span><span class="hr13f-chip">已投 Ballot <strong id="hr13f-ballots">—</strong></span></div>
    <div class="hr13f-forms">
      <form id="hr13f-round-form" class="hr13f-form"><h3>开启评审轮次</h3><p>为资格通过或上一轮未通过的案件冻结本轮 quorum。</p><div class="hr13f-fields"><div class="hr13f-field full"><label>申报案件</label><select id="hr13f-case" class="hr13f-select" required></select></div><div class="hr13f-field"><label>轮次编号</label><input id="hr13f-round-no" class="hr13f-input" required placeholder="REV-2026-001"></div><div class="hr13f-field"><label>法定 Ballot 数</label><input id="hr13f-required" class="hr13f-input" type="number" min="1" value="3" required></div><div class="hr13f-field"><label>通过票数</label><input id="hr13f-pass-required" class="hr13f-input" type="number" min="1" value="2" required></div></div><div class="hr13f-actions"><button class="hr13f-btn" type="submit">开启评审</button><span id="hr13f-round-msg" class="hr13f-message"></span></div></form>
      <form id="hr13f-assign-form" class="hr13f-form"><h3>分配专家/评委</h3><p>专家身份只引用 HR03 Staff，不复制人员主档；同一轮同一专家不可重复分配。</p><div class="hr13f-fields"><div class="hr13f-field full"><label>开放轮次</label><select id="hr13f-assign-round" class="hr13f-select" required></select></div><div class="hr13f-field"><label>分配编号</label><input id="hr13f-assignment-no" class="hr13f-input" required placeholder="ASN-2026-001"></div><div class="hr13f-field"><label>专家 Staff UUID</label><input id="hr13f-reviewer" class="hr13f-input" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div><div class="hr13f-field"><label>角色</label><select id="hr13f-role" class="hr13f-select"><option value="EXPERT">专家</option><option value="COMMITTEE">评委</option><option value="CHAIR">主任/组长</option></select></div></div><div class="hr13f-actions"><button class="hr13f-btn secondary" type="submit">分配</button><span id="hr13f-assign-msg" class="hr13f-message"></span></div></form>
      <form id="hr13f-response-form" class="hr13f-form"><h3>接受 / 回避</h3><p>有利益冲突时必须回避并说明原因；回避专家不能提交 Ballot。</p><div class="hr13f-fields"><div class="hr13f-field full"><label>待响应分配</label><select id="hr13f-response-id" class="hr13f-select" required></select></div><div class="hr13f-field"><label>响应</label><select id="hr13f-response-type" class="hr13f-select"><option value="accept">接受</option><option value="decline">拒绝</option><option value="conflict">声明回避</option></select></div><div class="hr13f-field"><label>回避/拒绝说明</label><input id="hr13f-conflict-note" class="hr13f-input" placeholder="存在合作/亲属/利益冲突等"></div></div><div class="hr13f-actions"><button class="hr13f-btn secondary" type="submit">保存响应</button><span id="hr13f-response-msg" class="hr13f-message"></span></div></form>
      <form id="hr13f-ballot-form" class="hr13f-form"><h3>提交评议 Ballot</h3><p>仅 ACCEPTED 且未声明冲突的专家可投票；提交后 append-only。</p><div class="hr13f-fields"><div class="hr13f-field full"><label>可投票分配</label><select id="hr13f-ballot-assignment" class="hr13f-select" required></select></div><div class="hr13f-field"><label>Ballot 编号</label><input id="hr13f-ballot-no" class="hr13f-input" required placeholder="BAL-2026-001"></div><div class="hr13f-field"><label>建议</label><select id="hr13f-recommendation" class="hr13f-select"><option value="PASS">通过</option><option value="FAIL">不通过</option><option value="ABSTAIN">弃权</option></select></div><div class="hr13f-field"><label>评分（可选）</label><input id="hr13f-score" class="hr13f-input" type="number" step="0.01"></div><div class="hr13f-field full"><label>评议说明</label><textarea id="hr13f-rationale" class="hr13f-textarea"></textarea></div></div><div class="hr13f-actions"><button class="hr13f-btn" type="submit">提交 Ballot</button><span id="hr13f-ballot-msg" class="hr13f-message"></span></div></form>
      <form id="hr13f-close-form" class="hr13f-form"><h3>关单并形成评审结论</h3><p>后端重新计算 quorum 和通过票数，不接受前端直接指定“通过”。</p><div class="hr13f-fields"><div class="hr13f-field full"><label>开放轮次</label><select id="hr13f-close-round" class="hr13f-select" required></select></div></div><div class="hr13f-actions"><button class="hr13f-btn" type="submit">校验并关单</button><span id="hr13f-close-msg" class="hr13f-message"></span></div></form>
    </div>
    <div class="hr13f-rule">硬门禁：UNDER_REVIEW 本身不能进入 PROPOSED。只有 ReviewRound 票数达到 required_ballots 且 PASS 达到 required_pass_votes，才会原子进入 PROPOSED；未达到通过票数进入 REVIEW_NOT_PASSED，而不是错误复用“资格驳回”。</div>
    <h3 style="margin-top:18px">评审轮次</h3><div id="hr13f-round-list" class="hr13f-list"><div class="hr13f-empty">正在读取评审轮次…</div></div>
    <h3 style="margin-top:18px">专家分配</h3><div id="hr13f-assignment-list" class="hr13f-list"><div class="hr13f-empty">正在读取专家分配…</div></div>
    <h3 style="margin-top:18px">表决 Ballot</h3><div id="hr13f-ballot-list" class="hr13f-list"><div class="hr13f-empty">正在读取 Ballot…</div></div>`;
  work.appendChild(card);
  let snapshot=null;
  const options=(el,rows,value,label,empty)=>{el.innerHTML=rows.length?rows.map(x=>`<option value="${esc(value(x))}">${esc(label(x))}</option>`).join(''):`<option value="">${esc(empty)}</option>`};
  const render=()=>{
    const s=snapshot?.summary||{};document.getElementById('hr13f-open-rounds').textContent=s.openReviewRounds??0;document.getElementById('hr13f-assignments').textContent=s.reviewAssignments??0;document.getElementById('hr13f-conflicts').textContent=s.conflictedReviewers??0;document.getElementById('hr13f-ballots').textContent=s.reviewBallots??0;
    const cases=(snapshot.recentApplications||[]).filter(x=>['ELIGIBLE','UNDER_REVIEW','REVIEW_NOT_PASSED'].includes(x.status));const rounds=(snapshot.recentReviewRounds||[]).filter(x=>x.status==='OPEN');const assignments=snapshot.recentReviewAssignments||[];const pending=assignments.filter(x=>x.status==='ASSIGNED');const accepted=assignments.filter(x=>x.status==='ACCEPTED'&&!x.conflict_declared);const ballots=snapshot.recentReviewBallots||[];
    options(document.getElementById('hr13f-case'),cases,x=>x.id,x=>`${x.case_no} · ${x.requested_title_name||x.requested_title_code} · ${x.status}`,'当前没有可开启评审的案件');options(document.getElementById('hr13f-assign-round'),rounds,x=>x.id,x=>`${x.round_no} · 第${x.attempt_no}轮`,'当前没有开放轮次');options(document.getElementById('hr13f-close-round'),rounds,x=>x.id,x=>`${x.round_no} · ${x.required_pass_votes}/${x.required_ballots}`,'当前没有开放轮次');options(document.getElementById('hr13f-response-id'),pending,x=>x.id,x=>`${x.assignment_no} · ${x.reviewer_staff_id}`,'当前没有待响应分配');options(document.getElementById('hr13f-ballot-assignment'),accepted.filter(a=>!ballots.some(b=>b.assignment_id===a.id)),x=>x.id,x=>`${x.assignment_no} · ${x.reviewer_role}`,'当前没有可投票分配');
    const roundList=document.getElementById('hr13f-round-list');roundList.innerHTML=(snapshot.recentReviewRounds||[]).length?(snapshot.recentReviewRounds||[]).map(x=>{const c=x.status==='PASSED'?' good':x.status==='NOT_PASSED'?' warn':'';const close=x.closure_snapshot_json||{};return `<div class="hr13f-row"><div><b>${esc(x.round_no)}</b><small>第 ${esc(x.attempt_no)} 轮 · 案件 ${esc(x.application_case_id)}</small></div><small class="hr13f-detail">门槛 ${esc(x.required_pass_votes)}/${esc(x.required_ballots)}${x.status!=='OPEN'?` · 实际通过 ${esc(close.passVotes??'—')}/${esc(close.ballots??'—')}`:''}</small><span class="hr13f-badge${c}">${esc(x.status)}</span><small class="hr13f-date">${esc((x.closed_at||x.opened_at||'').slice(0,10))}</small></div>`}).join(''):'<div class="hr13f-empty">当前没有评审轮次。</div>';
    const assignmentList=document.getElementById('hr13f-assignment-list');assignmentList.innerHTML=assignments.length?assignments.map(x=>{const c=x.conflict_declared?' warn':x.status==='ACCEPTED'?' good':'';return `<div class="hr13f-row"><div><b>${esc(x.assignment_no)}</b><small>${esc(x.reviewer_staff_id)}</small></div><small class="hr13f-detail">${esc(x.reviewer_role)}${x.conflict_note?` · ${esc(x.conflict_note)}`:''}</small><span class="hr13f-badge${c}">${esc(x.conflict_declared?'CONFLICT':x.status)}</span><small class="hr13f-date">${esc((x.responded_at||x.assigned_at||'').slice(0,10))}</small></div>`}).join(''):'<div class="hr13f-empty">当前没有专家分配。</div>';
    const ballotList=document.getElementById('hr13f-ballot-list');ballotList.innerHTML=ballots.length?ballots.map(x=>{const c=x.recommendation==='PASS'?' good':x.recommendation==='FAIL'?' warn':'';return `<div class="hr13f-row"><div><b>${esc(x.ballot_no)}</b><small>Assignment ${esc(x.assignment_id)}</small></div><small class="hr13f-detail">${x.score!==null&&x.score!==undefined?`评分 ${esc(x.score)} · `:''}${esc(x.rationale||'无补充说明')}</small><span class="hr13f-badge${c}">${esc(x.recommendation)}</span><small class="hr13f-date">${esc((x.submitted_at||'').slice(0,10))}</small></div>`}).join(''):'<div class="hr13f-empty">当前没有已提交 Ballot。</div>';
  };
  const reload=async()=>{const r=await fetch('/api/v1/hr/titles/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok)throw new Error('HTTP '+r.status);snapshot=await r.json();render()};
  const run=async(form,msgId,fn)=>{const m=document.getElementById(msgId),b=form.querySelector('button[type="submit"]');b.disabled=true;m.textContent='正在提交…';try{await fn();m.textContent='已保存';await reload()}catch(e){m.textContent=e.message}finally{b.disabled=false}};
  document.getElementById('hr13f-round-form').addEventListener('submit',e=>{e.preventDefault();run(e.currentTarget,'hr13f-round-msg',async()=>{const id=document.getElementById('hr13f-case').value;if(!id)throw new Error('没有可开启评审的案件');await post(`/api/v1/hr/titles/applications/${id}/review-rounds/`,{roundNo:document.getElementById('hr13f-round-no').value.trim(),requiredBallots:Number(document.getElementById('hr13f-required').value),requiredPassVotes:Number(document.getElementById('hr13f-pass-required').value)})})});
  document.getElementById('hr13f-assign-form').addEventListener('submit',e=>{e.preventDefault();run(e.currentTarget,'hr13f-assign-msg',async()=>{const id=document.getElementById('hr13f-assign-round').value;if(!id)throw new Error('没有开放评审轮次');await post(`/api/v1/hr/titles/review-rounds/${id}/assignments/`,{assignmentNo:document.getElementById('hr13f-assignment-no').value.trim(),reviewerStaffId:document.getElementById('hr13f-reviewer').value.trim(),reviewerRole:document.getElementById('hr13f-role').value})})});
  document.getElementById('hr13f-response-form').addEventListener('submit',e=>{e.preventDefault();run(e.currentTarget,'hr13f-response-msg',async()=>{const id=document.getElementById('hr13f-response-id').value,type=document.getElementById('hr13f-response-type').value;if(!id)throw new Error('没有待响应专家分配');await post(`/api/v1/hr/titles/review-assignments/${id}/respond/`,{accept:type==='accept',conflictDeclared:type==='conflict',conflictNote:document.getElementById('hr13f-conflict-note').value.trim()})})});
  document.getElementById('hr13f-ballot-form').addEventListener('submit',e=>{e.preventDefault();run(e.currentTarget,'hr13f-ballot-msg',async()=>{const id=document.getElementById('hr13f-ballot-assignment').value;if(!id)throw new Error('没有可投票专家分配');const score=document.getElementById('hr13f-score').value;await post(`/api/v1/hr/titles/review-assignments/${id}/ballots/`,{ballotNo:document.getElementById('hr13f-ballot-no').value.trim(),recommendation:document.getElementById('hr13f-recommendation').value,score:score===''?null:score,rationale:document.getElementById('hr13f-rationale').value.trim()})})});
  document.getElementById('hr13f-close-form').addEventListener('submit',e=>{e.preventDefault();run(e.currentTarget,'hr13f-close-msg',async()=>{const id=document.getElementById('hr13f-close-round').value;if(!id)throw new Error('没有开放评审轮次');await post(`/api/v1/hr/titles/review-rounds/${id}/close/`)})});
  reload().catch(e=>{document.getElementById('hr13f-round-list').innerHTML=`<div class="hr13f-empty">评审 Authority 读取失败：${esc(e.message)}</div>`});
})();
</script>
{% endblock %}
