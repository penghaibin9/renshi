{% extends "hr_title/workspace_d.html" %}

{% block content %}
{{ block.super }}
<script>
(() => {
  const mq = window.matchMedia('(max-width: 767.98px)');
  const shell = document.querySelector('.oh-wrapper-main');
  const sidebar = document.getElementById('sidebar');
  const toggle = document.querySelector('.oh-navbar__toggle-link');
  let explicitMobileOpen = false;
  let desktopStoredState = null;

  function rememberDesktopState() {
    if (desktopStoredState !== null) return;
    desktopStoredState = localStorage.getItem('sidebarOpen');
  }

  function setNativeMobileClosedState() {
    if (!mq.matches || !shell) return;
    // These are Horilla's canonical shell flags. Mobile starts collapsed, but
    // the sidebar DOM remains intact so the system navbar toggle can open it.
    shell.classList.add('toggle-clicked', 'oh-wrapper-main--closed');
    localStorage.setItem('sidebarOpen', 'false');
  }

  function initialiseMobileShell() {
    if (!mq.matches || !shell) return;
    rememberDesktopState();
    explicitMobileOpen = false;
    setNativeMobileClosedState();
  }

  function syncAfterSystemToggle() {
    if (!mq.matches || !shell) return;
    // Horilla's bundled click handler owns the actual class toggle. Read the
    // resulting state on the next task instead of replacing that behaviour.
    setTimeout(() => {
      explicitMobileOpen = !shell.classList.contains('oh-wrapper-main--closed');
      localStorage.setItem('sidebarOpen', explicitMobileOpen ? 'true' : 'false');
    }, 0);
  }

  function stopDesktopHoverReopen(event) {
    if (!mq.matches || explicitMobileOpen) return;
    // Horilla's desktop sidebar has a mouseover-to-reveal handler. A mobile
    // viewport must not be reopened by synthetic/Chromium hover before the
    // user explicitly presses the system navbar toggle.
    event.stopImmediatePropagation();
    requestAnimationFrame(setNativeMobileClosedState);
  }

  function restoreDesktopState() {
    if (mq.matches || !shell) return;
    explicitMobileOpen = false;
    if (desktopStoredState === 'false') {
      shell.classList.add('toggle-clicked', 'oh-wrapper-main--closed');
      localStorage.setItem('sidebarOpen', 'false');
    } else {
      shell.classList.remove('toggle-clicked', 'oh-wrapper-main--closed');
      if (desktopStoredState === 'true') localStorage.setItem('sidebarOpen', 'true');
      else localStorage.removeItem('sidebarOpen');
    }
    desktopStoredState = null;
  }

  if (sidebar) {
    sidebar.addEventListener('mouseover', stopDesktopHoverReopen, true);
    sidebar.addEventListener('mouseenter', stopDesktopHoverReopen, true);
  }
  if (toggle) toggle.addEventListener('click', syncAfterSystemToggle);

  initialiseMobileShell();
  document.addEventListener('DOMContentLoaded', initialiseMobileShell, {once:true});
  window.addEventListener('load', initialiseMobileShell, {once:true});
  requestAnimationFrame(initialiseMobileShell);

  if (mq.addEventListener) {
    mq.addEventListener('change', (event) => {
      if (event.matches) initialiseMobileShell();
      else restoreDesktopState();
    });
  }
})();
</script>
{% endblock %}
