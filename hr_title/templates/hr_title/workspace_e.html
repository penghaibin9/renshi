{% extends "hr_title/workspace_d.html" %}

{% block content %}
{{ block.super }}
<script>
(() => {
  const mq = window.matchMedia('(max-width: 767.98px)');
  const sidebar = document.getElementById('sidebar');
  let desktopStoredState = null;
  let nativeCloseInFlight = false;

  function rememberDesktopState() {
    if (desktopStoredState !== null) return;
    desktopStoredState = localStorage.getItem('sidebarOpen');
  }

  function sidebarOccupiesViewport() {
    if (!sidebar) return false;
    const rect = sidebar.getBoundingClientRect();
    const style = window.getComputedStyle(sidebar);
    return style.display !== 'none' &&
      style.visibility !== 'hidden' &&
      Number(style.opacity || '1') !== 0 &&
      rect.width > 40 &&
      rect.right > 0 &&
      rect.left < window.innerWidth;
  }

  function closeWithHorillaStateMachine() {
    if (!mq.matches || nativeCloseInFlight || !sidebarOccupiesViewport()) return;
    if (typeof window.handleSidebarToggle !== 'function') return;

    rememberDesktopState();
    nativeCloseInFlight = true;
    // Horilla owns the sidebar state machine in static/index/index.js:
    // handleSidebarToggle() updates #sidebar, .oh-wrapper-main and sidebarOpen
    // together. Reuse it instead of hiding the shell with page-specific CSS.
    window.handleSidebarToggle();
    setTimeout(() => {
      nativeCloseInFlight = false;
      localStorage.setItem('sidebarOpen', sidebarOccupiesViewport() ? 'true' : 'false');
    }, 80);
  }

  function ensureMobileClosed() {
    if (!mq.matches) return;
    rememberDesktopState();
    localStorage.setItem('sidebarOpen', 'false');
    closeWithHorillaStateMachine();
  }

  function restoreDesktopPreference() {
    if (mq.matches || desktopStoredState === null) return;
    if (desktopStoredState === 'true' || desktopStoredState === 'false') {
      localStorage.setItem('sidebarOpen', desktopStoredState);
    } else {
      localStorage.removeItem('sidebarOpen');
    }
    desktopStoredState = null;
  }

  // Set the persisted mobile intent before Horilla's restore path runs, then
  // perform delayed native closes after its bundled handler is guaranteed to
  // exist. A second pass covers late shell initialization without reopening an
  // already-closed sidebar because geometry is checked first.
  if (mq.matches) {
    rememberDesktopState();
    localStorage.setItem('sidebarOpen', 'false');
  }
  document.addEventListener('DOMContentLoaded', () => setTimeout(ensureMobileClosed, 40), { once: true });
  window.addEventListener('load', () => {
    setTimeout(ensureMobileClosed, 80);
    setTimeout(ensureMobileClosed, 240);
  }, { once: true });

  if (mq.addEventListener) {
    mq.addEventListener('change', (event) => {
      if (event.matches) {
        rememberDesktopState();
        localStorage.setItem('sidebarOpen', 'false');
        setTimeout(ensureMobileClosed, 80);
      } else {
        restoreDesktopPreference();
      }
    });
  }
})();
</script>
{% endblock %}
