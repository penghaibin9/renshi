{% extends "hr_title/workspace_d.html" %}

{% block content %}
{{ block.super }}
<script>
(() => {
  const mq = window.matchMedia('(max-width: 767.98px)');
  const shell = document.querySelector('.oh-wrapper-main');
  const sidebar = document.getElementById('sidebar');

  function enforceNativeMobileClosedState() {
    if (!mq.matches || !shell) return;
    // Horilla uses toggle-clicked to remember an explicit user collapse and
    // oh-wrapper-main--closed for the actual shell layout state. Keep those
    // native shell flags authoritative on mobile instead of hiding/removing
    // the sidebar with HR13-only CSS.
    shell.classList.add('toggle-clicked', 'oh-wrapper-main--closed');
    localStorage.setItem('sidebarOpen', 'false');
  }

  function stopDesktopHoverReopen(event) {
    if (!mq.matches) return;
    // templates/sidebar.html contains desktop hover behaviour that reopens a
    // collapsed shell. Touch/mobile has no useful hover affordance, so prevent
    // that desktop-only reopen path while retaining Horilla's own sidebar DOM.
    event.stopImmediatePropagation();
    enforceNativeMobileClosedState();
  }

  if (sidebar) {
    sidebar.addEventListener('mouseover', stopDesktopHoverReopen, true);
    sidebar.addEventListener('mouseenter', stopDesktopHoverReopen, true);
  }

  // Some Horilla bootstrap code runs after this content block and may rewrite
  // the wrapper class from persisted/default desktop state. Observe only the
  // wrapper class and restore the same native closed flags if that happens on
  // a mobile viewport. This avoids timing-based Screenshot C fixes.
  if (shell) {
    const observer = new MutationObserver(() => {
      if (mq.matches && !shell.classList.contains('oh-wrapper-main--closed')) {
        enforceNativeMobileClosedState();
      }
    });
    observer.observe(shell, {attributes: true, attributeFilter: ['class']});
  }

  enforceNativeMobileClosedState();
  document.addEventListener('DOMContentLoaded', enforceNativeMobileClosedState, {once:true});
  window.addEventListener('load', enforceNativeMobileClosedState, {once:true});
  requestAnimationFrame(enforceNativeMobileClosedState);

  if (mq.addEventListener) {
    mq.addEventListener('change', (event) => {
      if (event.matches) enforceNativeMobileClosedState();
    });
  }
})();
</script>
{% endblock %}
