{% extends "hr_title/workspace_f.html" %}

{% block content %}
{{ block.super }}
<style>
.hr13g-panel{margin-top:14px}.hr13g-kpis{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hr13g-chip{padding:6px 9px;border:1px solid #dfe4f0;border-radius:999px;background:#f9fbff;color:#5e687a;font-size:12px}.hr13g-forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.hr13g-form{padding:14px;border:1px solid #e3e7ef;border-radius:14px;background:#fcfdff}.hr13g-form h3{margin:0 0 4px;font-size:15px}.hr13g-form p{margin:0 0 10px;color:#687386;font-size:12px;line-height:1.6}.hr13g-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.hr13g-field{display:grid;gap:5px}.hr13g-field.full{grid-column:1/-1}.hr13g-field label{font-size:12px;font-weight:700;color:#485267}.hr13g-input,.hr13g-select,.hr13g-textarea{width:100%;border:1px solid #d7deea;border-radius:10px;background:#fff;padding:9px 10px}.hr13g-input,.hr13g-select{height:40px}.hr13g-textarea{min-height:76px;resize:vertical}.hr13g-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.hr13g-btn{border:0;border-radius:10px;padding:9px 13px;background:#3856a6;color:#fff;font-weight:700;cursor:pointer}.hr13g-btn.secondary{background:#edf2ff;color:#304d9c}.hr13g-btn.danger{background:#fff0ed;color:#a83f2d}.hr13g-msg{font-size:12px;color:#687386}.hr13g-list{display:grid;gap:8px;margin-top:10px}.hr13g-row{display:grid;grid-template-columns:minmax(160px,1.2fr) minmax(200px,1.35fr) 108px 105px;gap:10px;align-items:center;padding:12px;border:1px solid #e8ebf2;border-radius:12px;background:#fff}.hr13g-row b,.hr13g-row small{display:block;overflow-wrap:anywhere}.hr13g-row small{color:#687386}.hr13g-badge{justify-self:start;padding:4px 9px;border-radius:999px;background:#edf2ff;color:#34549f;font-size:12px;font-weight:700}.hr13g-badge.warn{background:#fff2e8;color:#a14c19}.hr13g-badge.good{background:#eaf8f0;color:#176a43}.hr13g-empty{padding:22px 14px;text-align:center;color:#687386;border:1px dashed #d7deea;border-radius:12px;background:#fcfdff}.hr13g-rule{margin-top:12px;padding:12px;border-radius:12px;background:#fff7ed;color:#885624;font-size:12px;line-height:1.7}
@media(max-width:840px){.hr13g-forms{grid-template-columns:1fr}.hr13g-fields{grid-template-columns:1fr}.hr13g-field.full{grid-column:1}.hr13g-row{grid-template-columns:minmax(0,1fr) auto}.hr13g-row .detail{grid-column:1}.hr13g-row .date{grid-column:2;grid-row:2}}
@media(max-width:390px){.hr13g-row{grid-template-columns:1fr}.hr13g-row .detail,.hr13g-row .date{grid-column:1;grid-row:auto}.hr13g-badge{justify-self:start}}
</style>
{% endblock %}

{% block scripts %}
{{ block.super }}
<script>
(() => {
  const section='{{ section|escapejs }}';
  if (!['publicity','appeals'].includes(section)) return;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';
  const post=async(url,body={})=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d?.error?.message||d?.error?.code||`HTTP ${r.status}`);return d};
  const work=document.querySelector('.hr13c-layout > div');
  if(!work||document.getElementById('hr13g-panel'))return;
  const card=document.createElement('article');card.id='hr13g-panel';card.className='hr13c-card hr13g-panel';
  card.innerHTML=`<h2>公示与异议复核 Authority</h2><p>评审通过只形成拟结果。公示必须真实开窗、异议必须逐条结案，公示期结束且无阻断异议后才能形成正式职称结果。</p>
  <div class="hr13g-kpis"><span class="hr13g-chip">开放公示 <strong id="hr13g-open">—</strong></span><span class="hr13g-chip">待处理异议 <strong id="hr13g-pending">—</strong></span><span class="hr13g-chip">成立异议 <strong id="hr13g-upheld">—</strong></span></div>
  <div class="hr13g-forms">
    <form id="hr13g-open-form" class="hr13g-form"><h3>发起结果公示</h3><p>只能对 PROPOSED 案件发起；开始/结束时间和公示内容形成冻结记录。</p><div class="hr13g-fields"><div class="hr13g-field full"><label>拟通过案件</label><select id="hr13g-case" class="hr13g-select" required></select></div><div class="hr13g-field"><label>公示编号</label><input id="hr13g-pub-no" class="hr13g-input" required placeholder="PUB-2026-001"></div><div class="hr13g-field"><label>开始时间</label><input id="hr13g-start" class="hr13g-input" type="datetime-local" required></div><div class="hr13g-field"><label>结束时间</label><input id="hr13g-end" class="hr13g-input" type="datetime-local" required></div><div class="hr13g-field full"><label>公示内容摘要</label><textarea id="hr13g-content" class="hr13g-textarea" placeholder="拟通过职称、评审结论、公开说明…"></textarea></div></div><div class="hr13g-actions"><button class="hr13g-btn" type="submit">发起公示</button><span id="hr13g-open-msg" class="hr13g-msg"></span></div></form>
    <form id="hr13g-appeal-form" class="hr13g-form"><h3>登记异议</h3><p>只允许在开放公示期内登记；异议是独立事实，不修改原评审 Ballot。</p><div class="hr13g-fields"><div class="hr13g-field full"><label>开放公示</label><select id="hr13g-pub" class="hr13g-select" required></select></div><div class="hr13g-field"><label>异议编号</label><input id="hr13g-appeal-no" class="hr13g-input" required placeholder="APL-2026-001"></div><div class="hr13g-field"><label>异议人引用</label><input id="hr13g-appellant" class="hr13g-input" placeholder="工号/姓名/外部编号"></div><div class="hr13g-field full"><label>异议理由</label><textarea id="hr13g-reason" class="hr13g-textarea" required></textarea></div></div><div class="hr13g-actions"><button class="hr13g-btn secondary" type="submit">登记异议</button><span id="hr13g-appeal-msg" class="hr13g-msg"></span></div></form>
    <form id="hr13g-resolve-form" class="hr13g-form"><h3>异议复核结论</h3><p>成立、驳回、撤回分别留痕；成立异议会阻断公示关闭和正式结果。</p><div class="hr13g-fields"><div class="hr13g-field full"><label>待处理异议</label><select id="hr13g-open-appeal" class="hr13g-select" required></select></div><div class="hr13g-field"><label>结论</label><select id="hr13g-outcome" class="hr13g-select"><option value="REJECTED">异议不成立</option><option value="UPHELD">异议成立</option><option value="WITHDRAWN">异议撤回</option></select></div><div class="hr13g-field full"><label>复核说明</label><textarea id="hr13g-resolution" class="hr13g-textarea"></textarea></div></div><div class="hr13g-actions"><button class="hr13g-btn secondary" type="submit">保存复核结论</button><span id="hr13g-resolve-msg" class="hr13g-msg"></span></div></form>
    <form id="hr13g-close-form" class="hr13g-form"><h3>关闭 / 取消公示</h3><p>关闭前由后端重新校验公示期和异议；取消则回到 PROPOSED 重新处理。</p><div class="hr13g-fields"><div class="hr13g-field full"><label>开放公示</label><select id="hr13g-close-pub" class="hr13g-select" required></select></div></div><div class="hr13g-actions"><button class="hr13g-btn" type="submit">校验并关闭</button><button id="hr13g-cancel" class="hr13g-btn danger" type="button">取消公示</button><span id="hr13g-close-msg" class="hr13g-msg"></span></div></form>
  </div><div class="hr13g-rule">正式结果硬门禁：Case=PUBLICITY 不是充分条件。最新 TitlePublicityRecord 必须 CLOSED，且不存在 OPEN / UPHELD 异议；否则 ProfessionalTitleResultService 拒绝生效。</div>
  <h3 style="margin-top:18px">公示记录</h3><div id="hr13g-pubs" class="hr13g-list"><div class="hr13g-empty">正在读取公示记录…</div></div><h3 style="margin-top:18px">异议与复核</h3><div id="hr13g-appeals" class="hr13g-list"><div class="hr13g-empty">正在读取异议记录…</div></div>`;
  work.appendChild(card);
  let snapshot={};
  const opts=(id,rows,value,label,empty)=>{const el=document.getElementById(id);el.innerHTML=rows.length?rows.map(x=>`<option value="${esc(value(x))}">${esc(label(x))}</option>`).join(''):`<option value="">${esc(empty)}</option>`};
  const render=()=>{const s=snapshot.summary||{};document.getElementById('hr13g-open').textContent=s.openPublicities??0;document.getElementById('hr13g-pending').textContent=s.openAppeals??0;document.getElementById('hr13g-upheld').textContent=s.upheldAppeals??0;const proposed=(snapshot.recentApplications||[]).filter(x=>x.status==='PROPOSED');const pubs=snapshot.recentPublicities||[];const openPubs=pubs.filter(x=>x.status==='OPEN');const appeals=snapshot.recentAppeals||[];const openAppeals=appeals.filter(x=>x.status==='OPEN');opts('hr13g-case',proposed,x=>x.id,x=>`${x.case_no} · ${x.requested_title_name||x.requested_title_code}`,'当前没有待公示案件');opts('hr13g-pub',openPubs,x=>x.id,x=>`${x.publicity_no} · ${String(x.end_at||'').slice(0,16)}`,'当前没有开放公示');opts('hr13g-close-pub',openPubs,x=>x.id,x=>`${x.publicity_no} · ${String(x.end_at||'').slice(0,16)}`,'当前没有开放公示');opts('hr13g-open-appeal',openAppeals,x=>x.id,x=>`${x.appeal_no} · ${x.reason}`,'当前没有待处理异议');document.getElementById('hr13g-pubs').innerHTML=pubs.length?pubs.map(x=>`<div class="hr13g-row"><div><b>${esc(x.publicity_no)}</b><small>案件 ${esc(x.application_case_id)}</small></div><small class="detail">${esc(String(x.start_at||'').slice(0,16))} → ${esc(String(x.end_at||'').slice(0,16))}</small><span class="hr13g-badge ${x.status==='CLOSED'?'good':x.status==='CANCELLED'?'warn':''}">${esc(x.status)}</span><small class="date">${esc(String(x.created_at||'').slice(0,10))}</small></div>`).join(''):'<div class="hr13g-empty">当前没有公示记录</div>';document.getElementById('hr13g-appeals').innerHTML=appeals.length?appeals.map(x=>`<div class="hr13g-row"><div><b>${esc(x.appeal_no)}</b><small>${esc(x.appellant_ref||'未标注异议人')}</small></div><small class="detail">${esc(x.reason)}${x.resolution?' · '+esc(x.resolution):''}</small><span class="hr13g-badge ${x.status==='UPHELD'?'warn':x.status==='REJECTED'||x.status==='WITHDRAWN'?'good':''}">${esc(x.status)}</span><small class="date">${esc(String(x.created_at||'').slice(0,10))}</small></div>`).join(''):'<div class="hr13g-empty">当前没有异议记录</div>'};
  const load=async()=>{const r=await fetch('/api/v1/hr/titles/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok)throw new Error('HTTP '+r.status);snapshot=await r.json();render()};
  const run=async(msg,fn)=>{const el=document.getElementById(msg);try{el.textContent='提交中…';await fn();el.textContent='已完成';await load()}catch(e){el.textContent=e.message}};
  document.getElementById('hr13g-open-form').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('hr13g-case').value;if(!id)return;run('hr13g-open-msg',()=>post(`/api/v1/hr/titles/applications/${id}/publicities/`,{publicityNo:document.getElementById('hr13g-pub-no').value,startAt:document.getElementById('hr13g-start').value,endAt:document.getElementById('hr13g-end').value,contentSnapshot:{summary:document.getElementById('hr13g-content').value}}))});
  document.getElementById('hr13g-appeal-form').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('hr13g-pub').value;if(!id)return;run('hr13g-appeal-msg',()=>post(`/api/v1/hr/titles/publicities/${id}/appeals/`,{appealNo:document.getElementById('hr13g-appeal-no').value,appellantRef:document.getElementById('hr13g-appellant').value,reason:document.getElementById('hr13g-reason').value}))});
  document.getElementById('hr13g-resolve-form').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('hr13g-open-appeal').value;if(!id)return;run('hr13g-resolve-msg',()=>post(`/api/v1/hr/titles/appeals/${id}/resolve/`,{outcome:document.getElementById('hr13g-outcome').value,resolution:document.getElementById('hr13g-resolution').value}))});
  document.getElementById('hr13g-close-form').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('hr13g-close-pub').value;if(!id)return;run('hr13g-close-msg',()=>post(`/api/v1/hr/titles/publicities/${id}/close/`))});document.getElementById('hr13g-cancel').addEventListener('click',()=>{const id=document.getElementById('hr13g-close-pub').value;if(!id)return;run('hr13g-close-msg',()=>post(`/api/v1/hr/titles/publicities/${id}/cancel/`))});load().catch(e=>{document.getElementById('hr13g-pubs').innerHTML=`<div class="hr13g-empty">数据读取失败：${esc(e.message)}</div>`});
})();
</script>
{% endblock %}
