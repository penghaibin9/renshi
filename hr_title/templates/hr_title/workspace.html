<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ section_title }} · HR13</title><style>
:root{--p:#3157d5;--ink:#18233a;--muted:#667085;--line:#e6eaf2;--bg:#f5f7fb;--card:#fff;--good:#087a55;--warn:#a45b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif}.shell{max-width:1500px;margin:auto;padding:26px}.hero{position:relative;overflow:hidden;padding:28px;border-radius:22px;background:linear-gradient(135deg,#172554,#3157d5 58%,#5b7cfa);color:white;box-shadow:0 18px 45px #253d8c22}.hero:after{content:"HR13";position:absolute;right:34px;top:-22px;font-size:112px;font-weight:800;opacity:.07}.eyebrow{font-size:12px;letter-spacing:.16em;opacity:.75}.hero h1{margin:7px 0 6px;font-size:28px}.hero p{margin:0;max-width:880px;color:#dbe5ff}.nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.nav a{white-space:nowrap;padding:9px 13px;border-radius:10px;text-decoration:none;color:#475467;background:#fff;border:1px solid var(--line)}.nav a.active{color:#fff;background:var(--p);border-color:var(--p)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.kpi span{color:var(--muted);font-size:12px}.kpi b{display:block;margin-top:5px;font-size:24px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(290px,.85fr);gap:16px;margin-top:16px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 14px #1d2c4b08}.panel h2{font-size:16px;margin:0 0 4px}.panel .desc{color:var(--muted);font-size:12px;margin:0 0 13px}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:1.2fr 1fr .8fr .7fr;gap:12px;align-items:center;padding:11px 12px;border:1px solid #edf0f5;border-radius:12px}.row small{color:var(--muted)}.badge{justify-self:start;padding:3px 9px;border-radius:99px;background:#eef2ff;color:#3949ab;font-size:12px}.cap{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.cap:last-child{border:0}.ok{color:var(--good)}.off{color:var(--warn)}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.error{margin:20px;padding:18px;border-radius:12px;background:#fff0f0;color:#a61b1b}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:680px){.shell{padding:14px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.row>*:nth-child(3),.row>*:nth-child(4){font-size:12px}}
</style></head><body><main class="shell">{% if access_error %}<div class="error">{{ access_error }}</div>{% else %}<section class="hero"><div class="eyebrow">PROFESSIONAL TITLE REVIEW · AUTHORITY WORKSPACE</div><h1>{{ section_title }}</h1><p>职称制度、申报、资格审查、材料成果、专家评委、评议表决、公示、异议复核与正式结果按业务步骤拆分。所有数字来自当前学校真实 Authority；尚未建模的子域只显示真实状态与待接通提示。</p></section><nav class="nav"><a class="{% if section == 'overview' %}active{% endif %}" href="/hr/titles/">总览</a><a class="{% if section == 'applications' %}active{% endif %}" href="/hr/titles/applications/">职称申报</a><a class="{% if section == 'eligibility' %}active{% endif %}" href="/hr/titles/eligibility/">资格审查</a><a class="{% if section == 'materials' %}active{% endif %}" href="/hr/titles/materials/">材料成果</a><a class="{% if section == 'experts' %}active{% endif %}" href="/hr/titles/experts/">专家评委</a><a class="{% if section == 'deliberation' %}active{% endif %}" href="/hr/titles/deliberation/">评议表决</a><a class="{% if section == 'publicity' %}active{% endif %}" href="/hr/titles/publicity/">结果公示</a><a class="{% if section == 'appeals' %}active{% endif %}" href="/hr/titles/appeals/">异议复核</a><a class="{% if section == 'results' %}active{% endif %}" href="/hr/titles/results/">正式结果</a></nav><section class="grid" id="kpis"></section><section class="layout"><div class="panel"><h2 id="listTitle">当前工作区</h2><p class="desc" id="listDesc"></p><div id="rows" class="rows"><div class="empty">正在读取真实数据…</div></div></div><aside class="panel"><h2>能力接通状态</h2><div id="caps"></div></aside></section>{% endif %}</main><script>
const section='{{ section|escapejs }}';const names={policy:'制度版本',application:'申报主链路',formalResult:'正式结果事实',qualificationReview:'资格审查明细',materials:'材料与代表性成果',expertPanel:'专家/评委组',deliberationVote:'评议表决',publicity:'公示记录',appealReview:'异议复核'};const labels={policyVersions:'制度版本',applications:'全部申报',awaitingQualification:'待资格审查',underReview:'评审中',inPublicity:'公示中',effectiveResults:'生效结果'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function applicationRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.requested_title_name||x.requested_title_code||'未命名职称')}</b><br><small>${esc(x.case_no)}</small></div><div>${esc(x.batch_no||'-')}</div><span class="badge">${esc(x.status)}</span><small>${esc((x.updated_at||'').slice(0,10))}</small></div>`).join(''):'<div class="empty">当前学校暂无职称申报记录</div>'}
function resultRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.title_name||x.title_code||'未命名职称')}</b><br><small>${esc(x.result_no)}</small></div><div>${esc(x.title_level_code||x.title_series_code||'-')}</div><span class="badge">${esc(x.status)}</span><small>${esc(x.effective_from||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无正式职称结果</div>'}
function policyRows(items){return items.length?items.map(x=>`<div class="row"><div><b>${esc(x.name||x.policy_code)}</b><br><small>${esc(x.policy_code)} · v${esc(x.version_no)}</small></div><div>${esc(x.title_level_code||x.title_series_code||'-')}</div><span class="badge">${esc(x.status)}</span><small>${esc(x.effective_from||'-')}</small></div>`).join(''):'<div class="empty">当前学校暂无职称制度版本</div>'}
function filteredRows(d,statuses,emptyText){const items=(d.recentApplications||[]).filter(x=>statuses.includes(x.status));return items.length?applicationRows(items):`<div class="empty">${emptyText}</div>`}
function renderSection(d){const title=document.getElementById('listTitle'),desc=document.getElementById('listDesc'),rows=document.getElementById('rows');if(section==='results'){title.textContent='正式职称结果';desc.textContent='只展示 HR13 正式结果事实；修订、撤销必须形成新事实，禁止覆盖历史。';rows.innerHTML=resultRows(d.recentResults||[]);return}if(section==='applications'){title.textContent='职称申报';desc.textContent='展示真实申报 Case，包括批次、拟申报职称和当前状态。';rows.innerHTML=applicationRows(d.recentApplications||[]);return}if(section==='eligibility'){title.textContent='资格审查';desc.textContent='当前以申报状态呈现待审、退回、通过和拒绝；独立资格审查明细 Authority 尚未接通，不伪造审查记录。';rows.innerHTML=filteredRows(d,['SUBMITTED','RETURNED','ELIGIBLE','REJECTED'],'当前没有处于资格审查阶段的申报');return}if(section==='materials'){title.textContent='材料与代表性成果';desc.textContent='材料、代表性成果及附件事实尚待独立 Authority；不能从申报状态反推“材料齐全”。';rows.innerHTML='<div class="empty">材料与代表性成果 Authority 尚未接通，页面入口已就位</div>';return}if(section==='experts'){title.textContent='专家与评委管理';desc.textContent='专家库、评委组和回避关系尚待 Authority；当前只展示真实进入评审阶段的申报。';rows.innerHTML=filteredRows(d,['UNDER_REVIEW'],'当前没有进入专家评审阶段的申报');return}if(section==='deliberation'){title.textContent='评议与表决';desc.textContent='评分表、表决票和锁定结果尚待 Authority；不以 UNDER_REVIEW 状态伪装已投票。';rows.innerHTML=filteredRows(d,['UNDER_REVIEW'],'当前没有进入评议阶段的申报');return}if(section==='publicity'){title.textContent='结果公示';desc.textContent='公示记录 Authority 尚未接通；这里只显示业务 Case 已进入 PUBLICITY 的真实状态。';rows.innerHTML=filteredRows(d,['PUBLICITY'],'当前没有处于公示期的申报');return}if(section==='appeals'){title.textContent='异议与复核';desc.textContent='异议申请、复核结论与更正链尚待独立 Authority；不会把退回或撤回当作异议复核。';rows.innerHTML='<div class="empty">异议与复核 Authority 尚未接通，页面入口已就位</div>';return}title.textContent='制度与最近申报';desc.textContent='总览优先展示真实制度版本；申报与正式结果由 KPI 和能力状态共同呈现。';rows.innerHTML=policyRows(d.recentPolicies||[])}
async function boot(){const r=await fetch('/api/v1/hr/titles/dashboard/',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok){document.getElementById('rows').innerHTML='<div class="empty">数据读取失败（'+r.status+'）</div>';return}const d=await r.json();document.getElementById('kpis').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="kpi"><span>${v}</span><b>${esc(d.summary[k])}</b></div>`).join('');renderSection(d);document.getElementById('caps').innerHTML=Object.entries(d.capabilities).map(([k,v])=>`<div class="cap"><span>${names[k]||k}</span><b class="${v?'ok':'off'}">${v?'已接通':'待 Authority'}</b></div>`).join('')}boot();
</script></body></html>
