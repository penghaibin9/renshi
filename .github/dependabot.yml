# Keep project dependencies and Actions current (open-source supply chain).
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    labels:
      - dependencies
    commit-message:
      prefix: "[UPDT]"
      include: scope

  - package-ecosystem: pip
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "[UPDT]"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "[UPDT]"
      include: scope
