name: HR Real Browser Click Flow

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: hr-real-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://horilla_user:horilla_pass@127.0.0.1:3306/horilla_db?charset=utf8mb4
  DB_INIT_PASSWORD: ci-db-init-password-not-a-documented-default
  SECRET_KEY: ci-only-strong-secret-key-please-never-use-in-production
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
  COMPANY_SCOPED_PERMISSIONS: "True"
  TENANT_FAIL_CLOSED: "True"
  HR_BROWSER_USERNAME: hr-runtime-browser-auditor
  HR_BROWSER_PASSWORD: runtime-browser-flow-only-password
  HR_BROWSER_BASE_URL: http://127.0.0.1:8000
  HR_BROWSER_ARTIFACT_DIR: artifacts/hr-browser-flow

jobs:
  real-browser-click-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: horilla_db
          MYSQL_USER: horilla_user
          MYSQL_PASSWORD: horilla_pass
          MYSQL_ROOT_PASSWORD: horilla_root_pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhorilla_user -phorilla_pass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Syntax gate for browser harness
        run: python -m py_compile scripts/hr_real_browser_click.py

      - name: Install application and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev pkg-config curl \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi8 shared-mime-info
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Ensure local settings stub
        run: |
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI browser flow' > horilla/settings/local_settings.py
          fi

      - name: Migrate real ephemeral MySQL runtime
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Seed only the technical browser identity
        shell: bash
        run: |
          python manage.py shell <<'PY'
          import os
          from django.contrib.auth import get_user_model
          from django.core.files.uploadedfile import SimpleUploadedFile
          from base.models import Company
          from employee.models import Employee, EmployeeWorkInformation
          from hr_staff.models import HrPerson, HrStaffMaster

          username = os.environ["HR_BROWSER_USERNAME"]
          password = os.environ["HR_BROWSER_PASSWORD"]

          company = Company.objects.create(
              company="跃科 GitHub 真实点击验收学校",
              hq=True,
              address="长沙市 GitHub 点击验收路 1 号",
              country="CN",
              state="Hunan",
              city="Changsha",
              zip="410000",
              icon=SimpleUploadedFile(
                  "runtime-browser-audit.png",
                  b"runtime-browser-audit",
                  content_type="image/png",
              ),
          )
          User = get_user_model()
          user = User.objects.create_superuser(
              username=username,
              email="runtime-browser-audit@example.invalid",
              password=password,
          )
          user.is_new_employee = False
          user.save(update_fields=["is_new_employee"])
          employee = Employee.objects.create(
              employee_user_id=user,
              employee_first_name="GitHub",
              employee_last_name="点击验收员",
              email="runtime-browser-employee@example.invalid",
              phone="13800000003",
              is_active=True,
          )
          work_info, _ = EmployeeWorkInformation._base_manager.get_or_create(
              employee_id=employee,
          )
          if work_info.company_id_id != company.pk:
              work_info.company_id = company
              work_info.save(update_fields=["company_id"])

          person = HrPerson.objects.create(
              tenant_id=company.pk,
              legal_name="GitHub 点击验收员",
              status="ACTIVE",
          )
          HrStaffMaster.objects.create(
              tenant_id=company.pk,
              person_id=person,
              staff_no="RUNTIME-BROWSER-001",
              current_employment_status="ACTIVE",
              legacy_employee_id=employee.pk,
          )
          print(f"seeded company={company.pk} user={user.pk} employee={employee.pk}")
          PY

      - name: Boot real Django and click HR01-HR18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hr-browser-flow
          python manage.py runserver 127.0.0.1:8000 --noreload \
            > artifacts/hr-browser-flow/django-runserver.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/login/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat artifacts/hr-browser-flow/django-runserver.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8000/ready/ \
            | tee artifacts/hr-browser-flow/readiness.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("artifacts/hr-browser-flow/readiness.json").read_text())
          assert payload.get("status") == "ok", payload
          assert payload.get("database_vendor") == "mysql", payload
          PY

          python scripts/hr_real_browser_click.py

      - name: Upload browser trace, screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-real-browser-${{ github.event.pull_request.number || github.run_id }}-${{ github.sha }}
          path: artifacts/hr-browser-flow/
          if-no-files-found: error
          retention-days: 14
