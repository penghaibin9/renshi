name: HR Real Browser Click Flow

on:
  pull_request:
    branches: [agent/renshi-e2e-base-20260820]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: hr-real-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://horilla_user:horilla_pass@127.0.0.1:3306/horilla_db?charset=utf8mb4
  DB_INIT_PASSWORD: ci-db-init-password-not-a-documented-default
  SECRET_KEY: ci-only-strong-secret-key-please-never-use-in-production
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost:8000
  COMPANY_SCOPED_PERMISSIONS: "True"
  TENANT_FAIL_CLOSED: "True"
  MYSQL_CI_ROOT_PASSWORD: horilla_root_pass

jobs:
  real-browser-click-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: horilla_db
          MYSQL_USER: horilla_user
          MYSQL_PASSWORD: horilla_pass
          MYSQL_ROOT_PASSWORD: horilla_root_pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhorilla_user -phorilla_pass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Ensure local settings stub
        run: |
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI browser flow' > horilla/settings/local_settings.py
          fi

      - name: Prepare focused MySQL browser-test database
        shell: bash
        run: |
          set -euo pipefail
          python manage.py migrate --noinput
          python manage.py migrate --check

          python - <<'PY'
          import os
          import MySQLdb

          connection = MySQLdb.connect(
              host="127.0.0.1",
              user="root",
              passwd=os.environ["MYSQL_CI_ROOT_PASSWORD"],
              charset="utf8mb4",
          )
          try:
              cursor = connection.cursor()
              cursor.execute("DROP DATABASE IF EXISTS `test_horilla_db`")
              cursor.execute(
                  "CREATE DATABASE `test_horilla_db` "
                  "CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
              )
              cursor.execute(
                  "GRANT ALL PRIVILEGES ON `test_horilla_db`.* "
                  "TO 'horilla_user'@'%'"
              )
              cursor.execute("FLUSH PRIVILEGES")
          finally:
              connection.close()
          PY

          DATABASE_URL='mysql://horilla_user:horilla_pass@127.0.0.1:3306/test_horilla_db?charset=utf8mb4' \
            python manage.py migrate --run-syncdb --noinput
          DATABASE_URL='mysql://horilla_user:horilla_pass@127.0.0.1:3306/test_horilla_db?charset=utf8mb4' \
            python manage.py migrate --check

      - name: Run only real Chromium click-flow tests
        env:
          HR_BROWSER_FLOW: "1"
          HR_BROWSER_ARTIFACT_DIR: artifacts/hr-browser-flow
        run: |
          python manage.py test \
            hr_core_browser_flow_tests.HrCoreBrowserFlowTests \
            hr_browser_flow_tests.HrBrowserFlowTests \
            --keepdb --noinput --verbosity 2

      - name: Upload browser trace and click evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-real-browser-${{ github.event.pull_request.number || github.run_id }}-${{ github.sha }}
          path: artifacts/hr-browser-flow/
          if-no-files-found: warn
          retention-days: 14
