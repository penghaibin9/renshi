# One-time bootstrap: import pinned Horilla 2.0 into this repository.
name: Bootstrap Horilla 2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-horilla.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Horilla upstream
        uses: actions/checkout@v4
        with:
          repository: horilla/horilla-hr
          ref: eb16ac3bfcbcb74e17a6bc4e93ea3b326059890a
          path: .upstream-src
          fetch-depth: 1

      - name: Import upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.upstream-src/' \
            --exclude 'UPSTREAM_BASELINE.md' \
            --exclude '.github/workflows/bootstrap-horilla.yml' \
            .upstream-src/ ./
          rm -rf .upstream-src
          rm -f .github/workflows/bootstrap-horilla.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: import Horilla 2.0 source snapshot'
          git push origin HEAD:main
