# One-time bootstrap: import pinned Horilla 2.0 into this repository.
name: Bootstrap Horilla 2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-horilla.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone pinned Horilla upstream
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_DIR="$RUNNER_TEMP/horilla-upstream"
          rm -rf "$UPSTREAM_DIR"
          git init "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" remote add origin https://github.com/horilla/horilla-hr.git
          git -C "$UPSTREAM_DIR" fetch --depth 1 origin eb16ac3bfcbcb74e17a6bc4e93ea3b326059890a
          git -C "$UPSTREAM_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$UPSTREAM_DIR" rev-parse HEAD)" = "eb16ac3bfcbcb74e17a6bc4e93ea3b326059890a"

      - name: Import upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_DIR="$RUNNER_TEMP/horilla-upstream"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'UPSTREAM_BASELINE.md' \
            --exclude '.github/workflows/' \
            "$UPSTREAM_DIR/" ./

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: import Horilla 2.0 source snapshot'
          git push origin HEAD:main
