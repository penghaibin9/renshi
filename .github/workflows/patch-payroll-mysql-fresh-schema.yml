name: Patch Payroll MySQL Fresh Schema

on:
  push:
    branches: [agent/renshi-shared-quality-20260812]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/renshi-shared-quality-20260812
      - name: Preserve Allowance state without impossible MySQL index
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('payroll/migrations/0001_initial.py')
          source = path.read_text(encoding='utf-8')
          old = '''            options={\n                "verbose_name": "Allowance",\n                "unique_together": {\n                    (\n                        "title",\n                        "is_taxable",\n                        "is_condition_based",\n                        "field",\n                        "condition",\n                        "value",\n                        "is_fixed",\n                        "amount",\n                        "based_on",\n                        "rate",\n                        "per_attendance_fixed_amount",\n                        "shift_id",\n                        "shift_per_attendance_amount",\n                        "amount_per_one_hr",\n                        "work_type_id",\n                        "work_type_per_attendance_amount",\n                    )\n                },\n            },\n        ),\n        migrations.CreateModel(\n            name="Deduction",\n'''
          new = '''            options={\n                "verbose_name": "Allowance",\n            },\n        ),\n        # MySQL 8 / utf8mb4 cannot create the legacy 16-column unique index:\n        # it exceeds InnoDB's 3072-byte key limit. Preserve Django's canonical\n        # migration state, but deliberately omit only that impossible DDL.\n        migrations.SeparateDatabaseAndState(\n            database_operations=[],\n            state_operations=[\n                migrations.AlterUniqueTogether(\n                    name="allowance",\n                    unique_together={\n                        (\n                            "title",\n                            "is_taxable",\n                            "is_condition_based",\n                            "field",\n                            "condition",\n                            "value",\n                            "is_fixed",\n                            "amount",\n                            "based_on",\n                            "rate",\n                            "per_attendance_fixed_amount",\n                            "shift_id",\n                            "shift_per_attendance_amount",\n                            "amount_per_one_hr",\n                            "work_type_id",\n                            "work_type_per_attendance_amount",\n                        )\n                    },\n                ),\n            ],\n        ),\n        migrations.CreateModel(\n            name="Deduction",\n'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Allowance unique block, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile payroll/migrations/0001_initial.py
      - name: Commit shared payroll migration compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- payroll/migrations/0001_initial.py
          git diff --cached --check
          git commit -m 'fix(mysql): preserve Allowance state without impossible index'
          git push origin HEAD:agent/renshi-shared-quality-20260812
