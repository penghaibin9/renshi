name: Docker / MySQL Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Production Compose must parse as MySQL-only
        shell: bash
        run: |
          cp .env.dist .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          rendered=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config)
          if printf '%s' "$rendered" | grep -Eqi 'postgres|5432'; then
            echo "Production Compose contains a PostgreSQL remnant"
            exit 1
          fi
          rm -f .env

      - name: Build web image
        run: docker compose -f "$COMPOSE_FILE" build web

      - name: Ensure local settings stub
        run: |
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI' > horilla/settings/local_settings.py
          fi

      - name: Start MySQL and Redis
        run: |
          docker compose -f "$COMPOSE_FILE" up -d db redis
          for i in $(seq 1 90); do
            if docker compose -f "$COMPOSE_FILE" exec -T db \
              mysqladmin ping -h 127.0.0.1 -uhorilla_user -phorilla_pass --silent >/dev/null 2>&1; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose -f "$COMPOSE_FILE" logs db
          exit 1

      - name: Migration schema diagnostics
        run: |
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" web python manage.py shell -c '
          from django.apps import apps
          from django.db import connection
          from django.db.migrations.loader import MigrationLoader

          if connection.vendor != "mysql":
              raise SystemExit(f"Docker smoke requires MySQL, got {connection.vendor}")

          loader = MigrationLoader(connection, ignore_no_migrations=True)
          hr_labels = sorted(
              label
              for label in loader.migrated_apps
              if label.startswith("hr_") or label == "hr10_development"
          )
          if not hr_labels:
              raise SystemExit("No migrated HR apps discovered")

          conflicts = {
              label: names
              for label, names in loader.detect_conflicts().items()
              if label in hr_labels
          }
          print("DATABASE_VENDOR", connection.vendor)
          print("HR_MIGRATED_APPS", ",".join(hr_labels))
          for label in hr_labels:
              leaves = loader.graph.leaf_nodes(label)
              print("HR_MIGRATION_LEAVES", label, ",".join(name for _, name in leaves))
          if conflicts:
              raise SystemExit(f"Conflicting HR migration leaves: {conflicts}")
          '

      - name: Fresh migration + checks
        run: |
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" web sh -c '
            set -e
            python manage.py makemigrations --check --dry-run
            python manage.py migrate --noinput
            python manage.py migrate --check
            python manage.py collectstatic --noinput
            python manage.py check
          '

      - name: Real MySQL backup / restore drill
        id: recovery
        run: |
          set -euo pipefail
          rm -rf .ci-backup
          mkdir -p .ci-backup
          chmod 0777 .ci-backup
          set +e
          docker compose -f "$COMPOSE_FILE" run --rm -T --no-deps \
            -e MYSQL_CI_ROOT_PASSWORD=horilla_root_pass \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            --entrypoint "" web python scripts/ci_mysql_recovery.py \
            2>&1 | tee .ci-backup/recovery.log
          recovery_status=${PIPESTATUS[0]}
          set -e
          if [ "$recovery_status" -ne 0 ]; then
            echo "MySQL recovery drill failed with exit code $recovery_status"
            exit "$recovery_status"
          fi
          rm -rf .ci-backup

      - name: Upload MySQL recovery diagnostics
        if: failure() && steps.recovery.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mysql-recovery-diagnostics
          path: |
            .ci-backup/recovery.log
            .ci-backup/recovery-diagnostics.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Start Gunicorn
        run: docker compose -f "$COMPOSE_FILE" up -d web

      - name: Health / readiness must report MySQL
        run: |
          for i in $(seq 1 90); do
            if curl -sf --max-time 5 http://localhost:8000/health/ | grep -q '"status"'; then
              break
            fi
            sleep 2
            if [ "$i" -eq 90 ]; then
              docker compose -f "$COMPOSE_FILE" logs --tail=150 web
              exit 1
            fi
          done
          for i in $(seq 1 60); do
            body=$(curl -sf --max-time 5 http://localhost:8000/ready/ || true)
            if echo "$body" | grep -q '"database_vendor": "mysql"'; then
              echo "$body"
              exit 0
            fi
            sleep 2
          done
          docker compose -f "$COMPOSE_FILE" logs --tail=150 web
          exit 1

      - name: Trivy high/critical gate
        id: trivy
        run: |
          IMAGE=$(docker compose -f "$COMPOSE_FILE" images -q web | head -n1)
          test -n "$IMAGE"
          rm -rf trivy-report
          mkdir -p trivy-report
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-report:/report" \
            aquasec/trivy:0.58.1 image \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --format json --output /report/trivy.json \
            --exit-code 1 "$IMAGE"
          status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("trivy-report/trivy.json").read_text())
          vulnerabilities = []
          for result in report.get("Results") or []:
              target = result.get("Target", "unknown")
              for item in result.get("Vulnerabilities") or []:
                  vulnerabilities.append(
                      (
                          item.get("Severity", ""),
                          target,
                          item.get("PkgName", ""),
                          item.get("VulnerabilityID", ""),
                          item.get("InstalledVersion", ""),
                          item.get("FixedVersion", ""),
                      )
                  )
          print(f"Trivy HIGH/CRITICAL findings: {len(vulnerabilities)}")
          for severity, target, package, cve, installed, fixed in vulnerabilities:
              print(
                  f"{severity} {target} {package} {cve} "
                  f"installed={installed} fixed={fixed}"
              )
          PY
          exit "$status"

      - name: Upload Trivy diagnostics
        if: failure() && steps.trivy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-high-critical-report
          path: trivy-report/trivy.json
          if-no-files-found: error
          retention-days: 3

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans || true
