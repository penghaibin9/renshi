name: Docker / MySQL Smoke

on:
  push:
    branches: [main, agent/renshi-takeover-cleanup-20260810]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        run: docker compose -f "$COMPOSE_FILE" build web

      - name: Ensure local settings stub
        run: |
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI' > horilla/settings/local_settings.py
          fi

      - name: Start MySQL and Redis
        run: |
          docker compose -f "$COMPOSE_FILE" up -d db redis
          for i in $(seq 1 90); do
            if docker compose -f "$COMPOSE_FILE" exec -T db \
              mysqladmin ping -h 127.0.0.1 -uhorilla_user -phorilla_pass --silent >/dev/null 2>&1; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose -f "$COMPOSE_FILE" logs db
          exit 1

      - name: Migration schema diagnostics
        run: |
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" web python manage.py shell -c '
          import importlib
          from django.apps import apps
          from django.db import connection
          from django.db.migrations.loader import MigrationLoader

          config = apps.get_app_config("dictionary")
          print("DICTIONARY_APP", config.name, config.path)
          company = apps.get_model("base", "Company")
          company_pk = company._meta.pk
          print("BASE_COMPANY_PK", company_pk.__class__.__name__, company_pk.db_type(connection))
          general = apps.get_model("dictionary", "HorillaGeneralSettings")
          for field in general._meta.fields:
              if "company" in field.name.lower() or "company" in field.column.lower():
                  print("DICTIONARY_COMPANY_FIELD", field.name, field.column, field.__class__.__name__, field.db_type(connection), getattr(getattr(field, "target_field", None), "__class__", type(None)).__name__)
          loader = MigrationLoader(connection, ignore_no_migrations=True)
          migration = loader.get_migration("dictionary", "0001_initial")
          module_name = migration.__class__.__module__
          module = importlib.import_module(module_name)
          print("DICTIONARY_MIGRATION", module_name, module.__file__)
          for operation in migration.operations:
              if getattr(operation, "name", "").lower() == "horillageneralsettings":
                  for field_name, field in operation.fields:
                      if "company" in field_name.lower():
                          print("MIGRATION_COMPANY_FIELD", field_name, field.__class__.__name__, field.deconstruct())
          '

      - name: Fresh migration + checks
        run: |
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" web sh -c '
            set -e
            python manage.py makemigrations --check --dry-run
            python manage.py migrate --noinput
            python manage.py migrate --check
            python manage.py collectstatic --noinput
            python manage.py check
          '

      - name: Start Gunicorn
        run: docker compose -f "$COMPOSE_FILE" up -d web

      - name: Health / readiness must report MySQL
        run: |
          for i in $(seq 1 90); do
            if curl -sf --max-time 5 http://localhost:8000/health/ | grep -q '"status"'; then
              break
            fi
            sleep 2
            if [ "$i" -eq 90 ]; then
              docker compose -f "$COMPOSE_FILE" logs --tail=150 web
              exit 1
            fi
          done
          for i in $(seq 1 60); do
            body=$(curl -sf --max-time 5 http://localhost:8000/ready/ || true)
            if echo "$body" | grep -q '"database_vendor": "mysql"'; then
              echo "$body"
              exit 0
            fi
            sleep 2
          done
          docker compose -f "$COMPOSE_FILE" logs --tail=150 web
          exit 1

      - name: Trivy high/critical gate
        run: |
          IMAGE=$(docker compose -f "$COMPOSE_FILE" images -q web | head -n1)
          test -n "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans || true
