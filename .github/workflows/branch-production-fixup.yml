name: Branch production fixup

on:
  push:
    branches:
      - fix/production-readiness-20260904

permissions:
  contents: write

concurrency:
  group: branch-production-fixup
  cancel-in-progress: false

jobs:
  fixup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-20260904
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned import sorter
        run: pip install "isort==5.13.2"

      - name: Apply deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          isort --profile black \
            backend/horilla/settings/__init__.py \
            backend/horilla/hr_urls.py \
            backend/base/auth_backends.py \
            backend/employee/scheduler.py

          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/previous-baseline-upgrade.yml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '"base/migrations/0002_initial.py"': '"backend/base/migrations/0002_initial.py"',
              '"payroll/migrations/0001_initial.py"': '"backend/payroll/migrations/0001_initial.py"',
              '            base/migrations/0002_initial.py': '            backend/base/migrations/0002_initial.py',
              '            payroll/migrations/0001_initial.py': '            backend/payroll/migrations/0001_initial.py',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected upgrade-gate path not found: {old}")
              text = text.replace(old, new, 1)
          if '"base/migrations/0002_initial.py"' in text or '"payroll/migrations/0001_initial.py"' in text:
              raise SystemExit("legacy root-relative migration path remains")
          path.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/branch-production-fixup.yml
          git diff --check

      - name: Commit exact fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/horilla/settings/__init__.py \
            backend/horilla/hr_urls.py \
            backend/base/auth_backends.py \
            backend/employee/scheduler.py \
            .github/workflows/previous-baseline-upgrade.yml
          git commit -m "ci: unblock import and baseline upgrade gates"
          git rev-parse HEAD
          git push origin HEAD:fix/production-readiness-20260904
