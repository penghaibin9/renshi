name: HR Visual Audit / Chromium

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "templates/hr/**"
      - "static/hr/**"
      - "hr_*/templates/**"
      - "horilla_theme/templates/hr/**"
      - "hr_visual_audit_tests.py"
      - "hr_v2_visual_audit_tests.py"
      - "hr_v2_shell_regression_tests.py"
      - "hr05_visual_audit_tests.py"
      - "hr06_visual_audit_tests.py"
      - "hr09_visual_audit_tests.py"
      - "hr10_visual_audit_tests.py"
      - "hr11_visual_audit_tests.py"
      - "hr13_visual_audit_tests.py"
      - "hr14_visual_audit_tests.py"
      - "hr15_visual_audit_tests.py"
      - "hr16_visual_audit_tests.py"
      - "hr17_visual_audit_tests.py"
      - "hr18_visual_audit_tests.py"
      - ".github/workflows/hr-visual-audit.yml"

permissions:
  contents: read

concurrency:
  group: hr-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://horilla_user:horilla_pass@127.0.0.1:3306/horilla_db?charset=utf8mb4
  DB_INIT_PASSWORD: ci-db-init-password-not-a-documented-default
  SECRET_KEY: ci-only-strong-secret-key-please-never-use-in-production
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost:8000
  COMPANY_SCOPED_PERMISSIONS: "True"
  TENANT_FAIL_CLOSED: "True"
  MYSQL_CI_ROOT_PASSWORD: horilla_root_pass

jobs:
  hr-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: horilla_db
          MYSQL_USER: horilla_user
          MYSQL_PASSWORD: horilla_pass
          MYSQL_ROOT_PASSWORD: horilla_root_pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhorilla_user -phorilla_pass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Ensure local settings stub
        run: |
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI visual audit' > horilla/settings/local_settings.py
          fi

      - name: Restore migrated MySQL snapshot
        id: schema-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/hr-visual-mysql.sql
          key: hr-visual-mysql-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('**/migrations/*.py', 'requirements.txt', 'horilla/settings/__init__.py') }}

      - name: Prepare visual audit MySQL schemas
        shell: bash
        run: |
          set -euo pipefail
          mysql_container=$(docker ps --filter "ancestor=mysql:8.4" --format '{{.ID}}' | head -n 1)
          test -n "$mysql_container"
          mkdir -p .ci-cache

          if [ "${{ steps.schema-cache.outputs.cache-hit }}" = "true" ]; then
            docker exec -i "$mysql_container" sh -c \
              'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" horilla_db' \
              < .ci-cache/hr-visual-mysql.sql
          else
            python manage.py migrate --noinput
            python manage.py migrate --check
            docker exec "$mysql_container" sh -c \
              'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers --no-tablespaces horilla_db' \
              > .ci-cache/hr-visual-mysql.sql
          fi

          python manage.py migrate --check

          python - <<'PY'
          import os
          import MySQLdb

          connection = MySQLdb.connect(
              host="127.0.0.1",
              user="root",
              passwd=os.environ["MYSQL_CI_ROOT_PASSWORD"],
              charset="utf8mb4",
          )
          try:
              cursor = connection.cursor()
              cursor.execute("DROP DATABASE IF EXISTS `test_horilla_db`")
              cursor.execute(
                  "CREATE DATABASE `test_horilla_db` "
                  "CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
              )
              cursor.execute(
                  "GRANT ALL PRIVILEGES ON `test_horilla_db`.* "
                  "TO 'horilla_user'@'%'"
              )
              cursor.execute("FLUSH PRIVILEGES")
          finally:
              connection.close()
          PY

          docker exec -i "$mysql_container" sh -c \
            'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" test_horilla_db' \
            < .ci-cache/hr-visual-mysql.sql

          DATABASE_URL='mysql://horilla_user:horilla_pass@127.0.0.1:3306/test_horilla_db?charset=utf8mb4' \
            python manage.py migrate --run-syncdb --noinput
          DATABASE_URL='mysql://horilla_user:horilla_pass@127.0.0.1:3306/test_horilla_db?charset=utf8mb4' \
            python manage.py migrate --check

      - name: Capture real Chromium screenshots
        env:
          HR_VISUAL_AUDIT: "1"
          HR_VISUAL_ARTIFACT_DIR: artifacts/hr-visual
        run: |
          python manage.py test \
            hr_v2_visual_audit_tests.HrV2VisualAuditTests \
            hr_v2_shell_regression_tests.HrV2ShellRegressionTests \
            hr05_visual_audit_tests.Hr05VisualAuditTests \
            hr06_visual_audit_tests.Hr06VisualAuditTests \
            hr08_visual_audit_tests.Hr08VisualAuditTests \
            hr09_visual_audit_tests.Hr09VisualAuditTests \
            hr10_visual_audit_tests.Hr10VisualAuditTests \
            hr11_visual_audit_tests.Hr11VisualAuditTests \
            hr13_visual_audit_tests.Hr13VisualAuditTests \
            hr14_visual_audit_tests.Hr14VisualAuditTests \
            hr15_visual_audit_tests.Hr15VisualAuditTests \
            hr16_visual_audit_tests.Hr16VisualAuditTests \
            hr17_visual_audit_tests.Hr17VisualAuditTests \
            hr18_visual_audit_tests.Hr18VisualAuditTests \
            hr_visual_audit_tests.HrVisualAuditTests \
            --keepdb --noinput --verbosity 2

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-visual-${{ github.event.pull_request.number || github.run_id }}-${{ github.sha }}
          path: artifacts/hr-visual/
          if-no-files-found: error
          retention-days: 14
