name: Previous Baseline / MySQL Upgrade

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: previous-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://horilla_user:horilla_pass@127.0.0.1:3306/horilla_upgrade?charset=utf8mb4
  DB_INIT_PASSWORD: ci-db-init-password-not-a-documented-default
  SECRET_KEY: ci-only-strong-secret-key-please-never-use-in-production
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost:8000
  COMPANY_SCOPED_PERMISSIONS: "True"
  TENANT_FAIL_CLOSED: "True"

jobs:
  base-to-head-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: horilla_upgrade
          MYSQL_USER: horilla_user
          MYSQL_PASSWORD: horilla_pass
          MYSQL_ROOT_PASSWORD: horilla_root_pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhorilla_user -phorilla_pass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout PR base exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev pkg-config \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi8 shared-mime-info

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Keep the gate able to materialize an older PR base even if that
          # historical requirements file did not yet declare the MySQL driver.
          pip install "mysqlclient>=2.2,<3"

      - name: Verify baseline MySQL migration compatibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          python - <<'PY'
          import ast
          from pathlib import Path


          def call_name(node):
              func = node.func
              if isinstance(func, ast.Attribute):
                  return func.attr
              if isinstance(func, ast.Name):
                  return func.id
              return ""


          def keyword_value(call, name, default=None):
              for keyword in call.keywords:
                  if keyword.arg == name:
                      try:
                          return ast.literal_eval(keyword.value)
                      except (ValueError, TypeError, SyntaxError):
                          return default
              return default


          def find_unique_together_offenses(path, model_name, forbidden_fields):
              source = Path(path).read_text(encoding="utf-8")
              tree = ast.parse(source, filename=path)
              offenses = []

              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  operation = call_name(node)

                  if operation == "CreateModel":
                      name = keyword_value(node, "name")
                      if name != model_name:
                          continue
                      options = keyword_value(node, "options", {}) or {}
                      unique_together = options.get("unique_together", set())
                      normalized = {tuple(fields) for fields in unique_together}
                      if tuple(forbidden_fields) in normalized:
                          offenses.append(
                              f"{path}: CreateModel({model_name}) contains "
                              f"unsafe unique_together={tuple(forbidden_fields)!r}"
                          )

                  if operation == "AlterUniqueTogether":
                      name = keyword_value(node, "name")
                      if str(name).lower() != model_name.lower():
                          continue
                      unique_together = keyword_value(node, "unique_together", set()) or set()
                      normalized = {tuple(fields) for fields in unique_together}
                      if tuple(forbidden_fields) in normalized:
                          offenses.append(
                              f"{path}: AlterUniqueTogether({model_name}) contains "
                              f"unsafe unique_together={tuple(forbidden_fields)!r}"
                          )

              return offenses


          offenses = []
          offenses.extend(
              find_unique_together_offenses(
                  "base/migrations/0001_initial.py",
                  "Company",
                  ("company", "address"),
              )
          )
          offenses.extend(
              find_unique_together_offenses(
                  "base/migrations/0002_initial.py",
                  "Company",
                  ("company", "address"),
              )
          )
          offenses.extend(
              find_unique_together_offenses(
                  "payroll/migrations/0001_initial.py",
                  "Allowance",
                  (
                      "title",
                      "is_taxable",
                      "is_condition_based",
                      "field",
                      "condition",
                      "value",
                      "is_fixed",
                      "amount",
                      "based_on",
                      "rate",
                      "per_attendance_fixed_amount",
                      "shift_id",
                      "shift_per_attendance_amount",
                      "amount_per_one_hr",
                      "work_type_id",
                      "work_type_per_attendance_amount",
                  ),
              )
          )

          if offenses:
              raise SystemExit(
                  "Previous baseline is not directly materializable on MySQL 8.4:\n- "
                  + "\n- ".join(offenses)
                  + "\nFix the baseline migration itself before treating it as a production baseline."
              )

          print("Baseline migration graph is already MySQL-compatible; no CI-time mutation required.")
          PY
          python -m py_compile \
            base/migrations/0001_initial.py \
            base/migrations/0002_initial.py \
            payroll/migrations/0001_initial.py

      - name: Materialize previous production baseline schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI' > horilla/settings/local_settings.py
          fi
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Checkout PR head exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install head dependencies
        run: |
          pip install -r requirements.txt

      - name: Upgrade previous baseline schema to exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI' > horilla/settings/local_settings.py
          fi
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Assert no unapplied head migration remains
        shell: bash
        run: |
          set -euo pipefail
          plan=$(python manage.py showmigrations --plan)
          printf '%s\n' "$plan"
          if printf '%s\n' "$plan" | grep -Eq '^[[:space:]]*\[ \]'; then
            echo "::error title=Previous-baseline upgrade incomplete::Unapplied migration remains after base-to-head upgrade"
            exit 1
          fi
