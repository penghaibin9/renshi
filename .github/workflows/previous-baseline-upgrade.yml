name: Previous Baseline / MySQL Upgrade

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: previous-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://renshi_user:renshi_pass@127.0.0.1:3306/renshi_upgrade?charset=utf8mb4
  DB_INIT_PASSWORD: ci-db-init-password-not-a-documented-default
  SECRET_KEY: ci-only-strong-secret-key-please-never-use-in-production
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost:8000
  COMPANY_SCOPED_PERMISSIONS: "True"
  TENANT_FAIL_CLOSED: "True"

jobs:
  base-to-head-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: renshi_upgrade
          MYSQL_USER: renshi_user
          MYSQL_PASSWORD: renshi_pass
          MYSQL_ROOT_PASSWORD: renshi_root_pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -urenshi_user -prenshi_pass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout PR base exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev pkg-config \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi8 shared-mime-info

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # Keep the gate able to materialize an older PR base even if that
          # historical requirements file did not yet declare the MySQL driver.
          pip install "mysqlclient>=2.2,<3"

      - name: Apply baseline-only MySQL migration compatibility shims
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          python - <<'PY'
          import ast
          from pathlib import Path


          TARGETS = {
              "base/migrations/0002_initial.py": {
                  ("company", ("company", "address")),
              },
              "payroll/migrations/0001_initial.py": {
                  (
                      "allowance",
                      (
                          "title",
                          "is_taxable",
                          "is_condition_based",
                          "field",
                          "condition",
                          "value",
                          "is_fixed",
                          "amount",
                          "based_on",
                          "rate",
                          "per_attendance_fixed_amount",
                          "shift_id",
                          "shift_per_attendance_amount",
                          "amount_per_one_hr",
                          "work_type_id",
                          "work_type_per_attendance_amount",
                      ),
                  ),
              },
          }


          def call_name(node):
              func = node.func
              if isinstance(func, ast.Attribute):
                  return func.attr
              if isinstance(func, ast.Name):
                  return func.id
              return ""


          def keyword_node(call, name):
              for keyword in call.keywords:
                  if keyword.arg == name:
                      return keyword.value
              return None


          def literal_keyword(call, name, default=None):
              value = keyword_node(call, name)
              if value is None:
                  return default
              try:
                  return ast.literal_eval(value)
              except (ValueError, TypeError, SyntaxError):
                  return default


          class CompatibilityShim(ast.NodeTransformer):
              def __init__(self, expected):
                  self.expected = expected
                  self.seen = set()

              def visit_Call(self, node):
                  node = self.generic_visit(node)
                  if call_name(node) != "AlterUniqueTogether":
                      return node

                  model_name = str(literal_keyword(node, "name", "")).lower()
                  unique_together = literal_keyword(node, "unique_together", set()) or set()
                  normalized = {tuple(fields) for fields in unique_together}
                  matches = {
                      (model_name, fields)
                      for candidate_model, fields in self.expected
                      if candidate_model == model_name and fields in normalized
                  }
                  if not matches:
                      return node
                  if len(matches) != 1:
                      raise RuntimeError(
                          f"ambiguous baseline compatibility target: {sorted(matches)!r}"
                      )

                  target = next(iter(matches))
                  if target in self.seen:
                      raise RuntimeError(f"duplicate baseline compatibility target: {target!r}")
                  self.seen.add(target)

                  # Preserve Django migration state exactly while omitting only
                  # the historical MySQL-impossible database DDL. This mutation
                  # is ephemeral on the checked-out PR base; the PR head itself
                  # is never rewritten.
                  wrapped = ast.Call(
                      func=ast.Attribute(
                          value=ast.Name(id="migrations", ctx=ast.Load()),
                          attr="SeparateDatabaseAndState",
                          ctx=ast.Load(),
                      ),
                      args=[],
                      keywords=[
                          ast.keyword(arg="database_operations", value=ast.List(elts=[], ctx=ast.Load())),
                          ast.keyword(
                              arg="state_operations",
                              value=ast.List(elts=[node], ctx=ast.Load()),
                          ),
                      ],
                  )
                  return ast.copy_location(wrapped, node)


          for path_text, expected in TARGETS.items():
              path = Path(path_text)
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=path_text)
              transformer = CompatibilityShim(expected)
              tree = transformer.visit(tree)
              ast.fix_missing_locations(tree)

              missing = expected - transformer.seen
              if missing:
                  raise SystemExit(
                      f"baseline compatibility contract changed in {path_text}; "
                      f"expected targets not found: {sorted(missing)!r}"
                  )
              if transformer.seen != expected:
                  raise SystemExit(
                      f"unexpected baseline compatibility targets in {path_text}: "
                      f"{sorted(transformer.seen - expected)!r}"
                  )

              path.write_text(ast.unparse(tree) + "\n", encoding="utf-8")
              print(f"Applied targeted MySQL state-only shim: {path_text} {sorted(transformer.seen)!r}")
          PY
          python -m py_compile \
            base/migrations/0002_initial.py \
            payroll/migrations/0001_initial.py

      - name: Materialize previous production baseline schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          settings_dir=backend/horilla/settings
          if [ ! -d "$settings_dir" ]; then settings_dir=horilla/settings; fi
          if [ ! -f "$settings_dir/local_settings.py" ]; then
            printf '%s\n' '# Ephemeral for CI' > "$settings_dir/local_settings.py"
          fi
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Checkout PR head exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install head dependencies
        run: |
          pip install -r requirements.lock

      - name: Upgrade previous baseline schema to exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          if [ ! -f backend/horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI' > backend/horilla/settings/local_settings.py
          fi
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Assert no unapplied head migration remains
        shell: bash
        run: |
          set -euo pipefail
          plan=$(python manage.py showmigrations --plan)
          printf '%s\n' "$plan"
          if printf '%s\n' "$plan" | grep -Eq '^[[:space:]]*\[ \]'; then
            echo "::error title=Previous-baseline upgrade incomplete::Unapplied migration remains after base-to-head upgrade"
            exit 1
          fi
