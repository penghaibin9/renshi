name: Previous Baseline / MySQL Upgrade

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: previous-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://horilla_user:horilla_pass@127.0.0.1:3306/horilla_upgrade?charset=utf8mb4
  DB_INIT_PASSWORD: ci-db-init-password-not-a-documented-default
  SECRET_KEY: ci-only-strong-secret-key-please-never-use-in-production
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost:8000
  COMPANY_SCOPED_PERMISSIONS: "True"
  TENANT_FAIL_CLOSED: "True"

jobs:
  base-to-head-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: horilla_upgrade
          MYSQL_USER: horilla_user
          MYSQL_PASSWORD: horilla_pass
          MYSQL_ROOT_PASSWORD: horilla_root_pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhorilla_user -phorilla_pass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout PR base exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev pkg-config \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi8 shared-mime-info

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # main predates the explicit MySQL runtime dependency. The upgrade
          # gate supplies only the backend driver so the historical schema can
          # be materialized in the same MySQL engine used in production.
          pip install "mysqlclient>=2.2,<3"

      - name: Apply baseline-only MySQL migration compatibility shim
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          python - <<'PY'
          from pathlib import Path

          path = Path("base/migrations/0002_initial.py")
          source = path.read_text(encoding="utf-8")
          old = (
              '        migrations.AlterUniqueTogether(\n'
              '            name="company",\n'
              '            unique_together={("company", "address")},\n'
              '        ),\n'
          )
          new = (
              '        # Baseline-only MySQL compatibility shim: MySQL 8.4 cannot\n'
              '        # create a unique index directly on TEXT address without a prefix\n'
              '        # length (error 1170). Keep Django migration state canonical while\n'
              '        # omitting only the impossible historical database DDL.\n'
              '        migrations.SeparateDatabaseAndState(\n'
              '            database_operations=[],\n'
              '            state_operations=[\n'
              '                migrations.AlterUniqueTogether(\n'
              '                    name="company",\n'
              '                    unique_together={("company", "address")},\n'
              '                ),\n'
              '            ],\n'
              '        ),\n'
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f"expected exactly one legacy company/address unique_together, found {count}"
              )
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile base/migrations/0002_initial.py
          git diff --check -- base/migrations/0002_initial.py
          git diff -- base/migrations/0002_initial.py

      - name: Materialize previous production baseline schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI' > horilla/settings/local_settings.py
          fi
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Checkout PR head exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install head dependencies
        run: |
          pip install -r requirements.txt

      - name: Upgrade previous baseline schema to exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI' > horilla/settings/local_settings.py
          fi
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Assert no unapplied head migration remains
        shell: bash
        run: |
          set -euo pipefail
          plan=$(python manage.py showmigrations --plan)
          printf '%s\n' "$plan"
          if printf '%s\n' "$plan" | grep -Eq '^[[:space:]]*\[ \]'; then
            echo "::error title=Previous-baseline upgrade incomplete::Unapplied migration remains after base-to-head upgrade"
            exit 1
          fi
