name: One-branch MySQL gate patch

on:
  push:
    branches:
      - fix/production-readiness-20260904

permissions:
  contents: write

concurrency:
  group: one-branch-mysql-gate-patch
  cancel-in-progress: false

jobs:
  patch-exact-targets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-20260904
          fetch-depth: 0

      - name: Patch exact MySQL gates and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          step = (
              "      - name: Authorize immutable-fact trigger DDL in ephemeral MySQL\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          mysql_container=$(docker ps --filter \"ancestor=mysql:8.4\" --format '{{.ID}}' | head -n 1)\n"
              "          test -n \"$mysql_container\"\n"
              "          docker exec \"$mysql_container\" sh -c 'exec mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e \"SET GLOBAL log_bin_trust_function_creators = 1; SELECT @@GLOBAL.log_bin_trust_function_creators;\"'\n"
              "\n"
          )

          targets = {
              Path('.github/workflows/quality.yml'):
                  "      - name: Ensure local settings stub\n",
              Path('.github/workflows/previous-baseline-upgrade.yml'):
                  "      - name: Apply baseline-only MySQL migration compatibility shims\n",
              Path('.github/workflows/hr-browser-flow.yml'):
                  "      - name: Ensure local settings stub\n",
              Path('.github/workflows/hr-w-b-browser.yml'):
                  "      - name: Ensure local settings stub\n",
          }

          for path, anchor in targets.items():
              text = path.read_text(encoding='utf-8')
              if 'Authorize immutable-fact trigger DDL in ephemeral MySQL' in text:
                  raise SystemExit(f'{path}: target step already exists')
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: insertion anchor changed')
              path.write_text(text.replace(anchor, step + anchor, 1), encoding='utf-8')
              print(f'patched {path}')

          Path('.github/workflows/_one_branch_mysql_gate_patch.yml').unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/quality.yml \
            .github/workflows/previous-baseline-upgrade.yml \
            .github/workflows/hr-browser-flow.yml \
            .github/workflows/hr-w-b-browser.yml \
            .github/workflows/_one_branch_mysql_gate_patch.yml
          git diff --cached --check
          git commit -m "ci(mysql): authorize immutable fact trigger DDL"
          git push origin HEAD:fix/production-readiness-20260904
